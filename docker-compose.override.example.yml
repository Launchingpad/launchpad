# Example override for docker-compose.yml: NAMED Docker volumes instead of host
# directories. Docker makes and owns them, so Docker Desktop on macOS and disks
# that refuse chown (NFS with root squash, exFAT) work without trouble.
# The cost: the data is inside Docker's own storage, not in a folder you pick.
#
#   cp docker-compose.override.example.yml docker-compose.override.yml
#   docker compose up -d        # compose reads docker-compose.override.yml
#
# `!override` replaces the bind mount lists of the base file. Start with an
# empty data directory: this does not move data that is in ./data already.
# docker-compose.override.yml is yours; it is not checked by
# deploy/check-compose.sh. Keep the other hardening: change only volumes.
services:
  volume-init:
    volumes: !override
      - db_data:/db
      - backup_data:/backups
      - file_data:/files
      - import_work:/import-work
  postgres:
    volumes: !override
      - db_data:/var/lib/postgresql/data
  silo:
    volumes: !override
      - file_data:/data
  backup:
    volumes: !override
      - backup_data:/backups
      - ./deploy/backup/backup.sh:/backup/backup.sh:ro

volumes:
  db_data:
  file_data:
  backup_data:
