openapi: 3.1.0
info:
  title: Launchpad API
  version: 0.4.0 (T5 GitLab webhooks)
  description: |
    Launchpad, the issue tracker. Every org-scoped route sits under
    `/api/v1/orgs/{org}`. A row from another org is always `404 not_found`;
    a reference to one inside a request body is `400 validation_failed`.

    Team access (docs/internal/decisions-T20-team-access.md): a member sees
    all teams or selected teams; org admins see all. A token sees what its
    owner sees. A row of a team the caller cannot see is treated exactly as a
    row that does not exist: `404 not_found` in a path, the unknown-reference
    `400 validation_failed` in a body, the answer of an unknown value in a
    filter, and left out of every list, count and the change feed. There is
    no `403` on team grounds.

    Auth: `Authorization: Bearer odt_...` (a personal access token, kind
    `pat`, or a native app's login token, kind `native`, from
    `POST /auth/otp/verify` with `"client":"native"`), OR the web session
    cookie `__Host-odt_session` (kind `session`, from `POST /auth/otp/verify`).
    The kinds do not cross (LAUN-129): the value of the web cookie sent as a
    bearer token, and a native token sent as the cookie, are both refused with
    the same `401 invalid_token` an unknown token gets.
    When both are sent, the bearer token wins.
    Scopes are cumulative (admin > write > read). The admin scope also needs
    the org admin role. A token may be pinned to one org; it then sees only
    that org. A session is never pinned.

    CSRF (cookie requests only): every request authenticated by the cookie
    with a method other than GET, HEAD or OPTIONS must send the header
    `X-CSRF-Token` with the value of the `__Host-odt_csrf` cookie (the same value
    is `csrfToken` in the login response). Otherwise it is `403
    csrf_failed`. Bearer requests need no CSRF header.

    CORS: only the origins in the server's `WEB_ORIGINS` (exact match) get
    CORS headers, with credentials allowed. Allowed request headers:
    Authorization, Content-Type, X-CSRF-Token, Idempotency-Key,
    Last-Event-ID. Exposed response headers: Idempotent-Replayed,
    Retry-After.

    Cookie names: every server except a local dev one (LOG_ENV=local) sets
    Secure cookies named `__Host-odt_session` and `__Host-odt_csrf` (Path=/,
    no Domain). A local dev server, on plain http, uses `odt_session` and
    `odt_csrf` without Secure. A server reads only its own names.

    Errors are always `{"error": "...", "code": "..."}` with a code from
    `ErrorCode`.

    This file must describe exactly the routes in
    `server/internal/api/router.go`. `TestOpenAPIMatchesRoutes` fails when
    they drift.
servers:
  - url: http://localhost:8090
    description: Local compose stack (DEV_OPS_APP_PORT may move it)
security:
  - bearer: []
  - session: []
    csrf: []
tags:
  - name: auth
  - name: meta
  - name: orgs
  - name: teams
  - name: products
    description: Products, a named group of teams (LAUN-62, docs/internal/decisions-T18-products.md)
  - name: labels
  - name: issues
  - name: comments
  - name: relations
  - name: attachments
  - name: projects
  - name: milestones
  - name: cycles
  - name: documents
  - name: users
  - name: tokens
  - name: notifications
    description: Notification preferences, team follows and issue subscriptions (LAUN-32, docs/internal/decisions-T13-notifications.md)
  - name: integrations
    description: Git host connections of an org (T17, docs/internal/decisions-T17-git-connections-import.md)
  - name: gitlab
  - name: github
  - name: bitbucket
  - name: events
  - name: platform
  - name: signups
    description: Sign-up requests (sign-up mode approval; docs/internal/decisions-T12-signups-invites.md)
  - name: invites
    description: Org invites (sign-up mode invite or approval)
  - name: import
    description: The Linear import in the web app (LAUN-8, docs/internal/decisions-T17-git-connections-import.md #36 to #45)

paths:
  /healthz:
    get:
      tags: [meta]
      operationId: health
      summary: Liveness and database check
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
        "503": { $ref: "#/components/responses/Error" }

  /api/v1/openapi.yaml:
    get:
      tags: [meta]
      operationId: getOpenAPI
      summary: This document
      security: []
      responses:
        "200":
          description: The OpenAPI document
          content:
            application/yaml:
              schema: { type: string }

  /api/v1/auth/otp:
    post:
      tags: [auth]
      operationId: requestLoginCode
      summary: Email a one-time login code
      description: |
        Always `202` with the body `{}`, whether or not the email belongs to
        a person who can log in, so the answer reveals nothing. Only an
        existing, active, human user who is a member of an org gets a code
        (login is invite-only). The code has 6 digits, lives 10 minutes, is
        single-use, and replaces any earlier code for that person.

        Limits: 5 requests per email per hour (`429 rate_limited`, the same
        for every email), plus a coarse limit on the route. The body must
        be sent with `Content-Type: application/json`. The route ignores
        cookies. `503 login_unavailable` when the server has no mail
        transport.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginCodeRequest" }
      responses:
        "202":
          description: Accepted. If the email can log in, a code is on its way.
          content:
            application/json:
              schema: { type: object, additionalProperties: false }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/LoginUnavailable" }

  /api/v1/auth/otp/verify:
    post:
      tags: [auth]
      operationId: verifyLoginCode
      summary: Exchange a login code for a web session
      description: |
        On success, sets two cookies and returns the person, their orgs and
        the CSRF token:

        - `__Host-odt_session`: the session token. HttpOnly, SameSite=Lax, Path=/, no Domain,
          Secure (except on a local dev server), 30 days.
        - `__Host-odt_csrf`: the CSRF token, readable by JavaScript. Same
          attributes but not HttpOnly. Send its value as `X-CSRF-Token`.

        A wrong, expired, used, replaced or locked code is `401
        invalid_code`, and so is an email that cannot log in. Five wrong
        tries lock the code: after that even the right code fails, and the
        person must request a new one. The route ignores cookies, and the
        body must be sent with `Content-Type: application/json`.

        **Native clients (LAUN-122).** With `"client":"native"` the rules are
        the same (300 ms floor, limits, five tries, the same `401`), but the
        route sets NO cookie and the 200 body holds the session token in
        `token` (shown once, 30 days) and no CSRF value. Send it as
        `Authorization: Bearer <token>`; `POST /auth/logout` revokes it. An
        unknown `client` value is `400 validation_failed`. The default is
        `"web"`.

        **A browser cannot use native mode (LAUN-137).** `"client":"native"`
        with an `Origin`, `Sec-Fetch-Site` or `Sec-Fetch-Mode` header (any
        value) is the plain `401 invalid_code` a wrong code gets, and the
        code and the tries are not spent. A native app is not a browser and
        sends none of these headers. Web mode is unchanged. This is not a security
        boundary against a script that sends the code to another server.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginVerifyRequest" }
      responses:
        "200":
          description: Logged in
          headers:
            Set-Cookie:
              description: "Client web only: `__Host-odt_session` and `__Host-odt_csrf` (two headers; bare names on a local dev server). Client native: none."
              schema: { type: string }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/LoginResponse"
                  - $ref: "#/components/schemas/LoginNativeResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: "invalid_code"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/LoginUnavailable" }

  /api/v1/setup:
    get:
      tags: [auth]
      operationId: getSetup
      summary: Whether first-run setup is open
      description: |
        `setupRequired` is true while the install has no user at all. Public
        and cheap: the web app calls it to choose between the setup page and
        the login page.
      security: []
      responses:
        "200":
          description: Setup state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }
    post:
      tags: [auth]
      operationId: completeSetup
      summary: First-run setup - the first user, the org and its first team
      description: |
        One instance is one org (decisions-T8). While the install has no
        user, the server logs a setup link at boot,
        `<PUBLIC_BASE_URL>/setup#<token>` (24 hours, single use; every new
        link closes the older ones). `token` is that fragment.

        In one transaction this creates: the user (a platform admin, and
        admin of the org), the org, its first team with the eight default
        states, the Bug / Improvement / Feature labels, a web session and the
        first admin token. It answers like `POST /auth/otp/verify` (the two
        session cookies and the login body) plus `token`: a PAT with read,
        write and admin, pinned to the new org, with no expiry (a human PAT,
        decisions-T8 #14). Its
        `secret` is shown here once and stored nowhere. This is the one place
        that returns a first one with no expiry or the admin scope; a web
        session may mint other tokens with `expiresInDays` (decisions-T11).
        More teams: `POST /orgs/{org}/teams`.

        A wrong, expired, used or replaced link is `401
        invalid_setup_token`. Once any user exists, a well-formed
        request is `409 setup_complete` (a malformed token is still 401). A body that fails validation is `400` and leaves the
        link usable. The body must be sent with `Content-Type:
        application/json`; the route ignores cookies and is rate limited.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        "201":
          description: Set up and logged in
          headers:
            Set-Cookie:
              description: "`__Host-odt_session` and `__Host-odt_csrf` (two headers; bare names on a local dev server)"
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: "invalid_setup_token"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "setup_complete (the install has a user), or conflict (an org with that slug survives from deleted users)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: "unsupported_media_type"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the session
      description: |
        Revokes the session token and clears both cookies. With the session
        cookie it needs the `X-CSRF-Token` header. A native app's login token
        (kind `native`, LAUN-122) logs out as a bearer token, with no CSRF header. A PAT cannot
        log out (`403 forbidden`); revoke it with `DELETE .../tokens/{id}`.
      security:
        - bearer: []
        - session: []
          csrf: []
      responses:
        "204":
          description: Logged out
          headers:
            Set-Cookie:
              description: "`__Host-odt_session` and `__Host-odt_csrf`, both expired (bare names on a local dev server)"
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: The current session, to rebuild web state after a reload
      description: |
        The same body as `POST /auth/otp/verify`, for the credential of this
        request. Nothing is rotated: no cookie is set. With the session
        cookie, `csrfToken` is this session's CSRF token, which equals a
        valid `__Host-odt_csrf` cookie (it is derived from the session, never
        echoed from the cookie). With a bearer token the route works too,
        and `csrfToken` is the empty string. `orgs` is only the pinned org
        for a pinned token. No session or a dead one: `401`.
      responses:
        "200":
          description: The current session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/me:
    get:
      tags: [meta]
      operationId: getMe
      summary: The authenticated caller and its token
      responses:
        "200":
          description: Caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/me/sessions:
    get:
      tags: [auth]
      operationId: listMySessions
      summary: The caller's own login sessions
      description: |
        LAUN-130 (docs/internal/decisions-T6a.md "Sessions list"). The caller's own live
        login sessions (web `session` and `native`), newest first, 200 at most. A PAT, a
        revoked or an expired session is not listed. `current` marks the session that made
        this call (false for every row when the caller uses a PAT). `lastUsedAt` is
        throttled to once a minute. No token value, hash, prefix, address or User-Agent.
        An agent token gets `403 forbidden`.
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/me/preferences:
    get:
      tags: [auth]
      operationId: getMyPreferences
      summary: The caller's display preferences
      description: |
        LAUN-235 (docs/internal/decisions-T42-themes.md). The caller's own display
        preferences, install-wide: one value per person, the same in every org and on
        every device. Today the theme only; `linear` when none is stored. An agent token
        gets `403 forbidden`.
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPreferences" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [auth]
      operationId: putMyPreferences
      summary: Set the caller's display preferences
      description: |
        Stores the theme (`linear`, `paper` or `terminal`; any other value is
        `400 validation_failed`). The last write wins; the answer is the value now
        stored. Replay-safe. A cookie session needs `X-CSRF-Token`. An agent token gets
        `403 forbidden`. Emits no event (a user-private row, decisions-T23 #4).
      security:
        - bearer: []
        - session: []
          csrf: []
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserPreferencesInput" }
      responses:
        "200":
          description: The stored value
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPreferences" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/me/sessions/revoke-others:
    post:
      tags: [auth]
      operationId: revokeOtherSessions
      summary: Log out everywhere else
      description: |
        Revokes every live session of the caller except the one that made the call (a PAT
        caller has none, so all are revoked). `revoked` counts rows that were not yet revoked, so it can
        include sessions that had already expired and so is not listed; it can be higher than the
        number of listed sessions. Replay-safe; takes no `Idempotency-Key`. A
        cookie session needs `X-CSRF-Token`. An agent token gets `403 forbidden`. Emits no
        event (user-private rows, decisions-T13 #32); the server logs one audit line.
      security:
        - bearer: []
        - session: []
          csrf: []
      responses:
        "200":
          description: How many sessions were revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevokedSessions" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/me/sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [auth]
      operationId: revokeMySession
      summary: Revoke one of the caller's own sessions
      description: |
        The token stops working at once. Revoking twice is `204`. Another person's id, a
        PAT's id and an unknown id are all `404 not_found`. Revoking the session of this
        very request is allowed (it is a logout; a cookie session also gets the cookies
        cleared). A cookie session needs `X-CSRF-Token`. An agent token gets `403
        forbidden`. Emits no event; the server logs one audit line.
      security:
        - bearer: []
        - session: []
          csrf: []
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/orgs:
    get:
      tags: [orgs]
      operationId: listOrgs
      summary: Orgs the caller belongs to (only the pinned org for a pinned token)
      responses:
        "200":
          description: Orgs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/orgs/{org}:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [orgs]
      operationId: getOrg
      summary: One org, with the caller's role
      responses:
        "200":
          description: Org
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Org" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [orgs]
      operationId: updateOrg
      summary: Change the org's name, time zone or default team (admin scope)
      description: |
        Partial update. The slug is fixed: sending `slug` (any unknown field) is `400 bad_request`.
        `defaultTeam` is a team key or id of THIS org (another org's team is
        `400 validation_failed`); `null` clears it. A PATCH that changes nothing
        writes nothing and emits no event; a change emits `org.updated`
        (payload: the changed field names).
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOrgInput" }
      responses:
        "200":
          description: The org after the update
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Org" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415":
          description: "unsupported_media_type (the body must be application/json)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/orgs/{org}/agent-guidance:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [orgs]
      operationId: getAgentGuidance
      summary: Read the guidance text for agents (read scope; any token, so an agent can fetch it)
      description: |
        Org-authored text for the agents that work in the org (LAUN-200). It is the
        organisation's working conventions. It is data: it never changes what a token
        may do. Items: the org-wide entry first (`team` null), then team entries by key.
        With `team`, only the org-wide entry and that team's entry.
      parameters:
        - name: team
          in: query
          required: false
          description: A team key or id. An unknown team (or a team of another org) is `404 not_found`.
          schema: { type: string }
      responses:
        "200":
          description: The entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentGuidance" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [orgs]
      operationId: putAgentGuidance
      summary: Write the org-wide guidance, or a team's (admin scope)
      description: |
        Idempotent by shape. `text` is trimmed, 1 to 8192 UTF-8 bytes (`400 validation_failed`
        otherwise; use DELETE to remove). Bidirectional control characters (U+202A to U+202E,
        U+2066 to U+2069, U+200E, U+200F) and zero-width characters (U+200B, U+200C, U+200D,
        U+2060, U+FEFF) are `400 validation_failed`. A write of the same text changes nothing. A change
        emits `agent_guidance.updated` (payload `team`, `cleared`; never the text).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentGuidanceInput" }
      responses:
        "200":
          description: The entry after the write
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentGuidanceEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415":
          description: "unsupported_media_type (the body must be application/json)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [orgs]
      operationId: deleteAgentGuidance
      summary: Remove the org-wide guidance, or a team's (admin scope)
      description: A missing entry is not an error (204) and emits nothing.
      parameters:
        - name: team
          in: query
          required: false
          description: A team key or id; absent is the org-wide entry.
          schema: { type: string }
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/orgs/{org}/chat-services:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [orgs]
      operationId: listChatServices
      summary: The org's chat services (admin scope; no agent token)
      description: |
        LAUN-204 (decisions-T36), which replaces the Slack channel of LAUN-198. An org has up to
        `limit` (10) chat services: Slack, Discord, Fluxer and custom webhooks. Each posts the chosen
        event kinds of one team's issues to one shared channel (LAUN-209). A webhook URL is a secret and is **write-only**: an
        item says its `host` name (`hooks.slack.com`, `discord.com` or the host of a Fluxer or custom
        service) and never the URL, a part of it or a hash. `available` is false when the server
        has no `SETTINGS_ENCRYPTION_KEY` (nothing can be stored). `linksAvailable` is false when
        `PUBLIC_BASE_URL` is unset (every post is a link, so none is sent). `secretUnreadable` is
        true when the stored URL does not open with this server's key (enter it again). `lastOkAt`
        and `lastError` are the outcome of the last post: `lastError` is a fixed word, never the
        service's reply. An agent token is `403 forbidden`.
      responses:
        "200":
          description: The services, oldest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatServiceList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [orgs]
      operationId: createChatService
      summary: Add a chat service (admin scope; no agent token)
      description: |
        `name` is 1 to 40 characters and unique in the org (ignoring case; `409 conflict`).
        `teamId` (required, LAUN-209, decisions-T38) is the one team whose issues the service posts;
        a team of another org, or an unknown one, is `400 validation_failed`. `kind` is `slack` (URL `https://hooks.slack.com/services/T.../B.../...`), `discord`
        (`https://discord.com/api/webhooks/<id>/<token>`, or discordapp.com), `fluxer` (the Discord post body
        on any public `https` host, URL path `/api/webhooks/<id>/<token>` or `/api/v1/webhooks/<id>/<token>`, no
        query; the same host rules as `custom`) or `custom` (any public
        `https` host; Launchpad refuses private, loopback and link-local addresses, old numeric
        spellings of an address, local names and `http`, and follows no redirect). `events` is the
        whole list of kinds that are posted (absent or empty posts nothing; an unknown kind is
        `400 validation_failed`). A wrong URL is `400 validation_failed` (the message names the
        rule, never the value). More than 10 services is `409 integration_limit`. A server without
        `SETTINGS_ENCRYPTION_KEY` answers `409 encryption_unavailable`. The URL is sealed
        (AES-256-GCM) and never read back. A create emits `chat_service.updated` (payload
        `action`, `serviceId`, `kind`, `teamId`, `enabled`, `events`; never the name, host or URL). The body
        holds a secret, so an `Idempotency-Key` is `400`. Team access does not apply to a channel
        (LAUN-231, decisions-T20): everyone in the channel sees each post the service sends for its
        team (what happened, the issue identifier, a link that holds the org slug and the issue
        identifier or the project id, and for a state change the names of the old and new state),
        whether or not they have access to that team. Launchpad cannot see who is in the channel.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatServiceCreate" }
      responses:
        "201":
          description: The service
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatService" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415":
          description: "unsupported_media_type (the body must be application/json)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/orgs/{org}/chat-services/{service}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { $ref: "#/components/parameters/ChatService" }
    get:
      tags: [orgs]
      operationId: getChatService
      summary: One chat service (admin scope; no agent token)
      description: Another org's service is `404 not_found`.
      responses:
        "200":
          description: The service
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatService" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [orgs]
      operationId: updateChatService
      summary: Rename, change the events, switch on or off, replace the URL (admin scope; no agent token)
      description: |
        An absent field keeps its value. `events` is the whole list when present. `webhookUrl`
        replaces the stored URL and is checked for the kind of the service (the kind never changes);
        a new URL clears `lastOkAt` and `lastError`. Turning a service off deletes the posts still
        waiting for it. A change emits `chat_service.updated`. The body can hold a secret, so an
        `Idempotency-Key` is `400`. A change of `teamId` or a new `webhookUrl` deletes the posts
        still waiting for the service (LAUN-231): a post of the old team never reaches the new
        channel. Team access does not apply to a channel (LAUN-231, decisions-T20): everyone in the
        channel sees each post the service sends for its team (what happened, the issue identifier,
        a link that holds the org slug and the issue identifier or the project id, and for a state
        change the names of the old and new state), whether or not they have access to that team.
        Launchpad cannot see who is in the channel.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatServicePatch" }
      responses:
        "200":
          description: The service after the write
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatService" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415":
          description: "unsupported_media_type (the body must be application/json)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [orgs]
      operationId: deleteChatService
      summary: Remove a chat service (admin scope; no agent token)
      description: |
        Deletes the stored URL, the event list and all its posts (waiting, sent, skipped and dead).
        Idempotent by shape: a missing service is `204` and emits nothing. A removal emits
        `chat_service.updated`.
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/orgs/{org}/chat-services/{service}/test:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { $ref: "#/components/parameters/ChatService" }
    post:
      tags: [orgs]
      operationId: testChatService
      summary: Post a fixed test message to the service (admin scope; no agent token)
      description: |
        Posts one fixed sentence through the same guarded client the sender uses (it follows no
        redirect and refuses private addresses), also when the service is switched off. Rate
        limited to 6 a minute, burst 3, per process (`429` with `Retry-After`). `404 not_found`
        when the service does not exist; `409 conflict` when the stored URL cannot be opened with
        this server's key; `502 chat_send_failed` when the post fails, with a fixed word in the
        message (never the service's reply or the URL). No `Idempotency-Key` (`400`).
      responses:
        "200":
          description: Posted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatTestResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502":
          description: "chat_send_failed: the service refused or could not be reached; the message holds a fixed word"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/orgs/{org}/push:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [orgs]
      operationId: getPush
      summary: The org's mobile push relay (admin scope; no agent token)
      description: |
        LAUN-197 (decisions-T35). This server holds no APNs or FCM key: a relay
        service run by the app's publisher does, and this server posts a bare
        "wake" (a device token, a platform, an opaque id) to the relay the admin
        entered. The relay URL and its bearer secret are **write-only**: this
        response says `configured` and the host name and never the URL, the secret,
        a part of either or a hash. `available` is false when the server has no
        `SETTINGS_ENCRYPTION_KEY`. `secretUnreadable` is true when a stored blob does
        not open with this server's key. `lastOkAt` and `lastError` are the outcome of
        the last push: `lastError` is a fixed word, never the relay's reply. An agent
        token is `403 forbidden`.
      responses:
        "200":
          description: The relay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushRelay" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [orgs]
      operationId: putPush
      summary: Set the relay URL and its secret (admin scope; no agent token)
      description: |
        `relayUrl` and `relaySecret` each: absent or null keeps the stored value, a value
        replaces it. With no stored relay both are required. At least one is required.
        The URL must be `https://` with a host, no user info, no query or fragment, at
        most 512 bytes, else `400 validation_failed` (the message names the rule, never
        the value). The host is entered by the admin, so it is not on an allowlist: the
        dial-time guard (public addresses only, no redirect, no proxy) is the control.
        An IP literal in a private, loopback, link-local or metadata range, or an internal
        service name, is refused at save with `400`; a name that resolves privately is
        refused at dial time (`push_blocked`). When the host changes, `relaySecret` is
        required again (`400`), so a kept secret never goes to a new host.
        A server without `SETTINGS_ENCRYPTION_KEY` answers `409 encryption_unavailable`.
        Both are sealed (AES-256-GCM) and never read back. A change emits `push.updated`
        (payload `configured`; never the URL or the secret). The body holds secrets, so an
        `Idempotency-Key` is `400`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushRelayInput" }
      responses:
        "200":
          description: The relay after the write
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushRelay" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415":
          description: "unsupported_media_type (the body must be application/json)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [orgs]
      operationId: deletePush
      summary: Remove the relay (admin scope; no agent token)
      description: |
        Deletes the stored relay and the pushes still waiting (pending or being sent; sent, skipped and dead rows stay for the 30-day prune). Registered devices stay. Idempotent by
        shape: a missing relay is `204` and emits nothing. A removal emits `push.updated`.
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/orgs/{org}/push/test:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    post:
      tags: [orgs]
      operationId: testPush
      summary: Send a test push to the caller's own devices (admin scope; no agent token)
      description: |
        Sends one wake to each device the caller registered in this org (at most 10), through
        the same guarded client the sender uses. A device the relay calls invalid is deleted
        and counted in `removed`. Rate limited to 6 a minute, burst 3, per process (`429`
        with `Retry-After`). `404 not_found` when no relay is set; `409 conflict` when the
        caller has no device or the stored relay cannot be opened with this server's key;
        `502 push_send_failed` when nothing was sent, with a fixed word in the message (never
        the relay's reply, its URL or a token). No `Idempotency-Key` (`400`).
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushTestResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502":
          description: "push_send_failed: the relay refused or could not be reached; the message holds a fixed word"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/orgs/{org}/me/push-devices:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [notifications]
      operationId: listPushDevices
      summary: The caller's own registered push devices
      description: |
        LAUN-197 (decisions-T35). Read scope; an agent token gets `403 forbidden`. The
        caller's own rows in this org. A device token is never returned. `relayConfigured`
        says whether the admin has set a relay.
      responses:
        "200":
          description: Devices
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushDevices" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/orgs/{org}/me/push-devices/{device}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - name: device
        in: path
        required: true
        description: a UUID the app chose and keeps
        schema: { type: string, format: uuid }
    put:
      tags: [notifications]
      operationId: putPushDevice
      summary: Register or refresh one device
      description: |
        Write scope; an agent token gets `403 forbidden`. Creates the device or refreshes it
        (`lastSeenAt` moves; the token, version and label are replaced). The token is
        printable ASCII, 1 to 4096 characters, and is sealed and hashed; it is never returned.
        One row per token in an org: a token another device row held is taken over. At most 10
        devices per member and org (`409 conflict` for an eleventh); a device not seen for 90
        days is deleted. A device id that belongs to another member or another org is `404`.
        A server without `SETTINGS_ENCRYPTION_KEY` answers `409 encryption_unavailable`. Emits
        no event (a user-private row). The body holds a credential, so an `Idempotency-Key` is `400`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushDeviceInput" }
      responses:
        "200":
          description: The device (no token)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushDevice" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415":
          description: "unsupported_media_type (the body must be application/json)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [notifications]
      operationId: deletePushDevice
      summary: Remove one of the caller's devices
      description: Write scope; agents get `403`. Another member's or another org's id, or a missing one, is `404`. Its waiting pushes go with it. Emits no event.
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/orgs/{org}/me/webhooks:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [notifications]
      operationId: listPersonalWebhooks
      summary: The caller's own personal webhooks
      description: |
        LAUN-229 (decisions-T40). Read scope; an agent token gets `403 forbidden`. The caller's
        own webhooks in this org; no admin route reads them. A personal webhook posts to the
        member's own Slack, Discord, Fluxer or custom webhook when an issue is assigned to the
        member (`assigned`) or when an issue the member owns (assignee or creator) changes
        (`my_issues`), never for the member's own change and never for an issue of a team the
        member cannot see. The URL is **write-only**: an item says its `host` and never the URL.
        `available` is false without `SETTINGS_ENCRYPTION_KEY`; `linksAvailable` is false without
        `PUBLIC_BASE_URL` (nothing posts). `lastError` is a fixed word.
      responses:
        "200":
          description: The webhooks, oldest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonalWebhookList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [notifications]
      operationId: createPersonalWebhook
      summary: Add a personal webhook
      description: |
        Write scope; an agent token gets `403 forbidden`. `name` is 1 to 40 characters and unique
        among the caller's webhooks (ignoring case; `409 conflict`). `kind` and the URL rules are
        those of chat services (`slack`, `discord`, `fluxer`, `custom`; a custom or Fluxer host
        must be public `https`; no redirect is followed). `events` is the list of choices
        (`assigned`, `my_issues`); absent or null means both, and an empty list is allowed (nothing is posted). A wrong URL is `400 validation_failed`
        (the message names the rule, never the value). More than 3 webhooks per member and org
        is `409 integration_limit`. A server without `SETTINGS_ENCRYPTION_KEY` answers `409
        encryption_unavailable`. Emits no event (a user-private row). The body holds a secret,
        so an `Idempotency-Key` is `400`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PersonalWebhookCreate" }
      responses:
        "201":
          description: The webhook
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonalWebhook" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415":
          description: "unsupported_media_type (the body must be application/json)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/orgs/{org}/me/webhooks/{webhook}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { $ref: "#/components/parameters/PersonalWebhook" }
    patch:
      tags: [notifications]
      operationId: updatePersonalWebhook
      summary: Rename, change the choices, switch on or off, replace the URL
      description: |
        Write scope; agents get `403`. An absent field keeps its value. `webhookUrl` replaces the
        stored URL (checked for the kind, which never changes) and clears `lastOkAt` and
        `lastError`. Turning a webhook off deletes the posts still waiting for it. Another
        member's or another org's id is `404 not_found`. Emits no event. The body can hold a
        secret, so an `Idempotency-Key` is `400`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PersonalWebhookPatch" }
      responses:
        "200":
          description: The webhook after the write
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonalWebhook" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415":
          description: "unsupported_media_type (the body must be application/json)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [notifications]
      operationId: deletePersonalWebhook
      summary: Remove one of the caller's webhooks
      description: |
        Write scope; agents get `403`. Deletes the stored URL and all its posts. Idempotent by
        shape: a missing id, or another member's or org's, is `204` and removes nothing. Emits
        no event.
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/orgs/{org}/me/webhooks/{webhook}/test:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { $ref: "#/components/parameters/PersonalWebhook" }
    post:
      tags: [notifications]
      operationId: testPersonalWebhook
      summary: Post a fixed test message to one of the caller's webhooks
      description: |
        Write scope; agents get `403`. Posts one fixed sentence through the guarded chat client,
        also when the webhook is off. 6 a minute per member and org, per process (`429
        rate_limited` with `Retry-After`); an id the caller does not own is `404` and uses none. Another member's or org's id is `404 not_found`; `409 conflict` when the
        stored URL cannot be opened with this server's key; `502 chat_send_failed` with a fixed
        word when the post fails. No `Idempotency-Key` (`400`).
      responses:
        "200":
          description: Posted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatTestResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502":
          description: "chat_send_failed: the webhook refused or could not be reached; the message holds a fixed word"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/orgs/{org}/onboarding:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [orgs]
      operationId: getOnboarding
      summary: The first-run checklist, worked out by the server (admin scope)
      description: |
        Eight steps with a `done` flag and a shared `skipped` flag. The body holds
        booleans and ids only, so an org admin who is not a platform admin sees
        whether mail works and whether the sign-up mode was chosen, never a setting,
        a provider or a secret. `capabilities` names what this server can do now
        (`linearImport`, `gitHosts`, `attachments`); a step whose capability is
        missing is not counted in `remaining`.
      responses:
        "200":
          description: The checklist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Onboarding" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/orgs/{org}/onboarding/skip:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    put:
      tags: [orgs]
      operationId: setOnboardingSkip
      summary: Skip a checklist step, or undo the skip, for the whole org (admin scope)
      description: |
        Idempotent by shape: skipping a skipped step changes nothing and emits no
        event. A change emits `onboarding.step_changed` (payload `step`, `skipped`).
        A step can be skipped even when it is done; `done` is never changed by a skip.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingSkipInput" }
      responses:
        "200":
          description: The checklist after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Onboarding" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415":
          description: "unsupported_media_type (the body must be application/json)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/orgs/{org}/teams:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [teams]
      operationId: listTeams
      responses:
        "200":
          description: Teams
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [teams]
      operationId: createTeam
      summary: Create a team with the default eight-state workflow (admin scope)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/orgs/{org}/teams/{team}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { $ref: "#/components/parameters/Team" }
    get:
      tags: [teams]
      operationId: getTeam
      responses:
        "200":
          description: Team
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [teams]
      operationId: updateTeam
      summary: Change the name, description or cycle cadence (admin scope)
      description: |
        Absent fields are left alone; none can be null. When cycles are
        enabled after the change, the cycle job runs for this team in the
        same transaction, so the current and the next cycle exist when the
        response arrives. A cadence change shapes cycles created from now on;
        existing cycles keep their dates (docs/internal/decisions-T3.md).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTeamInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [teams]
      operationId: deleteTeam
      summary: Delete a team that holds no issues (admin scope)
      description: |
        LAUN-191, docs/internal/decisions-T26-delete.md. `409 team_in_use` while
        the team still has issues (archived ones count), when it has chat
        services (LAUN-209: move or remove them), when it is the org's
        only team, or when it is the org's default team (choose another default
        first). `409 conflict`, naming the repositories, when a repository of an
        enabled integration is mapped to the team while a member of the org sees
        only selected teams (decisions-T20 #65: the repository would lose its
        team). Never deletes an issue. Removes the
        team's workflow states, labels, cycles, follows and notification
        settings and its product links; the products stay. Emits `team.deleted`.
        A write that names the team and loses a race with this delete answers
        `400 validation_failed` (body) or `404` (path), never 500. A deadlock
        answers `503 overloaded` with `Retry-After`; retry it.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Overloaded" }

  /api/v1/orgs/{org}/teams/{team}/states:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { $ref: "#/components/parameters/Team" }
    get:
      tags: [teams]
      operationId: listTeamStates
      summary: The team's workflow states in board order
      responses:
        "200":
          description: States
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowStateList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/orgs/{org}/teams/{team}/products:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { $ref: "#/components/parameters/Team" }
    get:
      tags: [products]
      operationId: listTeamProducts
      summary: The non-archived products of a team
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/orgs/{org}/teams/{team}/git-workflow:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { $ref: "#/components/parameters/Team" }
    get:
      tags: [teams]
      operationId: getGitWorkflow
      summary: The team's git workflow (read scope; refused for agent tokens)
      description: |
        LAUN-244, docs/internal/decisions-T44-git-workflow.md. Which state a
        linked issue moves to when a merge or pull request is opened, marked
        ready, reopened, merged or closed without a merge. One rule per event,
        in the order opened, ready, reopened, merged, closed. `custom: false`
        is the built-in move: opened, ready and reopened go to the team's review
        state, merged to its testing state, closed moves nothing, and a
        built-in move is forward only. A rule whose target state is archived has
        `problem: state_archived` and moves nothing; a rule with an archived
        "only from" state has `problem: from_state_archived` (it still moves
        from its other states; a PUT must leave the archived one out). An agent token is
        `403 forbidden`; a hidden team is `404`.
      responses:
        "200":
          description: The rules
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitWorkflow" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [teams]
      operationId: putGitWorkflow
      summary: Replace the team's custom git workflow rules (admin scope; refused for agent tokens)
      description: |
        The body is the whole set of custom rules. An event that is not listed
        keeps its built-in move; an empty list resets every event. `stateId`
        null means "no move". `fromStateIds` empty: the rule moves forward only
        and never out of a completed or canceled state; a set: the rule moves
        an issue only from one of those states, in any direction. Every state
        must be a state of this team that is not archived, else
        `400 validation_failed` (a state of another team or org too). A rule
        moves an issue once: when the event links the issue or changes the
        state of the link (or marks a draft ready); an event that changes
        nothing on the link moves nothing. A change emits `team.updated`
        (`changes: ["gitWorkflow"]`); the same rules again change nothing and
        emit nothing. A PUT is idempotent by shape: an `Idempotency-Key` is
        accepted and not stored (keys are stored for POST only).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GitWorkflowInput" }
      responses:
        "200":
          description: The rules after the write
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitWorkflow" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/orgs/{org}/products:
    parameters:
      - { $ref: "#/components/parameters/Org" }
    get:
      tags: [products]
      operationId: listProducts
      summary: List products by name (the whole list, no paging)
      description: |
        Archived products are left out unless `includeArchived=true`. Each item
