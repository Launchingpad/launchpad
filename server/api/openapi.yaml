  /api/v1/orgs/{org}/cycles:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [cycles]
      operationId: listCycles
      summary: List cycles (keyset pages, latest start first)
      description: |
        Cycles are created by the server's cycle job, never by the API: for a
        team with cycles enabled there is always the current cycle and the
        next one. `active=true` is the cycle running now (the same test as
        the issue filter `cycle=active`).
      parameters:
        - { name: team, in: query, schema: { type: string }, description: "team key, id, or the Linear id of an imported team" }
        - { name: active, in: query, schema: { type: boolean } }
        - { name: includeArchived, in: query, schema: { type: boolean, default: false } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CycleList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/orgs/{org}/cycles/{cycle}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: cycle, in: path, required: true, schema: { type: string, format: uuid }, description: "cycle id, or the Linear id of an imported cycle" }
    get:
      tags: [cycles]
      operationId: getCycle
      responses:
        "200":
          description: Cycle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cycle" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [cycles]
      operationId: updateCycle
      summary: Edit a cycle's name, description and dates
      description: |
        LAUN-172, docs/internal/decisions-T27-cycle-options.md. Takes the team's cycle lock
        (the cycle job's), so it never runs inside a job run. `startsAt` and `endsAt` are an RFC 3339
        time or a `YYYY-MM-DD` day in the team zone (at the team's cycle start time); a value equal
        to the stored one changes nothing. Dates change only for a cycle that has not ended and is
        not complete, `startsAt` only before the cycle starts, both only in the future. The
        neighbour that touches the moved edge moves with it, so the chain stays contiguous.
        `409 cycle_conflict` when a rule forbids it (a past cycle, an empty neighbour, an overlap),
        `400 validation_failed` for a bad or past value.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCycleInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cycle" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [cycles]
      operationId: deleteCycle
      summary: Delete a cycle (admin scope)
      description: |
        LAUN-172, docs/internal/decisions-T27-cycle-options.md. Only a cycle that is not complete and
        has no issue (archived ones count): `409 cycle_in_use` otherwise. The next cycle takes over
        its time. The last cycle of a team with cycles on cannot be deleted (`409 cycle_conflict`:
        the cycle job would make it again). Emits `cycle.deleted`.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Overloaded" }

  /api/v1/orgs/{org}/cycles/{cycle}/complete:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: cycle, in: path, required: true, schema: { type: string, format: uuid }, description: "cycle id, or the Linear id of an imported cycle" }
    post:
      tags: [cycles]
      operationId: completeCycle
      summary: Mark the current cycle complete now (admin scope)
      description: |
        LAUN-172, docs/internal/decisions-T27-cycle-options.md. The cycle job's completion for one
        cycle, now: only the current cycle of a team with cycles on. The cycle ends now, the next
        cycle starts now, the open issues roll over when the team's rollover is on, and a new
        upcoming cycle is made. `409 cycle_conflict` otherwise. Emits `cycle.completed`.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200":
          description: The completed cycle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cycle" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Overloaded" }

  /api/v1/orgs/{org}/cycles/{cycle}/snapshots:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: cycle, in: path, required: true, schema: { type: string, format: uuid }, description: "cycle id, or the Linear id of an imported cycle" }
    get:
      tags: [cycles]
      operationId: listCycleSnapshots
      summary: The cycle's daily burn-up, oldest day first
      description: |
        One row per day (team-local date). While the cycle is running, this
        call first refreshes today's row, so the last point is current (a
        refresh that changes no count writes nothing). A
        completed cycle's rows are final. Never paginated (a cycle is at most
        56 days); `nextCursor` is always null.
      responses:
        "200":
          description: Snapshots
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CycleSnapshotList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

