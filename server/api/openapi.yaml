  /api/v1/orgs/{org}/users:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [users]
      operationId: listUsers
      summary: Org members
      responses:
        "200":
          description: Members
          content:
            application/json:
