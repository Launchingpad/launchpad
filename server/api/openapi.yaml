  /api/v1/orgs/{org}/users/{user}/team-access:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: user, in: path, required: true, description: "a user id or username of a member of this org", schema: { type: string } }
    put:
      tags: [users]
      operationId: setTeamAccess
      summary: Set a member's team access (admin scope)
      description: |
        docs/internal/decisions-T20-team-access.md #48 to #50 (LAUN-225). Org
        admins only (`403 forbidden` otherwise, agent tokens included). Replaces
        the member's whole access: `{"teamAccess":"all"}` or
        `{"teamAccess":"selected","teams":[...]}` (keys or ids, at most 50; an
        empty list is allowed and leaves the member with no team). A member with
        `selected` sees only those teams, from their next request on; an open
        event or inbox stream sends `event: access` before its next page.

        - A target who is an org admin is `400` (admins always see every team).
          A user who is not a member of this org (another org's included) is
          `404`.
        - Open issues (state type not `completed` or `canceled`) assigned to the
          member in a team the member loses: without `assignedIssues` the call is
          `409 conflict`, and the text gives the count per team.
          `"unassign"` clears their assignee (activity source `system`, one
          `issue.updated` per issue); `"keep"` leaves them. Closed issues are never
          touched.
        - In the same transaction, the member's issue subscriptions, team follows
          and per-team notification settings of the lost teams are deleted. Inbox
          rows stay and are hidden.
        - While the member ends `selected`, every repository of an enabled git
          integration must have a team: otherwise `409 conflict`, naming the
          repositories (the webhook guard).
        - A change emits `member.access_changed` (org admins only read it) and
          writes an audit log line. A call that changes nothing writes nothing.
        - `dryRun=true` answers the same body and writes nothing; it does not
          refuse a missing `assignedIssues` (the counts are the answer).

        The answer holds ids and counts only. A repeat of the same body is a
        no-op (`changed: false`). An `Idempotency-Key` header is accepted and
        ignored on this PUT: nothing is stored or replayed; a repeat is safe
        because it changes nothing.
      parameters:
        - name: dryRun
          in: query
          required: false
          schema: { type: boolean }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamAccessInput" }
      responses:
        "200":
          description: The access after the change (or as it would be, for a dry run)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamAccessResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415":
          description: "unsupported_media_type"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/orgs/{org}/me/notification-settings:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [notifications]
      operationId: getNotificationSettings
      summary: The caller's notification settings, resolved
      description: |
        LAUN-32 (docs/internal/decisions-T13-notifications.md #32). The
        caller's own settings only; an agent token gets `403 forbidden`. Per
        event: the built-in default, the stored global values, the resolved
        global value with its source, and per team the stored override and the
        resolved value with its source (`team`, `global` or `default`). The
        master `emailEnabled = false` turns every resolved email value off
        (the source stays that of the stored or default value). The server
        computes every resolved value; clients never recompute it.
        `mail.available` is false when this install has no mail transport.
        `teams` and `follows` list only the teams the caller can see.
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [notifications]
      operationId: updateNotificationSettings
      summary: Change the global notification settings
      description: |
        Changes only what the body names: an absent field or event column is
        left as it is, `"on"` / `"off"` sets it, and `null` clears it (an event
        column goes back to inherit; `emailEnabled` to true; `includeExcerpt`
        to false). Replay-safe. An event name or value outside the lists is
        `400 validation_failed`. Answers the whole resolved view.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationSettingsInput" }
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/orgs/{org}/me/notification-settings/teams/{team}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { $ref: "#/components/parameters/Team" }
    put:
      tags: [notifications]
      operationId: updateTeamNotificationSettings
      summary: Change the caller's notification overrides for one team
      description: |
        As `PUT /me/notification-settings`, at the team level: `null` removes
        the override of that column, so the value comes from the global row or
        the default again. Another org's team is `404 not_found`. Answers the
        whole resolved view.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationTeamSettingsInput" }
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/orgs/{org}/me/views:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [notifications]
      operationId: listViewPreferences
      summary: The caller's remembered issue-page views
      description: |
        LAUN-141 (docs/internal/decisions-T23-view-preferences.md). The caller's own
        rows in this org (layout and sort per place); an agent token gets `403 forbidden`.
        At most 100 places. A place whose stored choice equals the defaults (list, updated)
        is still listed: it is how a reset reaches other devices.
      responses:
        "200":
          description: Places
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ViewPreferenceList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/orgs/{org}/me/views/{place}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - name: place
        in: path
        required: true
        description: "Place key, 1-200 characters of a-z, 0-9, '.', '_', ':' and '-' (for example `team:orb`, `all`, `cycle:orb:3`)."
        schema: { type: string, pattern: "^[a-z0-9._:-]{1,200}$" }
    put:
      tags: [notifications]
      operationId: putViewPreference
      summary: Remember the layout and sort of one place
      description: |
        Last writer wins by `at` (the client's time of the choice, epoch milliseconds; a
        value ahead of the server clock is set to the server clock). A write whose `at`
        is not strictly newer than the stored one changes nothing. Either way the answer
        is the value now stored, so the client sees which side won. Past 100 places the
        oldest by `at` are removed. A write that is itself trimmed past the cap is answered with the default
        (`list`, `updated`, `at` 0) and no row is stored. Replay-safe. Emits no event.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ViewPreferenceInput" }
      responses:
        "200":
          description: The stored value
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ViewPreference" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/orgs/{org}/me/git-accounts:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [notifications]
      operationId: listMyGitAccounts
      summary: The org's git connections with the caller's handle on each
      description: |
        LAUN-199 (docs/internal/decisions-T34-connected-accounts.md). The caller's own
        rows; an agent token gets `403 forbidden`. Lists the enabled connections (and a
        disabled one the caller still has a link on). `handle` is null when the caller
        has not linked one. A link is a claim the member typed, used for display
        attribution only, never for a permission.
      responses:
        "200":
          description: Connections
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitAccounts" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/orgs/{org}/me/git-accounts/{integration}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - name: integration
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [notifications]
      operationId: putMyGitAccount
      summary: Link or change the caller's handle on one connection
      description: |
        Write scope; an agent token gets `403 forbidden`. The handle is checked for the
        connection's provider (GitHub 1-39 of letters, digits, `_`, `-`; GitLab and
        Bitbucket 1-100, see the decision record). One leading `@` and outer spaces are
        dropped. Handles compare in lower case: one holder per handle per connection.
        A handle another member holds is `409 conflict` with a fixed sentence that names
        nobody. Replay-safe. Emits no event (a user-private row).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GitAccountInput" }
      responses:
        "200":
          description: The connection with the stored handle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitAccount" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [notifications]
      operationId: deleteMyGitAccount
      summary: Remove the caller's handle on one connection
      description: Write scope; agents get `403`. A missing link is also 204. A connection of another org is 404. Emits no event.
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/orgs/{org}/git-identities:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [integrations]
      operationId: listGitIdentities
      summary: Every member's git handle link in the org (org admin)
      description: Admin scope and the org admin role. Handles and member references only; no secret.
      responses:
        "200":
          description: Links
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitIdentities" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/orgs/{org}/git-identities/{identity}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - name: identity
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [integrations]
      operationId: deleteGitIdentity
      summary: Remove a member's git handle link (org admin)
      description: |
        Admin scope and the org admin role. It changes another member's state, so it
        emits `git_identity.removed` (entityType org; payload `userId` and
        `integrationId`, never the handle). A link already gone, or of another org, is 404.
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/orgs/{org}/me/teams/{team}/follow:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { $ref: "#/components/parameters/Team" }
    put:
      tags: [notifications]
      operationId: followTeam
      summary: Follow a team (new-issue notifications)
      description: Idempotent. A person follows teams by their own choice; nobody follows a team by default.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "204": { description: Following }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [notifications]
      operationId: unfollowTeam
      summary: Stop following a team
      description: Idempotent.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "204": { description: Not following }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/orgs/{org}/issues/{issue}/subscription:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { $ref: "#/components/parameters/Issue" }
    get:
      tags: [notifications]
      operationId: getIssueSubscription
      summary: The caller's subscription state of an issue
      description: |
        `state` is `subscribed` or `muted` (a stored row) or `default` (no row:
        the implicit rules apply). `reasons` says why the caller hears about
        the issue: `creator`, `assignee`, `commenter`, and the stored reason
        (`manual`, `mentioned`) of a `subscribed` row. An agent token gets
        `403 forbidden`.
      responses:
        "200":
          description: Subscription
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssueSubscription" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [notifications]
      operationId: putIssueSubscription
      summary: Subscribe to or mute an issue
      description: "`subscribed: true` stores a `subscribed` row, `false` a `muted` row (it wins over every implicit reason). Replay-safe."
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueSubscriptionInput" }
      responses:
        "200":
          description: Subscription
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssueSubscription" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [notifications]
      operationId: deleteIssueSubscription
      summary: Remove the caller's subscription row (back to the implicit rules)
      description: Idempotent.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/orgs/{org}/notifications:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: The caller's inbox, newest first
      description: |
        LAUN-35 (docs/internal/decisions-T13-notifications.md #27-#29). The
        caller's own rows only (not even an admin reads another inbox); an
        agent token gets `403 forbidden`. A row made for email only (inbox
        channel off) is never returned. Order is `(createdAt, id)` descending
        with an opaque keyset `cursor`, stable across equal timestamps.
        `archived=true` lists the archived rows instead of the live ones.
        A row of an issue or project the caller can no longer see is not
        listed or counted (the unread count and the stream agree with it).
      parameters:
        - name: state
          in: query
          description: "`unread` lists only unread rows; `all` (default) lists read and unread."
          schema: { type: string, enum: [unread, all], default: all }
        - name: archived
          in: query
          schema: { type: boolean, default: false }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: A page of inbox rows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxNotificationList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/orgs/{org}/notifications/unread-count:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [notifications]
      operationId: getNotificationUnreadCount
      summary: The number of unread, unarchived inbox rows
      description: Agent tokens get `403 forbidden`. A web app that cannot open the stream polls this every 60 seconds.
      responses:
        "200":
          description: The count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationUnreadCount" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/orgs/{org}/notifications/read-all:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    post:
      tags: [notifications]
      operationId: readAllNotifications
      summary: Mark inbox rows read up to a time
      description: |
        Marks the caller's unread, unarchived inbox rows with `createdAt <=
        before` as read. `before` is required (the web app sends the
        `createdAt` of the newest row it has loaded), so a retry after a
        timeout marks the same rows and never one that arrived in between.
        Replay-safe by itself: it takes no `Idempotency-Key`. No `before` is
        `400 validation_failed`. Agent tokens get `403 forbidden`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationReadAllInput" }
      responses:
        "200":
          description: How many rows this call marked (a repeat marks 0)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationReadAllResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/orgs/{org}/notifications/stream:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [notifications]
      operationId: streamNotifications
      summary: Live inbox updates (Server-Sent Events)
      description: |
        The caller's own inbox as a stream; agent tokens get `403 forbidden`.
        `event: notification` (`id: <inboxSeq>`, data `{id, kind, inboxSeq}`)
        for each new inbox row (never an email-only or archived row), and
        `event: count` (data `{count}`, no id) when the unread count differs
        from the last one sent on this connection, and once at the start. A
        mark-read, unread, archive or read-all in another tab moves only the
        count. Resume with `Last-Event-ID` (the browser sends it), else
        `?after=`, else only new rows. A commit wakes the stream through
        LISTEN/NOTIFY on every server; it also polls, so a lost notification
        only delays an event. The stream ends when the token or the
        membership is gone. Comment lines (`: ping`) are heartbeats.
        Rows of an issue or project the caller cannot see are not sent. When
        the caller's role or team access changes, the stream first sends
        `event: access` with `data: {}` and no `id`, then reads with the new
        access. The stream sends only rows after its cursor, so the rows of a
        newly visible team made before it are not sent: refetch the inbox and
        the count on `event: access`.
      parameters:
        - { name: Last-Event-ID, in: header, schema: { type: string } }
        - { name: after, in: query, schema: { type: integer, format: int64, minimum: 0 } }
      responses:
        "200":
          description: An open event stream
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/orgs/{org}/notifications/{id}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - name: id
        in: path
        required: true
        description: notification id
        schema: { type: string, format: uuid }
    patch:
      tags: [notifications]
      operationId: updateNotification
      summary: Set the read and archived state of one inbox row
      description: |
        Sets a STATE, both ways: `read: true` sets `readAt` (a repeat keeps the
        first time), `read: false` clears it; `archived` works the same way
        with `archivedAt`. A flag that is not named is left alone. An empty
        body is `400`. Replay-safe by itself: it takes no `Idempotency-Key`.
        The id of another user's or another org's row, or of an email-only
        row, is `404 not_found`. Agent tokens get `403 forbidden`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationPatch" }
      responses:
        "200":
          description: The row after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxNotification" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/notifications/unsubscribe/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: The random token in the notification email's unsubscribe link.
        schema: { type: string, maxLength: 200 }
    post:
      tags: [notifications]
      operationId: unsubscribeNotificationEmail
      summary: One-click unsubscribe from a notification email (RFC 8058)
      description: |
        LAUN-34 (docs/internal/decisions-T13-notifications.md #25). Public: the
        token in the path is the credential, so no bearer token or cookie is
        read. Each notification email carries a random 32-byte token (only its
        sha256 is stored) and the headers `List-Unsubscribe: <this URL>` and
        `List-Unsubscribe-Post: List-Unsubscribe=One-Click`.

        A valid token sets `email = off` for exactly the events (and teams) of
        the mail it came with, at the level each value came from (a value that
        came from the built-in default gets a stored global `off` row). It
        changes nothing else: not the master switch, not the inbox, not other
        events. The email that is still pending for them stops too.

        The answer is `204` for a valid, used, expired or unknown token, so it
        says nothing about who has an account. The body is not read. A token
        works once. Never idempotent (an Idempotency-Key header is refused
        with 400). `GET` of this path is not an action (mail scanners fetch
        links): it answers `405`. The route takes at least 300 ms and is rate
        limited (20 a minute per client when the client address is known,
        600 a minute in all).
      security: []
      responses:
        "204": { description: "Done, or nothing to do (any token)" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/orgs/{org}/agents:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    post:
      tags: [users]
      operationId: createAgent
      summary: Create an agent user and make it a member of this org (admin scope)
      description: |
        (docs/internal/decisions-T10-agents.md). Makes a user with
        `isAgent: true`, no email and the org role `member`, in one
        transaction. An agent has no email, so it can never ask for or verify
        a login code; it works only with tokens. Mint its token with
        `POST /orgs/{org}/tokens` (`user` = the agent, `expiresInDays`
        required) or with `server mint-token` on the server.

        The Linear importer's user map names `chen` and `claude`: create
        `claude` here before an import.

        Usernames are unique on the install: a username that exists already
        (human or agent) is `409 conflict`. JSON only (`415` otherwise). Never
        idempotent: an Idempotency-Key header is refused with 400.

        Team access (decisions-T20 #31): `teamAccess` is `all` by default; with
        `selected` the agent sees only `teams` (at least one). A selected agent
        is refused with `409 conflict` while an enabled git integration has a
        repository with no team (the webhook guard).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415":
          description: "unsupported_media_type"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/orgs/{org}/tokens:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [tokens]
      operationId: listTokens
      summary: Tokens pinned to this org (admin scope); secrets are never listed
      responses:
        "200":
          description: Tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [tokens]
      operationId: createToken
      summary: Mint a PAT pinned to this org (admin scope); the secret is returned once
      description: |
        Never idempotent: an Idempotency-Key header is refused with 400,
        because the response holds the secret.

        Rules (decisions-T6a #18-19, superseded #17: decisions-T11):
        - A web session (cookie) of an org admin may mint, with the
          `X-CSRF-Token` header. Its token always expires: `expiresInDays`
          is required, 1-365 (`400 validation_failed` otherwise). It cannot
          have the `admin` scope (`403 forbidden`); admin tokens come from a
          bearer admin token or `server mint-token`. At most 5 at once, then
          10 an hour for each user (`429 rate_limited` with `Retry-After`);
          a request that makes no token does not use the allowance. The
          session's own expiry does not cut the new token.
        - A token for an agent user (`isAgent`) needs `expiresInDays`
          (1-365); without it the request is `400 validation_failed`.
        - A new token never outlives the bearer token that minted it: its
          `expiresAt` is cut to the caller's `expiresAt` when the caller's
          token has one. The response shows the real `expiresAt`.

        Create and revoke write one audit line to the server log (who, token
        id, owner, name, scopes, expiry; never the secret). They are not in
        the change feed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedToken" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/orgs/{org}/tokens/{token}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: token, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [tokens]
      operationId: revokeToken
      summary: Revoke a token pinned to this org (admin scope); idempotent
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/orgs/{org}/integrations/gitlab/webhook:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    post:
      tags: [gitlab]
      operationId: gitlabWebhook
      summary: GitLab merge_request webhook (no bearer token; X-Gitlab-Token)
      description: |
        GitLab's "Merge request events" webhook. Paste `webhookUrl` (from
        the integration) and the integration's secret into GitLab's webhook
        form. No bearer token, session or org membership: the route is
        public, and `X-Gitlab-Token` is checked first, in constant time,
        against every enabled integration of the org, before the body is
        read. A missing or wrong token, an unknown org and an org with no
        enabled integration are all the same `401 unauthenticated`.

        Then:
        - an `X-Gitlab-Event` other than `Merge Request Hook` and `Pipeline Hook`
          is `202` (`ignored`) and its body is never read;
        - `X-Gitlab-Event-UUID` is required (`400`). The dedupe key is the
          `Idempotency-Key` header when GitLab sends one (1-100 printable
          characters, else `400`) and the Event UUID, each plus the project
          id, MR iid and action, because one GitLab request can fire
          several hooks with one header value. Both keys are recorded; if
          either was seen before, the delivery is `200` `duplicate` and
          changes nothing;
        - the body is at most 8 MiB (`413`); a body that is not a
          merge_request payload is `400`;
        - a project that is not in the integration's project map is `202`
          `unmapped` (logged with its numeric id only). Nothing is kept for
          it, so the same delivery sent again after the project is mapped
          is applied;
        - a database error is `500` and nothing is kept; processing the
          same event again later is safe (forward-only moves, unique
          links). Whether and how GitLab sends a failed delivery again is
          not something this API relies on.

        Linking: identifiers `(?i)\b([a-z][a-z0-9]+)-(\d+)\b` in the
        source branch, then the title, then the description, whose key is
        a team key of the org (only the mapped team's, when the mapping has
        one); at most 25 issues. Each linked issue gets an `mr_links` row
        and, the first time, a `link` attachment with the MR URL. Only
        issues named in the source branch or the title move; an issue named
        only in the description is linked and keeps its state.

        Built-in moves (a team with no git workflow rule, LAUN-244), forward
        only, never out of Done, Canceled or Duplicate: `open` / `reopen` (not
        a draft) and an `update` that marks a draft ready move to the team's
        review state; `merge` moves to the testing state. `close` (unmerged)
        and every other `update` move nothing. A rule of the team's git
        workflow (`/teams/{team}/git-workflow`) replaces the move of its event. A
        move writes a state-history row with source `gitlab` and an
        `issue.updated` event (payload `source: gitlab`, no actor). Links
        are kept per GitLab integration. A merged link is terminal, and a
        closed link stays closed unless the event is an explicit `reopen`;
        such a stale event changes neither the link nor the issue.

        Checks (`Pipeline Hook`, LAUN-85, decisions-T17 #19): the event names a
        commit, not a merge request. It sets the check named by the pipeline
        `name` (else `pipeline`) on the links of the project whose head sha is
        `object_attributes.sha`; the link's `checks` is the worst of its checks
        (failure over pending over success; `skipped` is success, `canceled`
        failure). An older result of the same check name is dropped. A sha that
        no link has is `200` `ignored` and keeps no dedupe row and emits no
        event (only the deliveries ring row is written). The dedupe keys are `gl:ik:` / `gl:ev:` plus
        `:p<project>:sha<first 12 of the sha>:checks`. It moves no issue.
      security: []
      parameters:
        - { name: X-Gitlab-Token, in: header, required: true, schema: { type: string, maxLength: 256 }, description: "the integration's secret" }
        - { name: X-Gitlab-Event, in: header, required: true, schema: { type: string, examples: [Merge Request Hook] } }
        - { name: X-Gitlab-Event-UUID, in: header, required: true, schema: { type: string, maxLength: 100 }, description: "always gives a dedupe key `ev:<uuid>:p<project>:mr<iid>:<action>`, recorded for every delivery (with or without Idempotency-Key); if any key of the delivery was seen before, it is a duplicate" }
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, minLength: 1, maxLength: 100 }, description: "GitLab's delivery key, when sent (printable ASCII, else 400). It gives a second dedupe key `ik:<key>:p<project>:mr<iid>:<action>`, recorded next to the Event UUID key; if either was seen before, the delivery is a duplicate" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "GitLab's merge_request payload; only object_kind, project and object_attributes (and changes.draft) are read"
      responses:
        "200":
          description: Processed, ignored (an event that asks for nothing) or a duplicate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookResult" }
        "202":
          description: Not a merge_request event, or an unmapped project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/Error" }

  /api/v1/orgs/{org}/integrations/github/webhook:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    post:
      tags: [github]
      operationId: githubWebhook
      summary: GitHub pull_request webhook (no bearer token; X-Hub-Signature-256)
      description: |
        GitHub's `pull_request` webhook (content type `application/json`). No
        bearer token, session or org membership: the route is public. GitHub
        signs the body, so the body is read before the check, and the order
        keeps that read cheap (docs/internal/decisions-T17-git-connections-import.md
        #14):

        1. An unknown org, or an org with no enabled GitHub integration, is
           `401 unauthenticated`, before anything is read.
        2. `X-Hub-Signature-256` must be `sha256=` and 64 hex characters, else
           the same `401`.
        3. `Content-Length` must be present (`411 length_required`; no chunked
           body) and at most 2 MiB (`413 payload_too_large`).
        4. The body bytes are taken from a process-wide budget of in-flight
           bytes (32 MiB); when it is spent the answer is `503 overloaded` with
           `Retry-After: 5`. GitHub does not retry by itself: use "Redeliver".
        5. The body is read within an absolute 5 seconds; a slower sender is
           closed (`400`).
        6. The HMAC-SHA256 of the body is compared, in constant time, with the
           secret of every enabled GitHub integration of the org (the current
           and, during a rotation, the pending one). The match picks the
           integration. A miss is the same `401`. A sealed secret that cannot
           be opened (a changed `SETTINGS_ENCRYPTION_KEY`) is skipped; if it
           was the only candidate the answer is the same `401`, and the server
           logs `secret_unreadable`.

        Only then:
        - `X-GitHub-Event: ping` is `200` `ignored`; any event other than
          `pull_request`, `pull_request_review`, `check_suite` and `status` is
          `202` `ignored`;
        - `X-GitHub-Delivery` is required (1-100 printable characters, else
          `400`); a body that is not a pull_request payload is `400`;
        - a pull request whose head repository is not its base repository (a
          fork, or a deleted fork) is `200` `ignored` and writes nothing;
        - `converted_to_draft`, `edited`, `synchronize` and
          every other action that asks for nothing (labels, assignments) are
          `200` `ignored` and write nothing (the draft and refresh columns arrive with the MR state
          ticket);
        - the dedupe key is `gh:<delivery>:r<repo id>:pr<number>:<action>`
          (a check event: `gh:<delivery>:r<repo id>:sha<first 12 of the sha>:checks`,
          with no pull request number); a
          delivery seen before (GitHub's redelivery keeps the GUID) is `200`
          `duplicate` and changes nothing;
        - a repository that is not in the integration's repo map is `202`
          `unmapped` and nothing is kept, so the same delivery sent again after
          the repo is mapped is applied;
        - a database error is `500` and nothing is kept.

        Linking and moves are those of the GitLab webhook: identifiers in the
        source branch, then the title, then the description; only issues named
        in the branch or the title move; forward only, never out of Done,
        Canceled or Duplicate. Built-in moves: `opened` / `reopened` (not a
        draft) and `ready_for_review` move to the team's review state; `closed`
        with `merged: true` moves to the testing state; `closed` unmerged closes
        the links and moves nothing. A rule of the team's git workflow
        replaces the move of its event. A move writes a state-history row with source
        `github` and an `issue.updated` event (payload `source: github`, no
        actor).

        Checks (`check_suite` and `status`, LAUN-85, decisions-T17 #19): the
        event names a commit. It sets one check, named by the app slug of a
        suite or the context of a status, on the links of the repository whose
        head sha is that commit; the link's `checks` is the worst of its checks
        (failure over pending over success). An older result of the same check
        name is dropped. A sha that no link has is `200` `ignored` and keeps
        no dedupe row and emits no event (only the deliveries ring row is written). It moves no issue.
      security: []
      parameters:
        - { name: X-Hub-Signature-256, in: header, required: true, schema: { type: string, pattern: "^sha256=[0-9a-fA-F]{64}$" }, description: "the HMAC-SHA256 of the body under the integration's secret" }
        - { name: X-GitHub-Event, in: header, required: true, schema: { type: string, examples: [pull_request] } }
        - { name: X-GitHub-Delivery, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 100 }, description: "the delivery GUID; part of the dedupe key" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "GitHub's pull_request payload; only action, number, repository, and pull_request (title, body, html_url, draft, merged, user.login, head, base) are read"
      responses:
        "200":
          description: Processed, ignored (a ping, a fork, an action that asks for nothing) or a duplicate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookResult" }
        "202":
          description: Not a pull_request event, or an unmapped repository
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "411": { $ref: "#/components/responses/LengthRequired" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Overloaded" }

  /api/v1/orgs/{org}/integrations/bitbucket/webhook:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    post:
      tags: [bitbucket]
      operationId: bitbucketWebhook
      summary: Bitbucket Cloud and Data Center webhook (no bearer token; X-Hub-Signature)
      description: |
        Bitbucket's pull request, approval and commit status webhooks (content
        type `application/json`), from Bitbucket Cloud and from Bitbucket Data
        Center. No bearer token, session or org membership: the route is
        public. Bitbucket signs the body, so the body is read before the check,
        in the order of the GitHub webhook (docs/internal/decisions-T17-git-connections-import.md
        #14):

        1. An unknown org, or an org with no enabled Bitbucket integration, is
           `401 unauthenticated`, before anything is read.
        2. `X-Hub-Signature` must be `sha256=` and 64 hex characters, else the
           same `401`. A Bitbucket hook without a secret sends none; a Data
           Center version that cannot sign cannot be used.
        3. `Content-Length` must be present (`411 length_required`) and at most
           2 MiB (`413 payload_too_large`).
        4. The body bytes are taken from a process-wide budget of in-flight
           bytes (32 MiB); when it is spent the answer is `503 overloaded`
           with `Retry-After: 5`.
        5. The body is read within an absolute 5 seconds (`400` when slower).
        6. The HMAC-SHA256 of the body is compared, in constant time, with the
           secret of every enabled Bitbucket integration of the org (the
           current and, during a rotation, the pending one). The match picks
           the integration. A miss is the same `401`.

        Only then:
        - `X-Event-Key: diagnostics:ping` (Data Center's test) is `200`
          `ignored`; an event the tracker does not read is `202` `ignored`.
          Read events: Cloud `pullrequest:created`, `:updated`, `:fulfilled`,
          `:rejected`, `:approved`, `:unapproved` and
          `repo:commit_status_created`, `:updated`; Data Center `pr:opened`,
          `:from_ref_updated`, `:modified`, `:merged`, `:declined`,
          `:reviewer:approved`, `:reviewer:unapproved`, `:reviewer:needs_work`
          and the build status event;
        - `X-Request-UUID` (Cloud) or `X-Request-Id` (Data Center) is required
          (1-100 printable characters, else `400`); a body that is not a usable
          payload is `400`;
        - a pull request whose source repository is not its destination
          repository (a fork, or a deleted fork) is `200` `ignored` and writes
          nothing; so is an event that asks for nothing;
        - the dedupe key is `bb:<delivery>:r<repo key>:pr<number>:<action>` (a
          commit status: `bb:<delivery>:r<repo key>:sha<first 12 of the sha>:checks`);
          a delivery seen before is `200` `duplicate` and changes nothing;
        - a repository that is not in the integration's repo map is `202`
          `unmapped` and nothing is kept;
        - a database error is `500` and nothing is kept.

        The repository key is the numeric repository id (Data Center) or
        `{workspace uuid}/{repository uuid}` in lower case (Cloud).

        Linking and moves are those of the GitLab and GitHub webhooks (a rule
        of the team's git workflow replaces the built-in move of its event).
        Built-in: created or opened (not a draft) moves to the team's review state; merged
        (`fulfilled`) moves to the testing state; declined (`rejected`) closes
        the links and moves nothing; updates refresh the link; approvals set
        the review state (Data Center `needs_work` is changes requested) and
        move nothing. A payload with no `draft` field is not a draft. A move
        writes a state-history row with source `bitbucket` and an
        `issue.updated` event (payload `source: bitbucket`, no actor).

        Checks: a commit status names a commit and a build key. It sets one
        check on the links of the repository whose head sha is that commit
        (`SUCCESSFUL` success; `FAILED`, `STOPPED` failure; `INPROGRESS`
        pending); a sha that no link has is `200` `ignored` and keeps no dedupe
        row.
      security: []
      parameters:
        - { name: X-Hub-Signature, in: header, required: true, schema: { type: string, pattern: "^sha256=[0-9a-fA-F]{64}$" }, description: "the HMAC-SHA256 of the body under the integration's secret" }
        - { name: X-Event-Key, in: header, required: true, schema: { type: string, examples: ["pullrequest:created", "pr:opened"] } }
        - { name: X-Request-UUID, in: header, required: false, schema: { type: string, minLength: 1, maxLength: 100 }, description: "Cloud: the delivery id; part of the dedupe key" }
        - { name: X-Request-Id, in: header, required: false, schema: { type: string, minLength: 1, maxLength: 100 }, description: "Data Center: the delivery id; part of the dedupe key (one of the two headers is required)" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "Bitbucket's payload; only the pull request (id, title, description, state, draft, author, source and destination or fromRef and toRef, links), the repository and, for a commit status, the key, state and commit are read"
      responses:
        "200":
          description: Processed, ignored (a test ping, a fork, an event that asks for nothing) or a duplicate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookResult" }
        "202":
          description: An event the tracker does not read, or an unmapped repository
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "411": { $ref: "#/components/responses/LengthRequired" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Overloaded" }

  /api/v1/orgs/{org}/integrations:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [integrations]
      operationId: listGitIntegrations
      summary: The org's git integrations of every provider (admin scope and org admin role)
      description: |
        Secrets and tokens are never returned: `tokenSet` and `webhookSecretSet`
        say only that one is stored. `status` is `disabled` when `enabled` is
        false, else `needs_attention` when `attentionCode` is set, else `ok`.
        `attentionCode` is one of `secret_unreadable`, `token_rejected`,
        `attention_unreachable`, `hook_failed` (our codes, never host text). A
        `read` or `write` token of a member gets `403`.
      responses:
        "200":
          description: Integrations, oldest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitIntegrationList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [integrations]
      operationId: createGitIntegration
      summary: Add a git host (GitLab, GitHub or Bitbucket) (admin scope and org admin role)
      description: |
        Only `gitlab`, `github` and `bitbucket` are accepted (`400
        validation_failed` otherwise). `bitbucket` covers Bitbucket Cloud
        (`https://bitbucket.org`) and Bitbucket Data Center (any other host); a
        Data Center version that cannot sign webhooks with a secret cannot be
        used. Never idempotent: an Idempotency-Key header is refused with
        `400`, because the body holds a token or a secret.

        `mode` `webhook_only` (the default): the server makes the webhook secret
        and returns it ONCE as `webhookSecret` in the 201; a GitLab integration
        may instead paste one in `secret` (32-256 printable ASCII characters, no
        space; it is not returned). `mode` `token`: the token is checked through
        the guarded client (10 s), sealed, and the server makes and seals the
        secret (never returned). The base URL must be https (http only on a
        local or test server, or for a private address that
        GIT_ALLOW_PRIVATE_PROVIDERS or GIT_ALLOW_PRIVATE_CIDRS permits). Token
        mode also refuses an address the git policy refuses.

        Errors: `409 conflict` (the same provider and base URL again, or a
        secret another enabled integration of the provider uses),
        `409 integration_limit` (more than 8 enabled per provider),
        `409 encryption_unavailable` (no SETTINGS_ENCRYPTION_KEY, for a token or
        a GitHub or Bitbucket secret), `409 public_url_required` (token mode without an https
        PUBLIC_BASE_URL), `429 rate_limited` (token mode: 6 a minute, burst 3,
        per org and per user), and the `provider_*` codes when the token check
        fails.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGitIntegrationInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitIntegrationCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/ProviderError" }
        "503": { $ref: "#/components/responses/ProviderRateLimited" }

  /api/v1/orgs/{org}/integrations/{integration}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { $ref: "#/components/parameters/Integration" }
    get:
      tags: [integrations]
      operationId: getGitIntegration
      summary: One git integration (admin scope and org admin role); no secret
      responses:
        "200":
          description: The integration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitIntegration" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [integrations]
      operationId: updateGitIntegration
      summary: Change the name, URLs, mode, token or enabled flag (admin scope and org admin role)
      description: |
        Absent keeps a value. For `token`, `null` also keeps it and `""` clears
        it; clearing the token alone sets `mode` to `webhook_only`. `mode`
        `token` with no stored token is `400`. A change of `baseUrl` or
        `apiBaseUrl` is `409 conflict` while a repository is mapped, and it
        CLEARS the stored token (mode becomes `webhook_only` unless the same
        request sends a new token), so a stolen session cannot aim the token at
        another host. A new token is checked through the guarded client before
        it is stored. `enabled: false` stops deliveries only: the webhook then
        answers `401`, and hooks stay on the host. Enabling is `409
        integration_limit` or `409 conflict` (the secret is used by another
        enabled integration, or, while a member of the org sees only selected
        teams, a mapped repository has no team: decisions-T20 #65). Never
        idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateGitIntegrationInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitIntegration" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/ProviderError" }
        "503": { $ref: "#/components/responses/ProviderRateLimited" }
    delete:
      tags: [integrations]
      operationId: deleteGitIntegration
      summary: Remove a connection (admin scope and org admin role)
      description: |
        `409 repos_mapped` while a repository is mapped: unmap them first (in
        token mode that deletes the hooks on the host; this route makes no host
        call). Removing deletes this integration's own webhook events,
        deliveries and merge request links, and the sealed secrets. Link
        attachments on issues stay. Nothing of another integration changes.
        Emits no event (integration config, decisions-T17 #52).
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/orgs/{org}/integrations/{integration}/deliveries:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { $ref: "#/components/parameters/Integration" }
    get:
      tags: [integrations]
      operationId: listGitDeliveries
      summary: The deliveries ring of an integration, newest first (admin scope and org admin role)
      description: |
        One summary row per webhook request, at most 100 (the oldest are
        dropped). A row holds the provider's event name, the repository key,
        the result, the HTTP status and one of our own error codes; it holds no
        payload field, secret, signature, caller IP or User-Agent. Rows of a
        request that matched no integration (`result` `bad_signature`, or a
        failure before the signature was checked) have a null `integrationId`
        and are listed on every integration of the same provider; they are
        throttled to one per org, provider and result a minute. There is no
        paging: `nextCursor` is always null.
      responses:
        "200":
          description: Deliveries, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitDeliveryList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/orgs/{org}/integrations/{integration}/check:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { $ref: "#/components/parameters/Integration" }
    post:
      tags: [integrations]
      operationId: checkGitIntegration
      summary: Re-check the stored token (token mode; admin scope and org admin role)
      description: |
        Calls the host through the guarded client. A good check clears
        `attentionCode`; a `401` or `403` from the host sets `token_rejected`,
        an unreachable host sets `attention_unreachable`. `login` can be empty
        (a Bitbucket token may not name a user). A webhook-only integration is
        `409 conflict` and sends nothing. Rate limited: 6 a minute, burst 3, per
        org and per user (`429 rate_limited`).
      responses:
        "200":
          description: The integration after the check
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitIntegrationCheck" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/ProviderError" }
        "503": { $ref: "#/components/responses/ProviderRateLimited" }

  /api/v1/orgs/{org}/integrations/{integration}/rotate-secret:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { $ref: "#/components/parameters/Integration" }
    post:
      tags: [integrations]
      operationId: rotateGitSecret
      summary: Start or retry a webhook secret rotation (admin scope and org admin role)
      description: |
        Stores a PENDING secret. From then on the webhook accepts the current
        AND the pending secret (GitHub: either HMAC; GitLab: either token), so
        no delivery is lost until `commit` or `DELETE` (discard).

        - **Webhook-only:** the server makes the secret and returns it ONCE as
          `webhookSecret`; a GitLab integration may send its own as `secret`
          (32-256 printable ASCII characters). Update the host, then call
          `rotate-secret/commit`. A second call replaces the pending secret.
          GitHub needs `SETTINGS_ENCRYPTION_KEY` (`409 encryption_unavailable`);
          a GitLab integration without one rotates by hash alone.
        - **Token mode:** the server pushes the pending secret to the hook of
          every mapped repo and commits by itself when all of them took it
          (`committed: true`). Token mode never returns the secret. If a hook
          fails, both secrets stay accepted, `committed` is false and
          `failedRepos` lists the repos still on the old secret
          (`hookState: failed`); call again to retry, which REUSES the pending
          secret and pushes only to those repos. Needs an https
          `PUBLIC_BASE_URL` (`409 public_url_required`) and the key.

        A secret used by another enabled integration of the same provider in
        the org is `409 conflict`. A successful commit clears `attentionCode`.
        Rate limited: 6 a minute, burst 3, per org and per user (`429
        rate_limited`). Never idempotent (the response holds a secret). The
        body is optional.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RotateGitSecretInput" }
      responses:
        "200":
          description: The integration with a pending secret (or, in token mode, committed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitRotateResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/ProviderError" }
        "503": { $ref: "#/components/responses/ProviderRateLimited" }
    delete:
      tags: [integrations]
      operationId: discardGitSecret
      summary: Discard a pending secret (admin scope and org admin role)
      description: |
        Drops the pending secret; only the current one is accepted again. It is
        safe to repeat. In token mode a hook that was already moved to the
        dropped secret answers `401` until it is refreshed: those repos show
        `hookState: failed` with `hookError: secret_discarded`, and the next
        `rotate-secret` makes a new secret and pushes it to every repo.
      responses:
        "200":
          description: The integration with no pending secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitIntegration" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/orgs/{org}/integrations/{integration}/rotate-secret/commit:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { $ref: "#/components/parameters/Integration" }
    post:
      tags: [integrations]
      operationId: commitGitSecret
      summary: Make the pending secret the current one (admin scope and org admin role)
      description: |
        Call it when the host is updated (webhook-only). The pending secret is
        re-sealed under the current column and swapped in one transaction, the
        pending secret is cleared and so is `attentionCode`. No pending secret
        is `409 conflict`. In token mode every mapped repo's hook must be
        `active` (on the pending secret), else `409 conflict` naming the repos;
        `force: true` commits anyway and the hooks that did not move are
        refused after the swap. A GitHub integration whose pending secret
        cannot be read (the key changed) is `409 encryption_unavailable`. The
        body is optional.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommitGitSecretInput" }
      responses:
        "200":
          description: The integration after the swap
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitIntegration" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/orgs/{org}/integrations/{integration}/available-repos:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { $ref: "#/components/parameters/Integration" }
    get:
      tags: [integrations]
      operationId: listAvailableGitRepos
      summary: Repositories the token can see (token mode; admin scope and org admin role)
      description: |
        One page, at most 50 rows, through the guarded client. `cursor` is
        opaque (never a URL); a list stops after 5 pages. GitHub has no name
        filter, so `q` filters the page and a page can come back short while
        `nextCursor` is set. A webhook-only integration is `409 conflict`. Host
        failures are the `provider_*` codes. Rate limited like `check`.
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: A page of repositories
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvailableRepoPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/ProviderError" }
        "503": { $ref: "#/components/responses/ProviderRateLimited" }

  /api/v1/orgs/{org}/integrations/{integration}/repos:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { $ref: "#/components/parameters/Integration" }
    get:
      tags: [integrations]
      operationId: listGitRepos
      summary: The mapped repositories with their hook state (admin scope and org admin role)
      responses:
        "200":
          description: Mappings, oldest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitRepoList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [integrations]
      operationId: createGitRepo
      summary: Map a repository (admin scope and org admin role)
      description: |
        **Token mode** takes `repoId` (from `available-repos`); the server
        reads the repository from the host and takes `repoKey` and `repoPath`
        from it, never from the body (sending them is `400`). It makes the hook
        FIRST and the row second: a hook that fails leaves no row and answers a
        `provider_*` error. The hook gets the pending secret while a rotation
        is pending. Needs the key and an https `PUBLIC_BASE_URL`; a GitLab row
        that keeps its secret as a hash only is `409 conflict` until a rotation
        has stored a sealed secret. Rate limited like `check`.

        **Webhook-only** takes `repoKey` and `repoPath` (for people) and writes
        the row only; the admin makes the hook. `repoKey` is the numeric
        repository id the host sends (GitLab, GitHub, Bitbucket Data Center) or,
        for Bitbucket Cloud, `{workspace uuid}/{repository uuid}` with the
        braces (stored in lower case). Token mode reads it from the host.

        A repository that is already mapped is `409 conflict`. `teamId` (a team
        id or key) limits linking to that team's issues. While a member of the
        org sees only selected teams, a map with no `teamId` on an enabled
        integration is `409 conflict` (decisions-T20 #65); in token mode the
        refusal comes before any hook is made.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGitRepoInput" }
      responses:
        "201":
          description: Mapped
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitRepo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/ProviderError" }
        "503": { $ref: "#/components/responses/ProviderRateLimited" }

  /api/v1/orgs/{org}/integrations/{integration}/repos/{repo}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { $ref: "#/components/parameters/Integration" }
      - { name: repo, in: path, required: true, description: "the mapping id (not the host's repository id)", schema: { type: string, format: uuid } }
    patch:
      tags: [integrations]
      operationId: updateGitRepo
      summary: Change the team of a mapping (admin scope and org admin role)
      description: |
        `teamId` (a team id or key) limits linking to that team's issues; null
        clears it. While a member of the org sees only selected teams, clearing
        the team of a repository of an enabled integration is `409 conflict`,
        naming the repository (decisions-T20 #65).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateGitRepoInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitRepo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [integrations]
      operationId: deleteGitRepo
      summary: Unmap a repository (admin scope and org admin role)
      description: |
        `{repo}` is the map row id. In token mode the hook is deleted first, by
        the hook id the map stored; a host 404 counts as done. The row is
        deleted in every case, and links already made stay. `hookRemoved` is
        false when the hook is still on the host (webhook-only, or the host
        answered 5xx, 403 or timed out): remove it by hand. The route never
        returns a `provider_*` error. A hook delete (token mode) takes the same
        allowance as `check` (`429 rate_limited`, nothing deleted).
      responses:
        "200":
          description: Unmapped
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitRepoRemoved" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/orgs/{org}/integrations/{integration}/repos/{repo}/hook/refresh:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { $ref: "#/components/parameters/Integration" }
      - { name: repo, in: path, required: true, description: "the mapping id (not the host's repository id)", schema: { type: string, format: uuid } }
    post:
      tags: [integrations]
      operationId: refreshGitHook
      summary: Update the hook of a mapped repository to the current event set (admin scope and org admin role)
      description: |
        Token mode only. Makes the repository's hook again with the current
        events (list the repository's hooks, match by URL, update it), so a
        hook made before a new event set (pull request reviews, LAUN-83) learns
        it. Press it once after an update that adds events. The hook gets the
        current secret. Answers `409 conflict` when the integration has no
        token, when a secret rotation is pending (commit or discard it first),
        and when the stored secret is a hash only. A failed hook call sets
        `hookState` to `failed` and answers the `provider_*` error. Rate
        limited like `check`. Safe to repeat. GitLab sends approvals in its
        merge request events, so a GitLab hook has nothing new to learn.
      responses:
        "200":
          description: The hook is current
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HookRefreshResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/ProviderError" }
        "503": { $ref: "#/components/responses/ProviderRateLimited" }

  /api/v1/orgs/{org}/integrations/{integration}/repos/{repo}/backfill:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { $ref: "#/components/parameters/Integration" }
      - { name: repo, in: path, required: true, description: "the mapping id (not the host's repository id)", schema: { type: string, format: uuid } }
    post:
      tags: [integrations]
      operationId: backfillGitRepo
      summary: Link the open merge requests of a mapped repository (admin scope and org admin role)
      description: |
        Token mode only. Reads the repository's OPEN merge or pull requests
        through the host's API (newest first, at most 200, at most 5 pages,
        30 seconds) and applies each one as an `opened` event, with the same
        rules as a live webhook: it links the issues named in the branch,
        title or description, moves an issue forward only (a draft is linked
        and not moved), and skips a change from a fork. It has no delivery row
        and no delivery key; a repeat is safe. `409 conflict` on a disabled
        integration, and on a repository with no team while a member of the
        org sees only selected teams (decisions-T20 #65: the backfill would
        match issues of every team). `seen` is the changes read,
        `linked` the issues that got a new link, `moved` the issues moved.
        `truncated` is true when more open changes were left, or when the 30
        seconds ran out (also during a database write or a review read; the
        answer is then 200 with the counts of the work already committed, and
        a repeat is safe): run it again. The host's review state of each
        change is read and applied, also to a link that exists: Bitbucket
        carries it in the list answer; GitHub and GitLab cost one more API
        call per change. A failed review read keeps the stored review. Rate
        limited like `check`.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200":
          description: Backfilled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackfillResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/ProviderError" }
        "503": { $ref: "#/components/responses/ProviderRateLimited" }

  /api/v1/orgs/{org}/events:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [events]
      operationId: listEvents
      summary: The change feed after a seq, oldest first
      description: |
        `seq` is per org and increases in commit order, so polling with
        `after=<last seq seen>` never skips an event. `nextCursor` is set when
        the page is full; pass it back as `after`.
        The feed holds only the events the caller may read: an event of a
        team the caller cannot see is left out, so `seq` can have gaps. When
        the page is not full but the server read past its last item (events
        left out), `nextCursor` is the seq it read up to; resume from it, so
        the same rows are not read again. No `nextCursor` means the end.
      parameters:
        - { name: after, in: query, schema: { type: integer, format: int64, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/orgs/{org}/events/stream:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [events]
      operationId: streamEvents
      summary: Server-Sent Events stream of the change feed
      description: |
        Each event is `id: <seq>`, `event: <type>`, `data: <Event JSON>`.
        Resume with the `Last-Event-ID` header (browsers send it on
        reconnect) or `?after=`; with neither, the stream starts at the
        newest event. A `: ping` comment is sent every 15 seconds.
        The stream ends with the comment line `: credentials no longer valid`
        when the token is revoked or expires, the user is deactivated, or the
        org membership is removed. Credentials are re-checked every poll
        interval, so this happens within 10 seconds. The stream carries the
        same events as `GET /events` for the caller. When the caller's role
        or team access changes, the stream first sends `event: access` with
        `data: {}` and no `id`; refetch what is shown, as later events follow
        the new access. A browser opens the
        stream with `new EventSource(url, { withCredentials: true })`; the
        session cookie authenticates it (a GET needs no CSRF header), and
        the stream ends the same way when the session is logged out or
        expires.
      parameters:
        - { name: Last-Event-ID, in: header, schema: { type: string } }
        - { name: after, in: query, schema: { type: integer, format: int64, minimum: 0 } }
      responses:
        "200":
          description: An open event stream
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # --- platform: install-wide settings, platform admin only ---
  /api/v1/platform/settings:
    get:
      tags: [platform]
      operationId: getPlatformSettings
      summary: The platform settings (mail provider, sign-up mode)
      description: |
        Platform admin only: a platform admin's web session, or their token
        with the admin scope and NO org pin (an org-pinned token, such as the
        first token from setup, is `403 forbidden`). Secrets are
        write-only: the body says only whether the Postmark token and the
        SMTP password are stored (`postmarkTokenSet`, `smtpPasswordSet`),
        never their values. `activeMail` is what this server sends login
        email with now. It differs from `mailProvider` when the provider is
        `env`, or when `secretsUnreadable` is true (the secrets were stored
        under another `SETTINGS_ENCRYPTION_KEY`, so mail falls back to the
        environment until they are entered again). `loginAvailable` says
        whether login can issue codes on this server now: it needs a
        transport and `AUTH_OTP_PEPPER`.
      responses:
        "200":
          description: The settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [platform]
      operationId: updatePlatformSettings
      summary: Replace the platform settings
      description: |
        The whole settings, validated: every non-secret field is required
        (an empty string clears a text field). For each secret
        (`postmarkToken`, `smtpPassword`): absent or `null` keeps the stored
        one, `""` clears it, a value replaces it. A stored secret that this
        server cannot open is dropped; if the chosen provider needs it, the
        answer is `400` and asks for it again.

        `mailProvider`: `env` (the environment's `POSTMARK_*`, else the dev
        log on a local/test server, else off; the behaviour before
        the settings), `none` (no email; the login routes answer `503
        login_unavailable`), `postmark` (needs `postmarkToken` and
        `postmarkFrom`), `smtp` (needs `smtpHost` and `smtpFromAddress`,
        and `smtpPassword` with a `smtpUsername`; `smtpPort` 0 stores 587). SMTP
        auth is PLAIN, and `smtpSecurity` `none` with a username is refused
        unless `smtpHost` is `localhost`, `127.0.0.1` or `::1`.
        `signupMode` is stored only; sign-up follows it in a later release.

        This server uses the new settings at once; other servers within 60
        seconds. Each bad field is named in the `400` message. JSON only
        (`415` otherwise). No `Idempotency-Key` (`400`): the body holds
        secrets. `409 conflict` when the body sets a secret and the server
        has no `SETTINGS_ENCRYPTION_KEY`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformSettingsInput" }
      responses:
        "200":
          description: The settings as stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "conflict: a secret was sent, and the server has no SETTINGS_ENCRYPTION_KEY"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: "unsupported_media_type"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/platform/mail/test:
    post:
      tags: [platform]
      operationId: testPlatformMail
      summary: Send a test email to yourself
      description: |
        Sends one email to the caller's own address through the transport
        login uses now (`activeMail`; the settings are re-read first). No
        body. Rate limited (`429` with `Retry-After`). `400` when the
        caller has no email address; `503 login_unavailable` when there is
        no transport; `502 mail_send_failed` when the send fails. The
        message of a `502` names the step and the server's numeric reply
        code only: never the mail server's reply text, a password or a
        token. No `Idempotency-Key` (`400`).
      responses:
        "200":
          description: Sent (accepted by the mail server or Postmark)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailTestResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502":
          description: "mail_send_failed: the transport refused or failed; the message says at which step"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/LoginUnavailable" }
  # --- end platform ---

  # --- scheduled backups (LAUN-69, docs/internal/decisions-T16-backups.md #43) ---
  # Every route: a platform admin's web session, or their token with the admin
  # scope and NO org pin. Writes are JSON only and take no Idempotency-Key
  # (400). None dials a destination: probe, test, exchange and run queue a row
  # for the offsite worker. No event is emitted; the record is the change log.
  /api/v1/platform/backups/settings:
    get:
      tags: [platform]
      operationId: getBackupSettings
      summary: The backup notice settings and the signing public key
      description: |
        Platform admin only. `signingPublic` is the public half of the key that
        signs every backup manifest (standard base64 of 32 bytes); it is empty
        until `offsite` makes the key at its first start. There is no route to
        replace it (`deploy.sh --backup-rotate-signing`). `installId` names the
        remote files (`launchpad-<installId>-...`).
      responses:
        "200":
          description: The settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [platform]
      operationId: updateBackupSettings
      summary: Replace the backup notice settings
      description: |
        The whole notice object; every field is required. A save that changes a
        value writes one change-log row (`notice_settings_changed`); a save that
        changes nothing writes none. `staleAlertHours` 0 turns the stale alert off.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupSettingsInput" }
      responses:
        "200":
          description: The settings as stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "415":
          description: "unsupported_media_type"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/platform/backups/status:
    get:
      tags: [platform]
      operationId: getBackupStatus
      summary: The state of backups now
      description: |
        The newest local dump, whether `BACKUP_ENCRYPTION_KEY` is set and whether
        the stored key check and the signing key match it, the signing public
        key, the recipients, the destination types this build can run
        (`supportedTypes`, from the driver registry: a type with no driver is
        absent) and `banners`: codes the page turns into warnings
        (`encryption_key_missing`, `key_mismatch`, `signing_key_missing`,
        `signing_key_unreadable`, `no_active_recipient`, `no_recent_dump`).
        The stale-alert and mail-off fields come with the notice job.
      responses:
        "200":
          description: The status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/platform/backups/recipients:
    get:
      tags: [platform]
      operationId: listBackupRecipients
      summary: The age recipients (public keys) backups are encrypted to
      description: |
        Each element has a `state`: `pending` (added, held for 24 hours),
        `active`, or `removing` (active until `removeAt`). `fingerprint` is the
        full sha256 (64 hex characters) of the `age1...` string and is the key of
        the routes below; `shortFingerprint` is its first 12 characters.
      responses:
        "200":
          description: The recipients
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupRecipientList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [platform]
      operationId: addBackupRecipient
      summary: Add an age public key
      description: |
        X25519 keys only (`age1...`; scrypt, SSH and plugin recipients are `400`).
        The add is immediate only when the install never had a recipient
        (`everHadRecipient` false); every later add is `pending` for 24 hours
        (`effectiveAt`), whether or not a destination is enabled. At most 5 live
        keys (active, pending, or removing): `409 conflict` beyond that, for a
        key that is already a recipient, and for a key whose 12 character
        fingerprint equals another's. Writes a change-log row.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddBackupRecipientInput" }
      responses:
        "201":
          description: The recipient
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupRecipient" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415":
          description: "unsupported_media_type"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/platform/backups/recipients/{fingerprint}:
    parameters:
      - { name: fingerprint, in: path, required: true, description: "the full sha256 (64 lower-case hex characters) of the age1... string", schema: { type: string, pattern: "^[0-9a-f]{64}$" } }
    delete:
      tags: [platform]
      operationId: removeBackupRecipient
      summary: Cancel a pending add, or schedule the removal of an active key
      description: |
        On a `pending` key this cancels the add (the key never becomes active). On
        an active key it schedules a removal 24 hours ahead (`removeAt`,
        `removeBy`); the key stays active until then. While a destination is
        enabled the keys that will be active after every pending change must not
        be empty: `409 conflict`. A removal that is already scheduled is `409`.
        The web path has no fast removal: use `server backup-recipient-remove` on
        the host. Writes a change-log row.
      responses:
        "200":
          description: The recipients after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupRecipientList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/platform/backups/recipients/{fingerprint}/cancel:
    parameters:
      - { name: fingerprint, in: path, required: true, description: "the full sha256 (64 lower-case hex characters) of the age1... string", schema: { type: string, pattern: "^[0-9a-f]{64}$" } }
    post:
      tags: [platform]
      operationId: cancelBackupRecipient
      summary: Cancel a pending add or a pending removal
      description: |
        A pending add can be cancelled by any platform admin, the one who made it
        included. A pending removal can be cancelled only by a DIFFERENT platform
        admin than the one who scheduled it (`403 forbidden`); on a sole-admin
        install use `server backup-recipient-cancel` on the host. The non-empty
        rule of the removal applies to cancelling a pending add too (`409`). A key
        with nothing pending is `409`. Writes a change-log row. No body.
      responses:
        "200":
          description: The recipients after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupRecipientList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/platform/backups/destinations:
    get:
      tags: [platform]
      operationId: listBackupDestinations
      summary: The backup destinations
      description: |
        Secrets are write-only: `secretsSet` names the secrets that are stored,
        `secretsUnreadable` says that this server cannot open them (another or no
        `BACKUP_ENCRYPTION_KEY`); no value is ever returned. `typeSupported` is
        false when this build has no driver for the type. `lastRun` is the newest
        schedule, manual, catch-up or retry run.
      responses:
        "200":
          description: The destinations, oldest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupDestinationList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [platform]
      operationId: createBackupDestination
      summary: Make a destination (it starts disabled)
      description: |
        The type must be one of `s3`, `webdav`, `sftp`, `dropbox` (`400`
        otherwise). A type this build has no driver for (see `supportedTypes` of
        the status) is `409 conflict`. `config` is validated by the type's driver.
        `secrets` is write-only and sealed under `BACKUP_ENCRYPTION_KEY`
        (`409 conflict` without it); the names per type: s3 `accessKey`,
        `secretKey`; webdav `password`; sftp `password`, `privateKey`; dropbox
        `appKey`, `appSecret` (the refresh token is made by the exchange).
        `keepLast` below 2 is `400` unless `confirmLowKeep` is true. Two
        destinations with one type, host, bucket and folder are `409`. Writes a
        change-log row.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBackupDestinationInput" }
      responses:
        "201":
          description: The destination
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupDestination" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415":
          description: "unsupported_media_type"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/platform/backups/destinations/probe:
    post:
      tags: [platform]
      operationId: probeUnsavedBackupDestination
      summary: Probe an unsaved destination form (phase 1, no credentials)
      description: |
        Queues a `probe` run with no destination: offsite does a handshake that
        sends no credentials and writes the certificate or host key fingerprint to
        the run's `steps`. Poll `GET /runs/{id}`. Rate limited with test, exchange
        and run (6 a minute, burst 3: `429` with `Retry-After`). `503
        backup_unavailable` without `BACKUP_ENCRYPTION_KEY` or for a type with no
        driver. Queues a row only; nothing is dialed here.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupProbeInput" }
      responses:
        "202":
          description: The queued run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupRun" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "415":
          description: "unsupported_media_type: the body is not JSON"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/BackupUnavailable" }

  /api/v1/platform/backups/destinations/test:
    post:
      tags: [platform]
      operationId: testUnsavedBackupDestination
      summary: Test an unsaved destination form (phase 2)
      description: |
        Queues a `test` run with no destination. The secrets in the body are
        sealed into the run row for the length of the test and deleted when it
        ends. `useSavedSecretsFrom` names a stored destination whose secrets fill
        the names the body leaves out; the config must then equal that
        destination's (`400` otherwise), so a stored secret never goes to a new
        host. A Dropbox form cannot be tested before it is saved (`400`: the code
        is single use; the exchange is the first test). `confirmedFingerprint`
        rides in the run and is saved with the destination when the form is
        created. Rate limited (`429`); `503 backup_unavailable` as for probe.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupUnsavedTestInput" }
      responses:
        "202":
          description: The queued run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupRun" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415":
          description: "unsupported_media_type: the body is not JSON"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/BackupUnavailable" }

  /api/v1/platform/backups/destinations/{id}:
    parameters:
      - { name: id, in: path, required: true, description: destination id, schema: { type: string, format: uuid } }
    get:
      tags: [platform]
      operationId: getBackupDestination
      summary: A destination
      responses:
        "200":
          description: The destination
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupDestination" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [platform]
      operationId: updateBackupDestination
      summary: Edit a destination
      description: |
        Absent fields stay. A secret absent or `null` is kept, `""` clears it, a
        value replaces it. A change to ANY `config` field (host, URL, bucket,
        region, user, folder, the TLS pin or the SSH host key) while a stored
        secret is kept is `400`: send every stored secret again (or `""`). A
        stored blob this server cannot open is dropped when any secret is
        written, and the first secret sealed under the current key replaces the
        key check. `enabled: true` is `409 conflict` without
        `BACKUP_ENCRYPTION_KEY`, a driver for the type, a signing key that this
        server can open, an active recipient, readable secrets, or the secrets the
        type needs (Dropbox: the refresh token the exchange made). `keepLast` 1
        needs `confirmLowKeep` (`400`). Every changed field writes a change-log
        row (renamed, config changed, secrets changed (names only), schedule,
        retention, enabled, disabled).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateBackupDestinationInput" }
      responses:
        "200":
          description: The destination as stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupDestination" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415":
          description: "unsupported_media_type"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [platform]
      operationId: deleteBackupDestination
      summary: Delete a destination
      description: |
        Its runs and change-log rows stay, with `destinationName`. Queued, waiting
        and running runs are cancelled by the worker. Writes a change-log row.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/platform/backups/destinations/{id}/probe:
    parameters:
      - { name: id, in: path, required: true, description: destination id, schema: { type: string, format: uuid } }
    post:
      tags: [platform]
      operationId: probeBackupDestination
      summary: Probe a saved destination (phase 1, no credentials)
      description: Queues a `probe` run. No body. Rate limited (`429`); `503 backup_unavailable` without the key or a driver.
      responses:
        "202":
          description: The queued run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupRun" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/BackupUnavailable" }

  /api/v1/platform/backups/destinations/{id}/test:
    parameters:
      - { name: id, in: path, required: true, description: destination id, schema: { type: string, format: uuid } }
    post:
      tags: [platform]
      operationId: testBackupDestination
      summary: Test a saved destination (phase 2)
      description: |
        Queues a `test` run (a small file is written, listed, read back and
        deleted). The body is optional. `confirmedFingerprint` (the fingerprint the
        probe showed) is saved as the TLS pin (`tlsPin`) or SSH host key
        (`hostKey`) in `config`, with a change-log row, BEFORE the run is queued,
        and only when the destination has none; a different one already saved is
        `400` (enter the secrets again with a PATCH). Rate limited (`429`);
        `503 backup_unavailable` without the key or a driver.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupTestInput" }
      responses:
        "202":
          description: The queued run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupRun" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415":
          description: "unsupported_media_type: the body is not JSON"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/BackupUnavailable" }

  /api/v1/platform/backups/destinations/{id}/exchange:
    parameters:
      - { name: id, in: path, required: true, description: destination id, schema: { type: string, format: uuid } }
    post:
      tags: [platform]
      operationId: exchangeBackupDestination
      summary: Exchange a Dropbox authorization code
      description: |
        Dropbox only (`400` otherwise). The code is single use. It is sealed with
        the stored app key and app secret into a run row and queued; offsite
        exchanges it once and stores the refresh token as a secret. A failed
        exchange needs a new code, sent here again. `409 conflict` when the app
        key and secret are not saved or cannot be opened. Rate limited (`429`);
        `503 backup_unavailable` without the key or a Dropbox driver.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupExchangeInput" }
      responses:
        "202":
          description: The queued run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupRun" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415":
          description: "unsupported_media_type: the body is not JSON"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/BackupUnavailable" }

  /api/v1/platform/backups/destinations/{id}/run:
    parameters:
      - { name: id, in: path, required: true, description: destination id, schema: { type: string, format: uuid } }
    post:
      tags: [platform]
      operationId: runBackupDestination
      summary: Back up now
      description: |
        Asks for a fresh dump and queues a `manual` run that waits for it. `409
        conflict` on a disabled destination. `409 destination_busy` while a
        backup run of this destination is queued, waiting or running; a QUEUED
        retry is cancelled instead and the run starts (if the retry was just
        claimed it is `409 destination_busy`). Rate limited (`429`); `503
        backup_unavailable` without the key or a driver. No body.
      responses:
        "202":
          description: The queued run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupRun" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/BackupUnavailable" }

  /api/v1/platform/backups/runs:
    get:
      tags: [platform]
      operationId: listBackupRuns
      summary: The run table, newest first
      description: Keyset paging with an opaque `cursor`; `destination` filters to one destination. `limit` 1 to 200 (default 50).
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: destination, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: A page of runs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupRunPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/platform/backups/runs/{id}:
    parameters:
      - { name: id, in: path, required: true, description: run id, schema: { type: string, format: uuid } }
    get:
      tags: [platform]
      operationId: getBackupRun
      summary: A run (a probe or test run returns its steps)
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupRun" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/platform/backups/changes:
    get:
      tags: [platform]
      operationId: listBackupChanges
      summary: The change log, newest first
      description: |
        Every destination, recipient, notice and signing-key change, with the actor
        (`null` for a host command). `detail` holds no secret.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: A page of changes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupChangePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  # --- end scheduled backups (LAUN-69) ---

  # --- sign-up requests, invites and platform admins (docs/internal/decisions-T12-signups-invites.md) ---
  /api/v1/signups:
    post:
      tags: [signups]
      operationId: requestSignup
      summary: Ask to join the install's org (sign-up mode approval only)
      description: |
        Public. Open only while the platform sign-up mode is `approval`;
        in every other mode (and before first-run setup) the answer is one
        fixed `403 signup_unavailable`.

        The answer is `202 {}` whether the email is new, belongs to a user,
        has a pending request or is blocked, and whether the username is
        taken: it never says which. A new address stores a pending request
        (for the install's one org), also with a taken username (the
        approval refuses that one). When mail works, a 6-digit confirm code
        goes to the address (1 hour, 5 tries for a code, 10 in all for the
        request); the request shows to admins only after the confirm, and
        expires after 24 hours until then. Without mail the request shows to
        admins as email-unverified. A second request for an unconfirmed
        pending address mails a fresh code and changes nothing else. An
        address that has an account gets a short "you have an account"
        email instead; a blocked one gets nothing.

        NO user, membership or session exists until an org admin approves
        the request; until then the address cannot log in. A request in the
        admin queue expires 30 days after it was made. Caps per org: 200 in
        the admin queue, 1000 waiting for their code. Over a cap the answer
        is `429 rate_limited` for every address.

        The `/auth/otp` protection: `Content-Type: application/json`
        (`415`), no `Idempotency-Key` (`400`), every answer takes at least
        300 ms, and limits (30 a minute in all, burst 10; 10 an hour per
        client address; 3 an hour per email). The client address is known
        only for a direct connection or behind the proxies in
        `TRUSTED_PROXY_CIDRS` (decisions-T12 #9); else there is no
        per-client limit. Reads no cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupCreateRequest" }
            example: { email: ann@example.com, name: Ann Example, username: ann, note: "I work on the iOS app" }
      responses:
        "202":
          description: Accepted (the same answer in every case)
          content:
            application/json:
              schema: { type: object, additionalProperties: false }
              example: {}
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: "signup_unavailable: the sign-up mode is not approval"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: "unsupported_media_type"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/signups/confirm:
    post:
      tags: [signups]
      operationId: confirmSignup
      summary: Prove the email of a pending sign-up request
      description: |
        Public; sign-up mode `approval` only (`403 signup_unavailable`
        otherwise). The code from the confirm email marks the pending
        request `emailVerified`. It does not log anyone in. Every failure
        (no pending request, no code, a wrong, expired, used or locked code)
        is the same `401 invalid_code`; 5 wrong tries lock the code (a new
        `POST /signups` mails a fresh one), and 10 wrong tries in all lock
        the request. A confirmed request joins the admin queue: when the
        queue is full the answer is `429` and the code still works later.
        The same protection as `POST /signups` (60 a minute in all, burst
        20; 30 an hour per client; 5 an hour per email).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupConfirmRequest" }
            example: { email: ann@example.com, code: "123456" }
      responses:
        "204": { description: The email is confirmed }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: "invalid_code"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: "signup_unavailable"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: "unsupported_media_type"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/invites/accept:
    post:
      tags: [invites]
      operationId: acceptInvite
      summary: Accept an org invite
      description: |
        Public; sign-up mode `invite` or `approval` (`403
        signup_unavailable` in `closed`). `token` is the fragment of the
        invite link (`<PUBLIC_BASE_URL>/invite#<token>`).

        One transaction: the invite is used up, then
        - the email is not a user yet: `username` and `name` are required
          (`400` otherwise, and the invite stays usable); the user, the
          membership with the invite's role and a web session are made. `201`
          sets the two session cookies, like `POST /auth/otp/verify`, and
          `session` is the login body.
        - the email is a user: the membership is added and NO session
          starts (`200`, status `joined`). The person logs in as usual. The
          body says nothing about the user.

        Team access (decisions-T20 #27): a new membership gets the invite's
        access in the same transaction. For a `selected` invite it gets the
        invite's teams that still exist; when none is left the accept is
        `409` and the invite stays usable (an admin revokes it and sends a
        new one). An existing member keeps their access. A `selected`
        accept is also `409`, naming nothing, while an enabled
        integration has a repository with no team (the webhook guard, #65);
        the invite stays usable.

        A wrong, expired, used or revoked token (and an invite for a
        deactivated user) is one fixed `401 invalid_invite`. A taken
        username is `409` and leaves the invite usable. Two accepts with one
        token: exactly one wins. JSON only, no `Idempotency-Key`, a 300 ms
        floor, 30 a minute in all (burst 10) and 20 an hour per client.
        Reads no cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteAcceptInput" }
            example: { token: "6h0p...43 characters...", name: Ann Example, username: ann }
      responses:
        "201":
          description: A new user, logged in
          headers:
            Set-Cookie:
              description: "`__Host-odt_session` and `__Host-odt_csrf` (two headers; bare names on a local dev server)"
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteAcceptResponse" }
        "200":
          description: The email was a user; the membership is added, no session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteAcceptResponse" }
              example: { status: joined, org: { id: 0192f0a4-0000-7000-8000-000000000001, slug: orbit, name: Orbit, role: member } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: "invalid_invite"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: "signup_unavailable (sign-up mode closed)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415":
          description: "unsupported_media_type"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/orgs/{org}/signups:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [signups]
      operationId: listSignups
      summary: Sign-up requests of this org, newest first (admin scope)
      description: |
        Expired pending requests are marked `expired` before the read.
        While mail works, a pending request that waits for its confirm code
        is left out (it shows after the confirm). A request made while mail
        was off has no code: it shows with `emailVerified: false`, also
        after mail works again, so an admin can approve or reject it. Never shows a confirm code or its hash.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected, expired, all], default: pending }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignupRequestList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/orgs/{org}/signups/unconfirmed:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    delete:
      tags: [signups]
      operationId: purgeUnconfirmedSignups
      summary: Delete every request that waits for its confirm code (admin scope)
      description: |
        The admin's way out when a flood holds the unconfirmed cap (1000):
        it deletes every pending request that is not confirmed and has a
        confirm code. Confirmed requests, and requests made while mail was
        off (no code), stay. The 24-hour expiry frees the cap by itself too.
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignupPurgeResult" }
              example: { deleted: 42 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/orgs/{org}/signups/{signup}/approve:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: signup, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [signups]
      operationId: approveSignup
      summary: Approve a pending request; makes the user and the membership (admin scope)
      description: |
        Sign-up mode `approval` only (`403 signup_unavailable` otherwise).
        In one transaction: the user (the request's username, name and
        email), the membership with role `member`, and the decision (who,
        when). While mail works, a request that waits for its confirm code is
        `409`. A request approved without a proved email makes an account
        whose first email-code login revokes every token it had before. The person then logs in with an email code; when mail works
        an email says so.

        Team access (decisions-T20 #29): an optional JSON body
        `{teamAccess, teams}`. No body (or `{}`) is `all`, as before.
        `selected` needs 1 to 50 teams of this org (keys or ids; an unknown
        team or another org's is `400`) and writes them in the same
        transaction. While a member or an open invite has `selected`
        access, an enabled integration's repository with no team makes a
        `selected` approval `409`, naming the repositories (the webhook
        guard, #65). A replay of an approved request answers it again and
        changes nothing, whatever the body.

        Replay-safe: approving an approved request answers it again and
        makes nothing; two approvals at once make one user. A rejected or
        expired request, or a username or email that a user has now, is
        `409`. Accepts `Idempotency-Key`. A cookie request needs the CSRF
        header.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupApproveInput" }
            example: { teamAccess: selected, teams: [ORB] }
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignupRequest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "insufficient_scope, forbidden, csrf_failed or signup_unavailable"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/orgs/{org}/signups/{signup}/reject:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: signup, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [signups]
      operationId: rejectSignup
      summary: Reject a request, optionally blocking its email (admin scope)
      description: |
        Any sign-up mode. `reason` is kept for admins and never sent to the
        person. `block: true` stops new requests from the email in this org
        (they are answered `202` as usual and store nothing). A rejected
        request may be rejected again to add the block (the reason does not
        change). An approved or expired request is `409`. JSON body (`{}`
        is fine). Accepts `Idempotency-Key`.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupRejectInput" }
            example: { reason: "Not someone we know", block: true }
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignupRequest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/orgs/{org}/invites:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [invites]
      operationId: listInvites
      summary: Invites of this org, newest first (admin scope); tokens are never listed
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Invites
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [invites]
      operationId: createInvite
      summary: Invite an email to this org (admin scope); the link is returned once
      description: |
        Sign-up mode `invite` or `approval` (`403 signup_unavailable` in
        `closed`). The link is `<PUBLIC_BASE_URL>/invite#<token>` (a bare
        path when `PUBLIC_BASE_URL` is unset). Only `sha256(token)` is
        stored. When mail works the link goes to the address ONLY
        (`emailed: true`) and this body has no `secret` or `url`. Without
        working mail the body has them once (`emailed: false`); give the
        link to the person. An account made from such a copied link loses
        every session and token it had at its first email-code login. The
        link works once, for 7 days.

        Team access (decisions-T20 #26 to #30): `teamAccess` is `all` (the
        default) or `selected` with `teams`, 1 to 50 keys or ids of teams of
        this org (an unknown team or another org's is `400`). An admin
        invite is always `all` (`teams` or `selected` with role `admin` is
        `400`). The accept gives a new member exactly the invite's teams
        that still exist; the accept body cannot name teams. An existing
        member keeps their access (use `PUT /users/{user}/team-access`).

        `409`: an open invite for the email exists (revoke it first), the
        email is a member's, or it belongs to a deactivated user; or, for a
        `selected` invite, an enabled integration has a repository with no
        team (the webhook guard, #65; the text names the repositories). An
        open `selected` invite counts as restricted access for that guard
        until it is accepted, revoked or expired. JSON only;
        never idempotent (`Idempotency-Key` is `400`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteInput" }
            example: { email: ann@example.com, role: member, teamAccess: selected, teams: [ORB] }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedInvite" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "insufficient_scope, forbidden, csrf_failed or signup_unavailable"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415":
          description: "unsupported_media_type"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/orgs/{org}/invites/{invite}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: invite, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [invites]
      operationId: revokeInvite
      summary: Revoke an open invite (admin scope)
      description: |
        Any sign-up mode. The link stops working at once. Revoking twice is
        `204`. An accepted invite is `409` (remove the member instead).
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/platform/admins:
    get:
      tags: [platform]
      operationId: listPlatformAdmins
      summary: The platform admins of the install
      description: Platform admin only (a session, or an unpinned admin token of a platform admin).
      responses:
        "200":
          description: Platform admins
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformAdminList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [platform]
      operationId: addPlatformAdmin
      summary: Make an existing user a platform admin
      description: |
        `user` is the username or the email of an active human user (`404`
        when there is none; `400` for an agent or a deactivated user). `201`
        when the user became one, `200` when they were one already. A token
        or session made before keeps its scopes: the person logs in again for
        the platform routes. JSON only; no `Idempotency-Key`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddPlatformAdminInput" }
            example: { user: ann }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformAdmin" }
        "200":
          description: A platform admin already
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformAdmin" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/platform/admins/{user}:
    parameters:
      - { name: user, in: path, required: true, description: user id, schema: { type: string, format: uuid } }
    delete:
      tags: [platform]
      operationId: removePlatformAdmin
      summary: Take the platform admin flag away
      description: |
        `409 conflict` when it would leave no ACTIVE human platform admin
        (two removals at once cannot both pass). `404` when the user is not a
        platform admin. A platform admin may remove themselves while another
        one remains.
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  # --- end sign-up requests, invites and platform admins ---

  # --- the Linear import in the web app (LAUN-8, decisions-T17 #36 to #45) ---
  /api/v1/orgs/{org}/import/sessions:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    post:
      tags: [import]
      operationId: startImportSession
      summary: Start the org's import session, or return the open one (admin scope)
      description: |
        LAUN-8. A session is the wizard's state: an export on disk, a user map
        and the jobs that ran on them. At most one session is open per org.
        With one open, `200` returns it (and `adopt` is `409 conflict`).

        Refused first: `503 attachments_unavailable` when the install has no
        object store (or cannot reach it), and `409 public_url_required` when
        `PUBLIC_BASE_URL` is empty (it is written into the imported texts as
        the download link of every file).

        `adopt` names a directory a CLI export was placed in under
        `IMPORT_WORK_DIR` (letters, digits, `.`, `_`, `-`, at most 64; a
        symlink or a file is refused). The session then starts as `exported`,
        after the same manifest check as an export job (`507 no_space` when a
        file hit the download limit; other file errors set `failedFiles`).
        The directory is deleted when the session closes.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportStartSessionInput" }
      responses:
        "201":
          description: A new session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportSession" }
        "200":
          description: The open session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/AttachmentsUnavailable" }
        "507": { $ref: "#/components/responses/InsufficientStorage" }
  /api/v1/orgs/{org}/import/sessions/current:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [import]
      operationId: getCurrentImportSession
      summary: The open session with the last job of each kind (admin scope)
      description: |
        `404 not_found` when the org has no open session. A reload of the
        wizard resumes from this answer.
      responses:
        "200":
          description: The open session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/orgs/{org}/import/sessions/{session}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { $ref: "#/components/parameters/ImportSession" }
    delete:
      tags: [import]
      operationId: closeImportSession
      summary: Close the session and delete its work directory (admin scope)
      description: |
        `409 job_active` while a job of the session runs; `409 conflict` when
        it is closed already. The stored user map (Linear emails) goes with it.
      responses:
        "204": { description: Closed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/orgs/{org}/import/sessions/{session}/export:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { $ref: "#/components/parameters/ImportSession" }
    post:
      tags: [import]
      operationId: startImportExport
      summary: Start the Linear export (admin scope)
      description: |
        The Linear API key is in the body, once. It is held in memory by the
        export job only: never in a row, a log line, an event, an error text
        or the response. Never idempotent: an Idempotency-Key header is
        refused with 400. The key is checked with Linear first: `502
        linear_unauthorized` (Linear refused it) or `502 linear_unreachable`.
        `507 no_space` when the work directory has under 1 GiB free.

        The job reads Linear and writes the export under `IMPORT_WORK_DIR`.
        A file that hit the download limit fails the job with code
        `no_space`; another file error succeeds and sets the session's
        `failedFiles` and `failedFileNames` (at most 20).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportExportInput" }
      responses:
        "202":
          description: The export job, queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJob" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502":
          description: "linear_unauthorized or linear_unreachable"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "507": { $ref: "#/components/responses/InsufficientStorage" }
  /api/v1/orgs/{org}/import/sessions/{session}/users:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { $ref: "#/components/parameters/ImportSession" }
    get:
      tags: [import]
      operationId: listImportUsers
      summary: The Linear users of the export, with a suggested match, and the org's members (admin scope)
      description: |
        The suggestion is the member with the same email, else the member
        whose username equals the Linear display name, name or email
        local part. `mapped` is what the saved user map gives the user.
        `409 conflict` before the session has an export.
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportUsers" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/orgs/{org}/import/sessions/{session}/usermap:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { $ref: "#/components/parameters/ImportSession" }
    put:
      tags: [import]
      operationId: putImportUserMap
      summary: Save the user map (admin scope)
      description: |
        The importer's own shape, `{default, users}`: a key is a Linear user
        id or an email, a value an existing username. Every username must be
        an active member of the org (make an agent with `POST /agents`, invite
        a person first), and every Linear user of the export must resolve
        (`400 validation_failed` otherwise). Allowed in `exported`,
        `user_map`, `dry_run_ok` and `failed` (with an export); the session
        becomes `user_map`, and a dry run taken before is no longer current.
        `409 job_active` while any job runs.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportUserMap" }
      responses:
        "200":
          description: The stored map
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportUserMap" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/orgs/{org}/import/sessions/{session}/dry-run:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { $ref: "#/components/parameters/ImportSession" }
    post:
      tags: [import]
      operationId: startImportDryRun
      summary: Start a dry run (admin scope)
      description: |
        The whole import in one transaction, rolled back: it writes no row
        and no object (it only reads the store). The job's `report` gives the
        create, update and skip counts of a real run on the same export and
        `uploads.planned`, the files a real run would upload. Allowed in
        `user_map`, `dry_run_ok` and `failed` (with an export and a map).
        `409 conflict` while the session has `failedFiles > 0` and the body
        does not send `acceptFailedFiles: true`.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportDryRunInput" }
      responses:
        "202":
          description: The dry-run job, queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJob" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/orgs/{org}/import/sessions/{session}/run:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { $ref: "#/components/parameters/ImportSession" }
    post:
      tags: [import]
      operationId: startImportRun
      summary: Start the real import (admin scope)
      description: |
        Needs a succeeded dry run on the CURRENT export and user map
        (`409 dry_run_required`) and the org slug typed in `confirmOrg`
        (`400 validation_failed`). All rows are written in ONE transaction:
        a cancel or a restart rolls everything back (a stopped import keeps
        no rows; start it again; the files it uploaded stay in the store).
        Edits to imported rows are lost on a re-run. The job's `committed` is
        true once the transaction committed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportRunInput" }
      responses:
        "202":
          description: The import job, queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJob" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/orgs/{org}/import/sessions/{session}/verify:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { $ref: "#/components/parameters/ImportSession" }
    post:
      tags: [import]
      operationId: startImportVerify
      summary: Start a verify job (admin scope)
      description: |
        Compares the export with the database. A mismatch ends the job
        `failed` with code `verify_mismatch` and the session `failed`; the job's
        `rows` show entity, expected and actual. Allowed in `imported`,
        `verified` and `failed` when an import of the session committed. A
        verify that is canceled, interrupted or fails for another reason leaves
        the session as it is.
      responses:
        "202":
          description: The verify job, queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/orgs/{org}/import/jobs/{job}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { $ref: "#/components/parameters/ImportJob" }
    get:
      tags: [import]
      operationId: getImportJob
      summary: A job's progress and result (admin scope)
      description: Poll it every 2 seconds. There is no event for import progress.
      responses:
        "200":
          description: The job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/orgs/{org}/import/jobs/{job}/cancel:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { $ref: "#/components/parameters/ImportJob" }
    post:
      tags: [import]
      operationId: cancelImportJob
      summary: Cancel a job (admin scope)
      description: |
        Sets `cancelRequested`; the process that runs the job (it may be
        another instance) sees it at its next heartbeat, within 5 seconds, and
        stops. A dry run or an import rolls back. An export keeps the files it
        made. `409 conflict` when the job has finished.
      responses:
        "202":
          description: The job (cancel requested)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  # --- end the Linear import in the web app (LAUN-8) ---

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: "odt_ + 43 base62 characters"
      description: |
        A personal access token (kind `pat`), or a login token (kind `native`)
        that a native app got from `POST /auth/otp/verify` with `"client":"native"`
        (LAUN-122, LAUN-129). The value of the web cookie (kind `session`) is NOT
        accepted here. A bearer request needs no CSRF header.
    session:
      type: apiKey
      in: cookie
      name: __Host-odt_session
      description: |
        The web session (kind `session`), set by `POST /auth/otp/verify`.
        HttpOnly. A PAT and a native token are refused here. Named `odt_session` (no Secure) on a
        local dev server only.
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        Required with the session cookie on every method except GET, HEAD
        and OPTIONS. Its value must equal the `__Host-odt_csrf` cookie
        (`odt_csrf` on a local dev server).

  parameters:
    ChatService:
      name: service
      in: path
      required: true
      description: chat service id (uuid)
      schema: { type: string, format: uuid }
    PersonalWebhook:
      name: webhook
      in: path
      required: true
      description: personal webhook id (uuid)
      schema: { type: string, format: uuid }
    Org:
      name: org
      in: path
      required: true
      description: org slug
      schema: { type: string, examples: [orbit] }
    Team:
      name: team
      in: path
      required: true
      description: team key (any case), id, or the Linear id of an imported team
      schema: { type: string, examples: [ORB] }
    Product:
      name: product
      in: path
      required: true
      description: product slug (lower case) or its canonical 36-character id; no Linear id resolves
      schema: { type: string, examples: [launchpad] }
    Issue:
      name: issue
      in: path
      required: true
      description: identifier (`ORB-123`, any case), issue id, or an imported Linear id
      schema: { type: string, examples: [ORB-123] }
    Document:
      name: document
      in: path
      required: true
      description: document id or slug
      schema: { type: string }
    ImportSession:
      name: session
      in: path
      required: true
      description: import session id
      schema: { type: string, format: uuid }
    ImportJob:
      name: job
      in: path
      required: true
      description: import job id
      schema: { type: string, format: uuid }
    Integration:
      name: integration
      in: path
      required: true
      description: git integration id
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 250, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: opaque; take it from `nextCursor`. Only valid with the same `orderBy`.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        1-255 printable ASCII characters, per user, kept 24 hours.
        - 2xx and 4xx responses (except 401 and 403) are stored for 24 hours.
          A retry with the same request replays the stored response (header
          `Idempotent-Replayed: true`). 5xx, 401 and 403 are not stored.
        - The request hash covers the method, the path and the RAW body
          bytes, so a retry must resend exactly the same bytes. The same key
          with any other bytes (even equal JSON with other spacing or key
          order) is `409 idempotency_key_reused`.
        - While the first request runs, a retry is `409
          idempotency_in_progress`. A claim that never committed and is older
          than 60 seconds counts as abandoned, and a retry may take it over
          and run.
        - `409 idempotency_outcome_unknown`: the first request's write
          committed but its response was not stored. It is never re-run; read
          the resource instead.
        - Not accepted on POST /tokens (400).
      schema: { type: string, minLength: 1, maxLength: 255 }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: "bad_request, validation_failed, payload_too_large (413) or unsupported_media_type (415)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: "payload_too_large: the request body is over the route's limit"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: "unauthenticated, invalid_token, token_expired or token_revoked"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: "insufficient_scope, forbidden, or csrf_failed (a cookie write without a matching X-CSRF-Token)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: "rate_limited. Always carries Retry-After."
      headers:
        Retry-After:
          description: whole seconds to wait before trying again (at least 1)
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InsufficientStorage:
      description: "no_space: the import work directory has too little free space, or the export hit the download limit"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    LoginUnavailable:
      description: "login_unavailable: the server has no mail transport, so login is off"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AttachmentsUnavailable:
      description: "attachments_unavailable: the server has no object store (S3_*), so file attachments are off"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: "not_found (also for an org the caller cannot see)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    LengthRequired:
      description: "length_required: the request has no Content-Length (no chunked bodies)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Overloaded:
      description: "overloaded: too many webhook bodies are being read at once, or a write collided with a concurrent one (a deadlock or serialization failure) and nothing was written. Always carries Retry-After. Never stored for an Idempotency-Key: send the request again."
      headers:
        Retry-After:
          description: whole seconds to wait before sending the request or delivery again
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: "rate_limited. Carries Retry-After."
      headers:
        Retry-After:
          description: whole seconds to wait
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ProviderError:
      description: "provider_unreachable, provider_unauthorized (the host refused OUR stored token; not our 401), provider_forbidden (the token lacks a scope) or provider_error (any other host failure). No host text is echoed."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ProviderRateLimited:
      description: "provider_rate_limited: the host answered 429. Always carries Retry-After."
      headers:
        Retry-After:
          description: whole seconds to wait
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BackupUnavailable:
      description: "backup_unavailable: the action cannot start now (no BACKUP_ENCRYPTION_KEY on this server, or no driver for the destination type in this build)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: "conflict, destination_busy, version_conflict, stale_placement, idempotency_key_reused, idempotency_in_progress, idempotency_outcome_unknown, integration_limit, encryption_unavailable, public_url_required, integration_exists, secret_in_use, secret_hash_only, repos_mapped, integration_changed, team_in_use, cycle_conflict, cycle_in_use, status_in_use or status_last_of_kind"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    ErrorCode:
      type: string
      enum:
        - bad_request
        - validation_failed
        - unauthenticated
        - invalid_token
        - token_expired
        - token_revoked
        - insufficient_scope
        - forbidden
        - not_found
        - method_not_allowed
        - conflict
        - version_conflict
        - idempotency_key_reused
        - idempotency_in_progress
        - idempotency_outcome_unknown
        - payload_too_large
        - unsupported_media_type
        - internal_error
        - invalid_code
        - csrf_failed
        - rate_limited
        - login_unavailable
        - attachments_unavailable
        - invalid_setup_token
        - setup_complete
        - mail_send_failed
        - chat_send_failed
        - push_send_failed
        - signup_unavailable
        - invalid_invite
        - stale_placement
        - length_required
        - overloaded
        - integration_limit
        - encryption_unavailable
        - public_url_required
        - integration_exists
        - secret_in_use
        - secret_hash_only
        - repos_mapped
        - integration_changed
        - provider_unreachable
        - provider_unauthorized
        - provider_forbidden
        - provider_rate_limited
        - provider_error
        - job_active
        - import_in_progress
        - dry_run_required
        - linear_unauthorized
        - linear_unreachable
        - no_space
        - backup_unavailable
        - destination_busy
        - team_in_use
        - cycle_conflict
        - cycle_in_use
        - status_in_use
        - status_last_of_kind
    Error:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code: { $ref: "#/components/schemas/ErrorCode" }

    # --- the Linear import (LAUN-8) ---
    ImportStartSessionInput:
      type: object
      additionalProperties: false
      properties:
        adopt:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,64}$"
          description: the name of a CLI export directory under IMPORT_WORK_DIR
    ImportExportInput:
      type: object
      additionalProperties: false
      required: [linearApiKey]
      properties:
        linearApiKey:
          type: string
          writeOnly: true
          description: |
            The Linear API key (printable ASCII). Used by the export job only;
            never stored, logged, emitted or returned.
    ImportDryRunInput:
      type: object
      additionalProperties: false
      properties:
        acceptFailedFiles:
          type: boolean
          description: send true after reading the failed-file list
    ImportRunInput:
      type: object
      additionalProperties: false
      required: [confirmOrg]
      properties:
        confirmOrg: { type: string, description: "the org slug, typed by the admin" }
    ImportUserMap:
      type: object
      required: [default, users]
      description: |
        The importer's user map. `users` keys are Linear user ids or emails
        (case-insensitive), values are usernames of org members. `default`
        ("" for none) is used for every user no key names. A map from the CLI
        template may carry a `_users` listing, which is ignored.
      properties:
        default: { type: string }
        users:
          type: object
          additionalProperties: { type: string }
    ImportFailedFile:
      type: object
      required: [name, reason]
      properties:
        name: { type: string }
        reason: { type: string }
    ImportCounts:
      type: object
      required: [export, excluded, create, update, skip]
      properties:
        export: { type: integer }
        excluded: { type: integer }
        create: { type: integer }
        update: { type: integer }
        skip: { type: integer }
    ImportExclusion:
      type: object
      required: [entity, sourceId, reason]
      properties:
        entity: { type: string }
        sourceId: { type: string }
        reason: { type: string }
    ImportUploads:
      type: object
      required: [uploaded, present, planned]
      properties:
        uploaded: { type: integer, description: PUT in this run }
        present: { type: integer, description: "already in the store, same size" }
        planned: { type: integer, description: "a dry run's would-be uploads" }
    ImportReport:
      type: object
      required: [dryRun, counts, exclusionsTotal, exclusions, mergedLabels, mergedRelations, missingCycleNumbers, nextIssueNumbers, cadence, pendingUploads, uploads]
      properties:
        dryRun: { type: boolean }
        counts:
          type: object
          description: per entity
          additionalProperties: { $ref: "#/components/schemas/ImportCounts" }
        exclusionsTotal: { type: integer }
        exclusions:
          type: array
          description: the first 200
          items: { $ref: "#/components/schemas/ImportExclusion" }
        mergedLabels: { type: integer }
        mergedRelations: { type: integer }
        missingCycleNumbers:
          type: object
          additionalProperties: { type: array, items: { type: integer } }
        nextIssueNumbers:
          type: object
          additionalProperties: { type: integer }
        cadence:
          type: object
          additionalProperties: { type: string }
        pendingUploads: { type: integer }
        uploads: { $ref: "#/components/schemas/ImportUploads" }
    ImportVerifyRow:
      type: object
      required: [entity, expected, actual]
      properties:
        entity: { type: string }
        expected: { type: integer }
        actual: { type: integer }
        rows:
          type: array
          description: the first 20 records, as "entity id"
          items: { type: string }
    ImportJob:
      type: object
      required: [id, sessionId, kind, state, phase, done, total, report, rows, rowsTruncated, committed, errorCode, errorText, cancelRequested, failedFiles, failedFileNames, createdAt, startedAt, finishedAt]
      properties:
        id: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        kind: { type: string, enum: [export, dry_run, import, verify] }
        state: { type: string, enum: [queued, running, succeeded, failed, canceled] }
        phase: { type: string, description: "the entity being worked on; `files` counts bytes" }
        done: { type: integer, format: int64 }
        total: { type: integer, format: int64, description: 0 when unknown }
        report:
          oneOf:
            - { $ref: "#/components/schemas/ImportReport" }
            - { type: "null" }
          description: dry run and import jobs, once they end
        rows:
          type: array
          description: verify rows (entity, expected, found), at most 500
          items: { $ref: "#/components/schemas/ImportVerifyRow" }
        rowsTruncated: { type: boolean }
        committed:
          type: boolean
          description: |
            true when the import transaction committed. A `verify_mismatch`
            with `committed: false` kept no rows; with `committed: true` the
            rows are in the database.
        errorCode:
          type: [string, "null"]
          description: |
            verify_mismatch, interrupted, canceled, no_space,
            linear_unauthorized, linear_unreachable, export_failed,
            dry_run_failed, import_failed, verify_failed or export_changed
        errorText: { type: [string, "null"], description: "a short message of ours, never the importer's text" }
        cancelRequested: { type: boolean }
        failedFiles: { type: integer, description: "the session's, set by the export" }
        failedFileNames:
          type: array
          description: at most 20
          items: { $ref: "#/components/schemas/ImportFailedFile" }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, "null"], format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
    ImportSessionJobs:
      type: object
      required: [export, dryRun, import, verify]
      properties:
        export: { oneOf: [{ $ref: "#/components/schemas/ImportJob" }, { type: "null" }] }
        dryRun: { oneOf: [{ $ref: "#/components/schemas/ImportJob" }, { type: "null" }] }
        import: { oneOf: [{ $ref: "#/components/schemas/ImportJob" }, { type: "null" }] }
        verify: { oneOf: [{ $ref: "#/components/schemas/ImportJob" }, { type: "null" }] }
    ImportSession:
      type: object
      required: [id, state, createdBy, exportCounts, hasUserMap, failedFiles, failedFileNames, jobs, createdAt, updatedAt, closedAt]
      properties:
        id: { type: string, format: uuid }
        state:
          type: string
          enum: [new, exporting, exported, user_map, dry_run_ok, importing, imported, verified, failed, closed]
        createdBy: { type: [string, "null"], format: uuid }
        exportCounts:
          type: object
          description: records per export file
          additionalProperties: { type: integer }
        hasUserMap: { type: boolean }
        failedFiles: { type: integer }
        failedFileNames:
          type: array
          items: { $ref: "#/components/schemas/ImportFailedFile" }
        jobs: { $ref: "#/components/schemas/ImportSessionJobs" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        closedAt: { type: [string, "null"], format: date-time }
    ImportExportUser:
      type: object
      required: [id, name, displayName, email, active, app, suggested, mapped]
      properties:
        id: { type: string }
        name: { type: string }
        displayName: { type: string }
        email: { type: string }
        active: { type: boolean }
        app: { type: boolean }
        suggested: { type: [string, "null"], description: a username }
        mapped: { type: [string, "null"], description: the username the saved map gives }
    ImportMember:
      type: object
      required: [username, name, isAgent]
      properties:
        username: { type: string }
        name: { type: string }
        isAgent: { type: boolean }
    ImportUsers:
      type: object
      required: [users, members, map]
      properties:
        users:
          type: array
          items: { $ref: "#/components/schemas/ImportExportUser" }
        members:
          type: array
          items: { $ref: "#/components/schemas/ImportMember" }
        map:
          oneOf:
            - { $ref: "#/components/schemas/ImportUserMap" }
            - { type: "null" }

    NextCursor:
      type: [string, "null"]
      description: null on the last page

    LoginCodeRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254, description: "matched without regard to case" }
    LoginVerifyRequest:
      type: object
      additionalProperties: false
      required: [email, code]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        code: { type: string, pattern: "^[0-9]{6}$" }
        client: { type: string, enum: [web, native], description: "default web (cookies). native: the session token is in the body, no cookie, no CSRF value (LAUN-122)" }
    LoginUser:
      type: object
      required: [id, username, name, email, isPlatformAdmin]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        name: { type: string }
        email: { type: string }
        isPlatformAdmin: { type: boolean, description: "the person runs this install; says nothing about the current token" }
    LoginOrg:
      type: object
      required: [id, slug, name, role]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        role: { type: string, enum: [admin, member] }
    SetupStatus:
      type: object
      required: [setupRequired]
      properties:
        setupRequired: { type: boolean, description: "true while the install has no user" }
    SetupRequest:
      type: object
      additionalProperties: false
      required: [token, user, org, team]
      properties:
        token: { type: string, minLength: 43, maxLength: 43, description: "the fragment of the setup link (base64url, 32 bytes)" }
        user: { $ref: "#/components/schemas/SetupUserInput" }
        org: { $ref: "#/components/schemas/SetupOrgInput" }
        team: { $ref: "#/components/schemas/SetupTeamInput" }
    SetupUserInput:
      type: object
      additionalProperties: false
      required: [username, name, email]
      properties:
        username: { type: string, pattern: "^[a-z][a-z0-9_-]{0,38}$", description: "lower-cased before the check" }
        name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email, maxLength: 254, description: "the login email; stored lower-case" }
    SetupOrgInput:
      type: object
      additionalProperties: false
      required: [slug, name]
      properties:
        slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,38}[a-z0-9]$", description: "the {org} of every path, e.g. orbit" }
        name: { type: string, minLength: 1, maxLength: 200 }
    SetupTeamInput:
      type: object
      additionalProperties: false
      required: [key, name]
      properties:
        key: { type: string, pattern: "^[A-Z][A-Z0-9]{0,9}$", description: "the issue prefix, e.g. ORB" }
        name: { type: string, minLength: 1, maxLength: 200 }
    SetupResponse:
      type: object
      required: [user, orgs, csrfToken, token]
      properties:
        user: { $ref: "#/components/schemas/LoginUser" }
        orgs: { type: array, items: { $ref: "#/components/schemas/LoginOrg" } }
        csrfToken: { type: string, description: "equals the __Host-odt_csrf cookie; send it as X-CSRF-Token" }
        token: { $ref: "#/components/schemas/CreatedToken" }
    LoginResponse:
      type: object
      required: [user, orgs, csrfToken]
      properties:
        user: { $ref: "#/components/schemas/LoginUser" }
        orgs: { type: array, items: { $ref: "#/components/schemas/LoginOrg" } }
        csrfToken: { type: string, description: "equals the __Host-odt_csrf cookie; send it as X-CSRF-Token. Empty from GET /auth/session with a bearer token." }

    LoginNativeResponse:
      type: object
      description: The 200 body of POST /auth/otp/verify for client native (LAUN-122).
      required: [user, orgs, token, expiresAt]
      properties:
        user: { $ref: "#/components/schemas/LoginUser" }
        orgs: { type: array, items: { $ref: "#/components/schemas/LoginOrg" } }
        token: { type: string, description: "the session token, shown once; send it as Authorization Bearer" }
        expiresAt: { type: string, format: date-time }

    UserRef:
      type: object
      required: [id, username, name]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        name: { type: string }
    Me:
      type: object
      required: [id, username, name, displayName, email, isAgent, isPlatformAdmin, tokenId, tokenKind, scopes, pinnedOrgId]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        name: { type: string, description: "same as displayName; kept for T1 clients" }
        displayName: { type: string }
        email: { type: [string, "null"], description: "the caller's own login email; null when it has none (agents)" }
        isAgent: { type: boolean }
        isPlatformAdmin: { type: boolean, description: "the user runs this install; the platform routes also need the admin scope and no org pin" }
        tokenId: { type: string, format: uuid }
        tokenKind: { type: string, enum: [pat, session, native] }
        scopes: { type: array, items: { $ref: "#/components/schemas/Scope" } }
        pinnedOrgId: { type: [string, "null"], format: uuid }
    Scope:
      type: string
      enum: [read, write, admin]
    Member:
      type: object
      required: [id, username, name, email, isAgent, role, createdAt, deactivatedAt, teamAccess, teams]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        name: { type: string }
        email: { type: [string, "null"], description: "null unless the caller is an org admin or this member is the caller" }
        isAgent: { type: boolean }
        role: { type: string, enum: [admin, member] }
        createdAt: { type: string, format: date-time }
        deactivatedAt: { type: [string, "null"], format: date-time }
        teamAccess:
          type: [string, "null"]
          enum: [all, selected, null]
          description: "the member's team access (decisions-T20 #33); an org admin is always all. null unless the caller is an org admin"
        teams:
          type: [array, "null"]
          items: { type: string }
          description: "the team keys of a selected member (empty for all); null unless the caller is an org admin"
    TeamAccessInput:
      type: object
      additionalProperties: false
      required: [teamAccess]
      properties:
        teamAccess: { type: string, enum: [all, selected] }
        teams: { type: array, maxItems: 50, items: { type: string }, description: "keys or ids of teams of this org; selected only; may be empty" }
        assignedIssues: { type: string, enum: [unassign, keep], description: "what happens to the member's open issues in the teams the member loses; required when there are some (409 otherwise)" }
    TeamIssueCount:
      type: object
      required: [teamId, openIssues]
      properties:
        teamId: { type: string, format: uuid }
        openIssues: { type: integer, format: int64 }
    RemovedNotifyRows:
      type: object
      required: [subscriptions, follows, settings]
      properties:
        subscriptions: { type: integer, format: int64 }
        follows: { type: integer, format: int64 }
        settings: { type: integer, format: int64 }
    TeamAccessResult:
      type: object
      required: [userId, teamAccess, teamIds, dryRun, changed, addedTeamIds, lostTeamIds, assignedInLostTeams, unassigned, hiddenAssigned, removed]
      properties:
        userId: { type: string, format: uuid }
        teamAccess: { type: string, enum: [all, selected] }
        teamIds: { type: array, items: { type: string, format: uuid }, description: "the member's teams after the change; empty for all" }
        dryRun: { type: boolean, description: "true: nothing was written" }
        changed: { type: boolean, description: "the access, a team row, an assignee or a notification row changed (or would, in a dry run)" }
        addedTeamIds: { type: array, items: { type: string, format: uuid } }
        lostTeamIds: { type: array, items: { type: string, format: uuid } }
        assignedInLostTeams: { type: array, items: { $ref: "#/components/schemas/TeamIssueCount" }, description: "the member's open issues in each lost team, before any unassign" }
        unassigned: { type: integer, description: "open issues whose assignee was cleared (unassign)" }
        hiddenAssigned: { type: integer, format: int64, description: "after the change: the member's open issues in teams the member does not see" }
        removed: { $ref: "#/components/schemas/RemovedNotifyRows" }
    MemberList:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Member" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }

    Org:
      type: object
      required: [id, slug, name, role, createdAt, timeZone, defaultTeam, avatarUrl]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        role: { type: string, enum: [admin, member] }
        createdAt: { type: string, format: date-time }
        timeZone: { type: string, description: "an IANA zone name; UTC until an admin sets it" }
        defaultTeam: { type: [string, "null"], description: "the key of the org's default team, or null; null also when the caller cannot see that team (decisions-T20 #9)" }
        avatarUrl: { type: [string, "null"], description: "the logo on the API (`GET .../avatar?v=<version>`), or null when none is set (LAUN-22)" }
    UpdateOrgInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        timeZone: { type: string, maxLength: 64, description: "an IANA zone name such as Europe/London or UTC" }
        defaultTeam: { type: [string, "null"], description: "a team key or id of this org; null clears it" }
    OnboardingStepId:
      type: string
      enum: [organisation, mail, signups, team, agent, import, githost, invite, products]
    OnboardingStep:
      type: object
      required: [id, done, skipped, skippedBy, skippedAt]
      properties:
        id: { $ref: "#/components/schemas/OnboardingStepId" }
        done: { type: boolean, description: "computed by the server from the data, never by a click" }
        skipped: { type: boolean, description: "an org admin skipped it; shared by all admins of the org" }
        skippedBy: { oneOf: [{ $ref: "#/components/schemas/UserRef" }, { type: "null" }] }
        skippedAt: { type: [string, "null"], format: date-time }
    Onboarding:
      type: object
      required: [steps, remaining, capabilities]
      properties:
        steps:
          type: array
          items: { $ref: "#/components/schemas/OnboardingStep" }
        remaining: { type: integer, description: "steps that are not done, not skipped and available on this server; the optional products step never counts" }
        capabilities:
          type: array
          items: { type: string, enum: [linearImport, gitHosts, attachments] }
    AgentGuidanceEntry:
      type: object
      required: [team, text, updatedAt]
      properties:
        team: { type: [string, "null"], description: "the team key; null is the org-wide entry" }
        text: { type: string }
        updatedAt: { type: string, format: date-time }
    AgentGuidance:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AgentGuidanceEntry" } }
    AgentGuidanceInput:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        team: { type: [string, "null"], description: "team key or id; absent or null is the org-wide entry" }
        text: { type: string, maxLength: 8192, description: "markdown; trimmed; 1 to 8192 UTF-8 bytes" }
    ChatService:
      type: object
      required: [id, name, kind, host, teamId, events, enabled, lastOkAt, lastError, secretUnreadable, createdAt, updatedAt, rateCappedCount, lastRateCappedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 40 }
        kind: { type: string, enum: [slack, discord, fluxer, custom] }
        host: { type: string, description: "the host name of the webhook (hooks.slack.com, discord.com or the fluxer or custom host); never the rest of the URL" }
        teamId: { type: string, format: uuid, description: "the one team whose issues the service posts; an event with no team posts nowhere" }
        events:
          type: array
          items: { type: string, enum: [assigned, mention, comment, state_change, new_issue, project_update_due] }
        enabled: { type: boolean, description: "off: nothing is posted and waiting posts are dropped" }
        lastOkAt: { type: [string, "null"], format: date-time }
        lastError:
          type: [string, "null"]
          enum: [chat_rejected, chat_gone, chat_rate_limited, chat_unavailable, chat_unreachable, chat_blocked, chat_redirect, chat_unreadable, null]
        secretUnreadable: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        rateCappedCount: { type: integer, format: int64, description: "posts the hourly cap (60 per service) dropped in the last 24 hours; a count only" }
        lastRateCappedAt: { type: [string, "null"], format: date-time, description: "the latest drop in that window" }
    ChatServiceList:
      type: object
      required: [available, linksAvailable, limit, items]
      properties:
        available: { type: boolean, description: "this server can store a webhook (SETTINGS_ENCRYPTION_KEY is set)" }
        linksAvailable: { type: boolean, description: "PUBLIC_BASE_URL is set; without it no post is sent" }
        limit: { type: integer, description: "the most services one org may have" }
        items:
          type: array
          items: { $ref: "#/components/schemas/ChatService" }
    ChatServiceCreate:
      type: object
      additionalProperties: false
      required: [name, kind, teamId, webhookUrl]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        kind: { type: string, enum: [slack, discord, fluxer, custom] }
        teamId: { type: string, format: uuid, description: "a team of this org (400 validation_failed otherwise)" }
        webhookUrl:
          type: string
          writeOnly: true
          maxLength: 1024
          description: "the webhook URL for the kind (at most 256 bytes for slack and discord); never returned"
        events:
          type: array
          items: { type: string, enum: [assigned, mention, comment, state_change, new_issue, project_update_due] }
        enabled: { type: [boolean, "null"], description: "absent or null: on" }
    ChatServicePatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: [string, "null"], minLength: 1, maxLength: 40 }
        teamId: { type: [string, "null"], format: uuid, description: "moves the service to another team of this org (400 validation_failed otherwise); absent or null keeps it" }
        webhookUrl:
          type: [string, "null"]
          writeOnly: true
          maxLength: 1024
          description: "replaces the stored URL; absent or null keeps it; never returned"
        events:
          type: [array, "null"]
          items: { type: string, enum: [assigned, mention, comment, state_change, new_issue, project_update_due] }
        enabled: { type: [boolean, "null"] }
    ChatTestResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    PersonalWebhook:
      type: object
      required: [id, name, kind, host, events, enabled, lastOkAt, lastError, secretUnreadable, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 40 }
        kind: { type: string, enum: [slack, discord, fluxer, custom] }
        host: { type: string, description: "the host name of the webhook; never the rest of the URL" }
        events:
          type: array
          items: { type: string, enum: [assigned, my_issues] }
        enabled: { type: boolean, description: "off: nothing is posted and waiting posts are dropped" }
        lastOkAt: { type: [string, "null"], format: date-time }
        lastError:
          type: [string, "null"]
          enum: [chat_rejected, chat_gone, chat_rate_limited, chat_unavailable, chat_unreachable, chat_blocked, chat_redirect, chat_unreadable, null]
        secretUnreadable: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PersonalWebhookList:
      type: object
      required: [available, linksAvailable, limit, items]
      properties:
        available: { type: boolean, description: "this server can store a webhook (SETTINGS_ENCRYPTION_KEY is set)" }
        linksAvailable: { type: boolean, description: "PUBLIC_BASE_URL is set; without it no post is sent" }
        limit: { type: integer, description: "the most webhooks one member may have in this org" }
        items:
          type: array
          items: { $ref: "#/components/schemas/PersonalWebhook" }
    PersonalWebhookCreate:
      type: object
      additionalProperties: false
      required: [name, kind, webhookUrl]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        kind: { type: string, enum: [slack, discord, fluxer, custom] }
        webhookUrl:
          type: string
          writeOnly: true
          maxLength: 1024
          description: "the webhook URL for the kind (at most 256 bytes for slack and discord); never returned"
        events:
          type: [array, "null"]
          description: "absent or null: both choices; an empty list is allowed and posts nothing"
          items: { type: string, enum: [assigned, my_issues] }
        enabled: { type: [boolean, "null"], description: "absent or null: on" }
    PersonalWebhookPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: [string, "null"], minLength: 1, maxLength: 40 }
        webhookUrl:
          type: [string, "null"]
          writeOnly: true
          maxLength: 1024
          description: "replaces the stored URL; absent or null keeps it; never returned"
        events:
          type: [array, "null"]
          description: "the whole list when present; absent or null keeps it; an empty list posts nothing"
          items: { type: string, enum: [assigned, my_issues] }
        enabled: { type: [boolean, "null"] }
    PushRelay:
      type: object
      required: [available, configured, host, lastOkAt, lastError, secretUnreadable, updatedAt, deviceCount, rateCappedCount, deadCount]
      properties:
        available: { type: boolean, description: "this server can store a relay (SETTINGS_ENCRYPTION_KEY is set)" }
        configured: { type: boolean }
        host: { type: [string, "null"], description: "the relay's host name when configured, else null; never the rest of the URL" }
        lastOkAt: { type: [string, "null"], format: date-time }
        lastError:
          type: [string, "null"]
          enum: [push_rejected, push_unauthorized, push_rate_limited, push_unavailable, push_unreachable, push_blocked, push_redirect, push_unreadable, null]
        secretUnreadable: { type: boolean }
        updatedAt: { type: [string, "null"], format: date-time }
        deviceCount: { type: integer, format: int64, description: "devices registered in the org; a count only" }
        rateCappedCount: { type: integer, format: int64, description: "pushes the hourly cap (300 per org) dropped in the last 24 hours; a count only" }
        deadCount: { type: integer, format: int64, description: "pushes that ended dead and are not yet pruned; a count only" }
    PushRelayInput:
      type: object
      additionalProperties: false
      properties:
        relayUrl:
          type: [string, "null"]
          writeOnly: true
          maxLength: 512
          description: "https URL of the relay; absent or null keeps the stored one; never returned"
        relaySecret:
          type: [string, "null"]
          writeOnly: true
          maxLength: 512
          description: "the bearer secret the relay expects; absent or null keeps the stored one; never returned"
    PushTestResult:
      type: object
      required: [sent, removed]
      properties:
        sent: { type: integer }
        removed: { type: integer, description: "devices deleted because the relay said the token is invalid" }
    PushDeviceInput:
      type: object
      additionalProperties: false
      required: [platform, token]
      properties:
        platform: { type: string, enum: [ios, android] }
        token:
          type: string
          writeOnly: true
          maxLength: 4096
          description: "the APNs or FCM device token; printable ASCII; never returned"
        appVersion: { type: string, maxLength: 64 }
        label: { type: string, maxLength: 80, description: "a name the member sees, such as the phone model" }
    PushDevice:
      type: object
      required: [id, platform, label, appVersion, createdAt, lastSeenAt]
      properties:
        id: { type: string, format: uuid }
        platform: { type: string, enum: [ios, android] }
        label: { type: string }
        appVersion: { type: string }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
    PushDevices:
      type: object
      required: [relayConfigured, maxDevices, items]
      properties:
        relayConfigured: { type: boolean }
        maxDevices: { type: integer }
        items: { type: array, items: { $ref: "#/components/schemas/PushDevice" } }
    OnboardingSkipInput:
      type: object
      additionalProperties: false
      required: [step, skipped]
      properties:
        step: { $ref: "#/components/schemas/OnboardingStepId" }
        skipped: { type: boolean }
    OrgList:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Org" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }

    TeamRef:
      type: object
      required: [id, key, name]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
    Team:
      type: object
      required: [id, key, name, description, defaultStateId, reviewStateId, testingStateId, cyclesEnabled,
                 cycleLengthDays, cycleStartWeekday, cycleStartTime, cycleTimezone, cycleRollover, productIds, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, pattern: "^[A-Z][A-Z0-9]{0,9}$" }
        name: { type: string }
        description: { type: string }
        defaultStateId: { type: [string, "null"], format: uuid }
        reviewStateId: { type: [string, "null"], format: uuid, description: "the built-in target of an opened, ready or reopened merge or pull request (T5); a git workflow rule of the team replaces it (LAUN-244)" }
        testingStateId: { type: [string, "null"], format: uuid, description: "the built-in target of a merged merge or pull request (T5); a git workflow rule of the team replaces it (LAUN-244)" }
        cyclesEnabled: { type: boolean, description: "the cycle job creates and completes this team's cycles" }
        cycleLengthDays: { type: integer, minimum: 1, maximum: 56 }
        cycleStartWeekday: { type: integer, minimum: 0, maximum: 6, description: "0 = Sunday" }
        cycleStartTime: { type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$", description: "HH:MM, local time in cycleTimezone" }
        cycleTimezone: { type: string, examples: [Europe/London], description: "IANA zone the cadence is read in" }
        cycleRollover: { type: boolean, description: "open issues move to the next cycle when a cycle ends" }
        productIds:
          type: array
          items: { type: string, format: uuid }
          description: "the team's NON-archived products; an empty array when none (LAUN-62)"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UpdateTeamInput:
      type: object
      additionalProperties: false
      description: "absent = unchanged; no field may be null"
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string }
        cyclesEnabled: { type: boolean }
        cycleLengthDays: { type: integer, minimum: 1, maximum: 56 }
        cycleStartWeekday: { type: integer, minimum: 0, maximum: 6 }
        cycleStartTime: { type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$" }
        cycleTimezone: { type: string, description: "an IANA zone; `Local` is refused" }
        cycleRollover: { type: boolean }
    TeamInput:
      type: object
      additionalProperties: false
      required: [key, name]
      properties:
        key: { type: string, pattern: "^[A-Z][A-Z0-9]{0,9}$" }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string }
    TeamList:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Team" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }

    Product:
      type: object
      required: [id, slug, name, description, icon, color, version, teamKeys, createdAt, updatedAt, archivedAt]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, minLength: 1, maxLength: 40, pattern: "^[a-z]([a-z0-9]|-[a-z0-9])*$", description: "the product's key in URLs; never the canonical UUID form" }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string }
        icon: { type: [string, "null"], maxLength: 8 }
        color: { type: [string, "null"], pattern: "^#[0-9a-fA-F]{6}$" }
        version: { type: integer, format: int32 }
        teamKeys: { type: array, items: { type: string }, description: "keys of the NON-archived teams the caller can see, in key order (decisions-T20 #69)" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        archivedAt: { type: [string, "null"], format: date-time }
    ProductDetail:
      type: object
      required: [id, slug, name, description, icon, color, version, teamKeys, createdAt, updatedAt, archivedAt, teams]
      description: "A product with its NON-archived teams the caller can see (decisions-T20 #69)"
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, minLength: 1, maxLength: 40, pattern: "^[a-z]([a-z0-9]|-[a-z0-9])*$" }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string }
        icon: { type: [string, "null"], maxLength: 8 }
        color: { type: [string, "null"], pattern: "^#[0-9a-fA-F]{6}$" }
        version: { type: integer, format: int32 }
        teamKeys: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        archivedAt: { type: [string, "null"], format: date-time }
        teams: { type: array, items: { $ref: "#/components/schemas/Team" } }
    ProductList:
      type: object
      required: [items, nextCursor]
      description: "The whole list (at most 200 products per org); nextCursor is always null"
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Product" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }
    CreateProductInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        slug: { type: string, description: "derived from the name when absent; 400 when none can be derived (send one)" }
        description: { type: string }
        icon: { type: string, maxLength: 8 }
        color: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        teams: { type: array, items: { type: string }, description: "team keys or ids; a team that is archived or of another org is 400" }
    UpdateProductInput:
      type: object
      additionalProperties: false
      description: "absent = unchanged; icon and color may be null. A stale `version` is 409 version_conflict. An archived product accepts only `archived: false` (and `version`); any other field is 409 conflict."
      properties:
        version: { type: integer, format: int32 }
        name: { type: string, minLength: 1, maxLength: 200 }
        slug: { type: string }
        description: { type: string }
        icon: { type: [string, "null"], maxLength: 8 }
        color: { type: [string, "null"], pattern: "^#[0-9a-fA-F]{6}$" }
        archived: { type: boolean, description: "true archives, false restores" }
    SetProductTeamsInput:
      type: object
      additionalProperties: false
      required: [teams]
      properties:
        teams: { type: array, items: { type: string }, description: "team keys or ids of the NON-archived members; archived members are kept" }

    StateType:
      type: string
      enum: [triage, backlog, unstarted, started, completed, canceled]
    StateRef:
      type: object
      required: [id, name, type, color]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { $ref: "#/components/schemas/StateType" }
        color: { type: string }
    WorkflowState:
      type: object
      required: [id, name, type, color, description, position, teamId]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { $ref: "#/components/schemas/StateType" }
        color: { type: string }
        description: { type: string }
        position: { type: number }
        teamId: { type: string, format: uuid }
    GitWorkflowEvent:
      type: string
      enum: [opened, ready, reopened, merged, closed]
      description: |
        opened: a request opened (not a draft); ready: a draft marked ready;
        reopened: a closed request opened again (not a draft); merged: merged;
        closed: closed without a merge. A draft that opens or reopens never
        moves an issue.
    GitWorkflowRule:
      type: object
      required: [event, custom, stateId, fromStateIds, problem]
      properties:
        event: { $ref: "#/components/schemas/GitWorkflowEvent" }
        custom: { type: boolean, description: "false: the built-in move" }
        stateId: { type: [string, "null"], format: uuid, description: "the target state; null: no move" }
        fromStateIds:
          type: array
          items: { type: string, format: uuid }
          description: "empty: forward only; else the issue moves only from one of these states"
        problem:
          type: [string, "null"]
          enum: [state_archived, from_state_archived, null]
          description: "state_archived: the target state is archived and the rule moves nothing; from_state_archived: an only-from state is archived (a PUT must leave it out)"
    GitWorkflow:
      type: object
      required: [teamId, rules]
      properties:
        teamId: { type: string, format: uuid }
        rules: { type: array, items: { $ref: "#/components/schemas/GitWorkflowRule" } }
    GitWorkflowRuleInput:
      type: object
      additionalProperties: false
      required: [event, stateId]
      properties:
        event: { $ref: "#/components/schemas/GitWorkflowEvent" }
        stateId: { type: [string, "null"], format: uuid, description: "required key: a state of this team that is not archived, or null for no move; a rule without the key is 400 validation_failed" }
        fromStateIds:
          type: array
          maxItems: 50
          items: { type: string, format: uuid }
          description: "states of this team; empty or absent: forward only; must be empty when stateId is null"
    GitWorkflowInput:
      type: object
      additionalProperties: false
      required: [rules]
      properties:
        rules:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/GitWorkflowRuleInput" }
          description: "the whole set of custom rules, each event at most once; empty: every event uses the built-in move"
    WorkflowStateList:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/WorkflowState" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }

    LabelRef:
      type: object
      required: [id, name, color]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string }
    Label:
      type: object
      required: [id, name, color, description, parentId, teamId, teamKey, issueCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        description: { type: string }
        parentId: { type: [string, "null"], format: uuid }
        teamId: { type: [string, "null"], format: uuid, description: "The team of a team label; null for an org-wide label." }
        teamKey: { type: [string, "null"], description: "The key of that team; null for an org-wide label." }
        issueCount: { type: integer, minimum: 0, description: "Non-archived issues that carry the label (closed ones count). 0 on a label just made." }
        createdAt: { type: string, format: date-time }
    LabelInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, description: "unique ignoring case among the org labels, or among one team's labels; a team label may share a name with an org label; no commas" }
        color: { type: string, pattern: "^#[0-9a-fA-F]{6}$", default: "#95a2b3" }
        description: { type: string }
        team: { type: string, description: "A team key or id: makes a team label. Omit for an org-wide label. An unknown team is 400. A team label goes only on issues of its team." }
    LabelList:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Label" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }

    IssueRef:
      type: object
      required: [id, identifier, title]
      properties:
        id: { type: string, format: uuid }
        identifier: { type: string, examples: [ORB-123] }
        title: { type: string }
        stateName: { type: string }
        stateType: { $ref: "#/components/schemas/StateType" }
    Priority:
      type: integer
      minimum: 0
      maximum: 4
      description: "0 none, 1 urgent, 2 high, 3 medium, 4 low"
    Issue:
      type: object
      required: [id, identifier, number, title, description, descriptionTruncated, priority, priorityLabel, estimate,
                 team, state, assignee, creator, labels, parent, projectId, milestoneId, cycleId, dueDate,
                 sortOrder, gitBranchName, version, createdAt, updatedAt, startedAt, completedAt, canceledAt, archivedAt]
      properties:
        id: { type: string, format: uuid }
        identifier: { type: string, description: "team key + '-' + number; computed on read" }
        number: { type: integer }
        title: { type: string }
        description: { type: string, description: "markdown; cut to 400 characters in lists unless full=true" }
        descriptionTruncated: { type: boolean }
        priority: { $ref: "#/components/schemas/Priority" }
        priorityLabel: { type: string, enum: [No priority, Urgent, High, Medium, Low] }
        estimate: { type: [integer, "null"] }
        team: { $ref: "#/components/schemas/TeamRef" }
        state: { $ref: "#/components/schemas/StateRef" }
        assignee: { oneOf: [{ $ref: "#/components/schemas/UserRef" }, { type: "null" }] }
        creator: { oneOf: [{ $ref: "#/components/schemas/UserRef" }, { type: "null" }] }
        labels: { type: array, items: { $ref: "#/components/schemas/LabelRef" } }
        parent: { oneOf: [{ $ref: "#/components/schemas/IssueRef" }, { type: "null" }] }
        projectId: { type: [string, "null"], format: uuid }
        milestoneId: { type: [string, "null"], format: uuid }
        cycleId: { type: [string, "null"], format: uuid }
        dueDate: { type: [string, "null"], format: date }
        sortOrder:
          type: number
          description: "manual order rank inside the issue's column (team + state); smaller is higher. Do the maths on the server: send placeAfter / placeBefore. A rank can change without `version` or `updatedAt` changing (a rebalance of the column)"
        rebalanced: { type: boolean, description: "only on a PATCH response, and only when true: the placement renumbered the destination column, so refetch it" }
        gitBranchName:
          type: string
          description: "{username}/{team-key}-{number}-{slug(title, 40)}; username is the assignee's, or the caller's when unassigned"
          examples: [chen/orb-12-fix-the-login-bug]
        version: { type: integer, description: "send back as `version` on PATCH for compare-and-swap" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        startedAt: { type: [string, "null"], format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        canceledAt: { type: [string, "null"], format: date-time }
        archivedAt: { type: [string, "null"], format: date-time }
        relations: { $ref: "#/components/schemas/Relations", description: "only with include=relations" }
        stateHistory: { type: array, items: { $ref: "#/components/schemas/StateChange" }, description: "only with include=stateHistory" }
        comments: { type: array, items: { $ref: "#/components/schemas/Comment" }, description: "only with include=comments" }
        attachments: { type: array, items: { $ref: "#/components/schemas/Attachment" }, description: "only with include=attachments" }
        changeRequests: { type: array, items: { $ref: "#/components/schemas/ChangeRequest" }, description: "only with include=changeRequests, and only when the issue has a linked merge or pull request" }
    ChangeRequest:
      type: object
      description: |
        A merge or pull request linked to an issue (LAUN-83). `title`,
        `author` and `repoPath` are text from the git host, named by
        `provider`: show them as plain text, never as HTML or Markdown.
      required: [id, integrationId, provider, repoPath, number, url, title, author, authorUser, state, changesRequested, checks, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        integrationId: { type: string, format: uuid, description: "LAUN-239: the git connection the request came through (Settings > Integrations > this id, admin scope). An id only." }
        provider: { type: string, enum: [gitlab, github, bitbucket] }
        repoPath: { type: string, description: "the repository label when the last event came; empty for a link made before LAUN-83 until its next event" }
        number: { type: integer, format: int64, description: "the MR iid or the PR number" }
        url: { type: string }
        title: { type: string }
        author: { type: string, description: "the host login; empty when unknown" }
        authorUser:
          oneOf: [{ $ref: "#/components/schemas/UserRef" }, { type: "null" }]
          description: "LAUN-199: the member who linked this login on this connection (Settings > Connected accounts); null when nobody did. A claim, shown for attribution only."
        state:
          type: string
          enum: [draft, open, approved, merged, closed]
          description: "computed: merged and closed from the link; draft from the draft flag; approved when the review is approved and the request is open; else open"
        changesRequested: { type: boolean, description: "an open or draft request whose reviewer asked for changes (shown as open with a flag)" }
        checks: { type: [string, "null"], enum: [pending, success, failure, null], description: "null until a check event has come; then the worst of the link's checks for its head sha (failure over pending over success), reset to null by a new head sha" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    IssueList:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Issue" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }
    CreateIssueInput:
      type: object
      additionalProperties: false
      required: [team, title]
      properties:
        team: { type: string, description: "team key, id, or the Linear id of an imported team" }
        title: { type: string, minLength: 1, maxLength: 500 }
        description: { type: string, maxLength: 200000 }
        state: { type: string, description: "state name or id; default: the team's default state (Backlog)" }
        priority: { $ref: "#/components/schemas/Priority" }
        estimate: { type: integer, minimum: 0, maximum: 1000 }
        assignee: { type: string, description: "username or `me`" }
        labels: { type: array, maxItems: 50, items: { type: string }, description: "label names or ids" }
        parent: { type: string, description: "identifier or id" }
        projectId: { type: string, format: uuid, description: "a project of this org" }
        milestoneId: { type: string, format: uuid, description: "a milestone of projectId" }
        cycleId: { type: string, format: uuid, description: "a cycle of the issue's team (its id, or the Linear id of an imported cycle)" }
        dueDate: { type: string, format: date }
    UpdateIssueInput:
      type: object
      additionalProperties: false
      description: "absent = unchanged; null clears a nullable field"
      properties:
        version: { type: integer, description: "compare-and-swap: 409 version_conflict when stale" }
        title: { type: string, minLength: 1, maxLength: 500 }
        description: { type: [string, "null"], maxLength: 200000 }
        state: { type: string, description: "state name or id in the issue's team" }
        priority: { $ref: "#/components/schemas/Priority" }
        estimate: { type: [integer, "null"], minimum: 0, maximum: 1000 }
        assignee: { type: [string, "null"], description: "username or `me`; null unassigns" }
        labels: { type: [array, "null"], items: { type: string }, description: "replaces the set; not with addLabels/removeLabels" }
        addLabels: { type: array, items: { type: string } }
        removeLabels: { type: array, items: { type: string } }
        parent: { type: [string, "null"], description: "identifier or id; a cycle is refused" }
        projectId: { type: [string, "null"], format: uuid, description: "a project of this org" }
        milestoneId: { type: [string, "null"], format: uuid, description: "a milestone of the issue's project (set projectId too)" }
        cycleId: { type: [string, "null"], format: uuid, description: "a cycle of the issue's team (its id, or the Linear id of an imported cycle)" }
        dueDate: { type: [string, "null"], format: date }
        sortOrder: { type: number, description: "set the rank directly (|v| <= 1e12); prefer placeAfter / placeBefore. Not with them" }
        placeAfter: { type: string, description: "issue id or identifier; place below it in the destination column" }
        placeBefore: { type: string, description: "issue id or identifier; place above it in the destination column" }

    StateChange:
      type: object
      required: [id, fromStateId, fromStateName, toStateId, toStateName, actor, source, createdAt]
      properties:
        id: { type: string, format: uuid }
        fromStateId: { type: [string, "null"], format: uuid, description: "null for the row written at creation" }
        fromStateName: { type: [string, "null"] }
        toStateId: { type: string, format: uuid }
        toStateName: { type: string }
        actor: { oneOf: [{ $ref: "#/components/schemas/UserRef" }, { type: "null" }] }
        source: { type: string, enum: [api, gitlab, github, bitbucket, import, system] }
        createdAt: { type: string, format: date-time }

    Comment:
      type: object
      description: "a comment on an issue or on a document: exactly one of issueId and documentId is set"
      required: [id, issueId, documentId, parentId, body, author, createdAt, updatedAt, editedAt]
      properties:
        id: { type: string, format: uuid }
        issueId: { type: [string, "null"], format: uuid }
        documentId: { type: [string, "null"], format: uuid }
        parentId: { type: [string, "null"], format: uuid }
        body: { type: string, description: markdown }
        author: { oneOf: [{ $ref: "#/components/schemas/UserRef" }, { type: "null" }] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        editedAt: { type: [string, "null"], format: date-time }
    CommentInput:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 100000 }
        parentId: { type: string, format: uuid, description: "reply to a comment on the same issue or document" }
    CommentList:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Comment" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }

    ActivityKind:
      type: string
      enum: [title, description, assignee, priority, estimate, dueDate, parent, project, milestone, cycle, labelAdded, labelRemoved, relationRemoved, mrLinked, mrMerged, mrClosed]
    Activity:
      type: object
      description: |
        One recorded change. from and to are snapshots made at write time:
        null, a plain value (title text, priority number, estimate number,
        dueDate YYYY-MM-DD), or an object ({id, name}; assignee has
        {id, username, name}; cycle {id, number, name}; parent {id,
        identifier, title}; relationRemoved from {type, issue}). A
        description edit has neither. labelAdded has only to, labelRemoved
        only from. mrLinked, mrMerged and mrClosed (LAUN-83) have only to:
        {provider, repoPath, number, url, title}, the request as it was when
        the change happened; `source` is the provider and `actor` is null.
        `title` and `repoPath` are text from the git host: show them as plain text.
      required: [id, kind, actor, source, from, to, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ActivityKind" }
        actor: { oneOf: [{ $ref: "#/components/schemas/UserRef" }, { type: "null" }], description: "null for the cycle job" }
        source: { type: string, enum: [api, gitlab, github, bitbucket, import, system] }
        from: {}
        to: {}
        createdAt: { type: string, format: date-time }
    ActivityList:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Activity" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }

    NotificationEvent:
      type: string
      enum: [assigned, mention, comment, state_change, new_issue, project_update_due]
      description: "project_update_due (LAUN-196) is the reminder to a project lead; it has no team level (teams is empty and a team PUT with it is a 400)"
    NotificationValue:
      type: string
      enum: ["on", "off"]
    NotificationSource:
      type: string
      enum: [team, global, default]
      description: where a resolved value comes from
    NotificationDefault:
      type: object
      required: [email, inbox, push]
      properties:
        email: { $ref: "#/components/schemas/NotificationValue" }
        inbox: { $ref: "#/components/schemas/NotificationValue" }
        push: { $ref: "#/components/schemas/NotificationValue" }
    NotificationOverride:
      type: object
      description: stored values; null means inherit
      required: [email, inbox, push]
      properties:
        email: { oneOf: [{ $ref: "#/components/schemas/NotificationValue" }, { type: "null" }] }
        inbox: { oneOf: [{ $ref: "#/components/schemas/NotificationValue" }, { type: "null" }] }
        push: { oneOf: [{ $ref: "#/components/schemas/NotificationValue" }, { type: "null" }] }
    NotificationResolvedChannel:
      type: object
      required: [value, source]
      properties:
        value: { $ref: "#/components/schemas/NotificationValue" }
        source: { $ref: "#/components/schemas/NotificationSource" }
    NotificationResolved:
      type: object
      required: [email, inbox, push]
      properties:
        email: { $ref: "#/components/schemas/NotificationResolvedChannel" }
        inbox: { $ref: "#/components/schemas/NotificationResolvedChannel" }
        push: { $ref: "#/components/schemas/NotificationResolvedChannel" }
    NotificationTeamEvent:
      type: object
      required: [teamId, teamKey, override, resolved]
      properties:
        teamId: { type: string, format: uuid }
        teamKey: { type: string }
        override: { $ref: "#/components/schemas/NotificationOverride" }
        resolved: { $ref: "#/components/schemas/NotificationResolved" }
    NotificationEventSettings:
      type: object
      required: [event, default, global, resolved, requiresFollow, teams]
      properties:
        event: { $ref: "#/components/schemas/NotificationEvent" }
        default: { $ref: "#/components/schemas/NotificationDefault" }
        global: { $ref: "#/components/schemas/NotificationOverride" }
        resolved: { $ref: "#/components/schemas/NotificationResolved" }
        requiresFollow:
          type: boolean
          description: true when the event applies only to followed teams (new_issue)
        teams: { type: array, items: { $ref: "#/components/schemas/NotificationTeamEvent" } }
    NotificationMail:
      type: object
      required: [available]
      properties:
        available: { type: boolean, description: "false when this install has no mail transport" }
    NotificationPush:
      type: object
      required: [available, hasDevice]
      properties:
        hasDevice: { type: boolean, description: "true when the caller has at least one registered mobile device in this org; the Push radios show only when available and hasDevice are both true" }
        available: { type: boolean, description: "true when the org has a push relay (LAUN-197); false: the page shows no Push column and no push is made" }
    NotificationSettings:
      type: object
      required: [emailEnabled, includeExcerpt, mail, push, follows, events]
      properties:
        emailEnabled: { type: boolean, description: "master email switch; false wins over every event" }
        includeExcerpt: { type: boolean }
        mail: { $ref: "#/components/schemas/NotificationMail" }
        push: { $ref: "#/components/schemas/NotificationPush" }
        follows: { type: array, items: { type: string, format: uuid }, description: followed team ids }
        events: { type: array, items: { $ref: "#/components/schemas/NotificationEventSettings" } }
    NotificationEventInput:
      type: object
      description: |
        An absent column is left as it is; null clears it (inherit). A key
        other than email, inbox and push is `400 validation_failed`. `push` is off by
        default and does nothing until the org has a push relay (LAUN-197).
      properties:
        email: { oneOf: [{ $ref: "#/components/schemas/NotificationValue" }, { type: "null" }] }
        inbox: { oneOf: [{ $ref: "#/components/schemas/NotificationValue" }, { type: "null" }] }
        push: { oneOf: [{ $ref: "#/components/schemas/NotificationValue" }, { type: "null" }] }
      additionalProperties: false
    GitAccount:
      type: object
      description: "LAUN-199: one git connection with the caller's handle on it (a claim, display only)."
      required: [integrationId, provider, name, host, enabled, handle, linkedAt]
      properties:
        integrationId: { type: string, format: uuid }
        provider: { type: string, enum: [gitlab, github, bitbucket] }
        name: { type: string }
        host: { type: string }
        enabled: { type: boolean }
        handle: { type: [string, "null"] }
        linkedAt: { type: [string, "null"], format: date-time }
    GitAccounts:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/GitAccount" } }
    GitAccountInput:
      type: object
      additionalProperties: false
      required: [handle]
      properties:
        handle: { type: string, minLength: 1, maxLength: 101, description: "the login on the host; one leading @ is dropped" }
    GitIdentity:
      type: object
      required: [id, integrationId, provider, integrationName, handle, user, updatedAt]
      properties:
        id: { type: string, format: uuid }
        integrationId: { type: string, format: uuid }
        provider: { type: string, enum: [gitlab, github, bitbucket] }
        integrationName: { type: string }
        handle: { type: string }
        user: { $ref: "#/components/schemas/UserRef" }
        updatedAt: { type: string, format: date-time }
    GitIdentities:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/GitIdentity" } }
    ViewPreference:
      type: object
      required: [place, view, sort, hideEmpty, hiddenColumns, groupBy, at]
      properties:
        place: { type: string }
        view: { type: string, enum: [list, board] }
        sort: { type: string, enum: [updated, created, priority, manual] }
        hideEmpty: { type: boolean, description: "LAUN-163: the board hides columns with no cards (default false)" }
        hiddenColumns:
          type: array
          maxItems: 30
          items: { type: string, minLength: 1, maxLength: 100 }
          description: "LAUN-163: state names whose board columns are hidden (default none). LAUN-171: for another groupBy the entry is `<groupBy>:<column key>`."
        groupBy: { $ref: "#/components/schemas/ViewGroupBy" }
        at: { type: integer, format: int64, description: epoch milliseconds of the choice }
      additionalProperties: false
    ViewPreferenceInput:
      type: object
      required: [view, sort, at]
      properties:
        view: { type: string, enum: [list, board] }
        sort: { type: string, enum: [updated, created, priority, manual] }
        hideEmpty: { type: boolean, description: "LAUN-163. Absent means false: a PUT replaces the whole row." }
        hiddenColumns:
          type: array
          maxItems: 30
          items: { type: string, minLength: 1, maxLength: 100 }
          description: "LAUN-163. Absent means none. Duplicates are dropped; control characters and commas are refused."
        groupBy: { $ref: "#/components/schemas/ViewGroupBy" }
        at: { type: integer, format: int64, minimum: 0 }
      additionalProperties: false
    UiTheme:
      type: string
      enum: [linear, paper, terminal]
      description: "LAUN-235: the look of the web app. `linear` is the default."
    UserPreferences:
      type: object
      required: [theme]
      properties:
        theme: { $ref: "#/components/schemas/UiTheme" }
      additionalProperties: false
    UserPreferencesInput:
      type: object
      required: [theme]
      properties:
        theme: { $ref: "#/components/schemas/UiTheme" }
      additionalProperties: false
    ViewGroupBy:
      type: string
      enum: [state, assignee, priority, label, project]
      description: "LAUN-171: what the board groups its columns by. Absent in a PUT means `state`."
    ViewPreferenceList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ViewPreference" } }
      additionalProperties: false
    NotificationSettingsInput:
      type: object
      properties:
        emailEnabled: { type: [boolean, "null"], description: "null resets to true" }
        includeExcerpt: { type: [boolean, "null"], description: "null resets to false" }
        events:
          type: object
          description: keyed by event name
          propertyNames: { $ref: "#/components/schemas/NotificationEvent" }
          additionalProperties: { $ref: "#/components/schemas/NotificationEventInput" }
      additionalProperties: false
    NotificationTeamSettingsInput:
      type: object
      properties:
        events:
          type: object
          description: keyed by event name
          propertyNames: { $ref: "#/components/schemas/NotificationEvent" }
          additionalProperties: { $ref: "#/components/schemas/NotificationEventInput" }
      additionalProperties: false
    IssueSubscription:
      type: object
      required: [state, reasons]
      properties:
        state: { type: string, enum: [subscribed, muted, default] }
        reasons:
          type: array
          items: { type: string, enum: [creator, assignee, commenter, manual, mentioned] }
    IssueSubscriptionInput:
      type: object
      required: [subscribed]
      properties:
        subscribed: { type: boolean }
      additionalProperties: false

    InboxNotification:
      type: object
      required: [id, kind, createdAt, readAt, archivedAt, actor, issue, project, data]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [assigned, state_change, comment, mention, new_issue, project_update_due] }
        createdAt: { type: string, format: date-time }
        readAt: { type: [string, "null"], format: date-time }
        archivedAt: { type: [string, "null"], format: date-time }
        actor:
          oneOf: [{ $ref: "#/components/schemas/InboxActor" }, { type: "null" }]
          description: null for a GitLab or system move, or a removed user
        issue:
          oneOf: [{ $ref: "#/components/schemas/InboxIssue" }, { type: "null" }]
          description: null for a project_update_due notification
        project:
          oneOf: [{ $ref: "#/components/schemas/InboxProject" }, { type: "null" }]
          description: set only for a project_update_due notification
        data: { $ref: "#/components/schemas/InboxData" }
    InboxActor:
      type: object
      required: [id, username, name]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        name: { type: string }
    InboxIssue:
      type: object
      description: The issue as it is now (title and state are read when the row is shown).
      required: [id, identifier, title, teamKey, stateName]
      properties:
        id: { type: string, format: uuid }
        identifier: { type: string, examples: [ORB-123] }
        title: { type: string }
        teamKey: { type: string }
        stateName: { type: string }
    InboxProject:
      type: object
      description: The project a reminder is about, as it is now.
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    InboxData:
      type: object
      description: What the cause adds. Never the text of a comment or a description.
      properties:
        commentId: { type: string, format: uuid, description: a comment or a mention in a comment }
        fromStateName: { type: string, description: a state change }
        toStateName: { type: string, description: a state change }
    InboxNotificationList:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/InboxNotification" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }
    NotificationUnreadCount:
      type: object
      required: [count]
      properties:
        count: { type: integer, format: int64, minimum: 0 }
    NotificationPatch:
      type: object
      description: At least one of the two.
      properties:
        read: { type: boolean }
        archived: { type: boolean }
      additionalProperties: false
    NotificationReadAllInput:
      type: object
      required: [before]
      properties:
        before: { type: string, format: date-time }
      additionalProperties: false
    NotificationReadAllResult:
      type: object
      required: [marked]
      properties:
        marked: { type: integer, format: int64, minimum: 0 }

    RelationType:
      type: string
      enum: [blocks, blockedBy, related, duplicateOf, duplicates]
      description: "blockedBy and duplicates are the reverse reads of blocks and duplicateOf"
    Relation:
      type: object
      required: [id, type, issue, createdAt, createdBy]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/RelationType" }
        issue: { $ref: "#/components/schemas/IssueRef" }
        createdAt: { type: string, format: date-time }
        createdBy: { oneOf: [{ $ref: "#/components/schemas/UserRef" }, { type: "null" }], description: "null for an imported relation or a removed user" }
    Relations:
      type: object
      required: [blocks, blockedBy, related, duplicateOf, duplicates]
      properties:
        blocks: { type: array, items: { $ref: "#/components/schemas/Relation" } }
        blockedBy: { type: array, items: { $ref: "#/components/schemas/Relation" } }
        related: { type: array, items: { $ref: "#/components/schemas/Relation" } }
        duplicateOf: { type: array, items: { $ref: "#/components/schemas/Relation" } }
        duplicates: { type: array, items: { $ref: "#/components/schemas/Relation" } }
    RelationInput:
      type: object
      additionalProperties: false
      required: [type, issue]
      properties:
        type: { $ref: "#/components/schemas/RelationType" }
        issue: { type: string, description: "identifier or id of the other issue" }

    Attachment:
      type: object
      description: |
        A link (`url` set) or a file (`filename`, `contentType`, `sizeBytes`
        and `downloadUrl` set) on an issue. Markdown that shows a file must
        use `downloadUrl`, never a raw store URL.
      required: [id, issueId, kind, title, subtitle, url, filename, contentType, sizeBytes, downloadUrl, creator, createdAt]
      properties:
        id: { type: string, format: uuid }
        issueId: { type: string, format: uuid }
        kind: { type: string, enum: [link, file] }
        title: { type: string }
        subtitle: { type: string }
        url: { type: [string, "null"], description: "kind link only" }
        filename: { type: [string, "null"], description: "kind file only: the display name" }
        contentType: { type: [string, "null"], enum: [image/png, image/jpeg, image/gif, video/mp4, text/plain, application/pdf, null] }
        sizeBytes: { type: [integer, "null"], format: int64 }
        downloadUrl:
          type: [string, "null"]
          description: |
            kind file only. `GET` it (with the caller's auth) for a 302 to the
            file. Absolute on the server's PUBLIC_BASE_URL when that is set,
            otherwise a path from the API origin.
        creator: { oneOf: [{ $ref: "#/components/schemas/UserRef" }, { type: "null" }] }
        createdAt: { type: string, format: date-time }
    AttachmentList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }
          description: oldest first, at most 500
        nextCursor: { $ref: "#/components/schemas/NextCursor" }
    PrepareUploadInput:
      type: object
      additionalProperties: false
      required: [filename, contentType, sizeBytes]
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 255
          description: "display name; no control characters, '/' or '\\'. The object key uses a safe form of it ([A-Za-z0-9._-], at most 100 bytes)."
        contentType:
          type: string
          description: "one of the allowlist; parameters such as charset are dropped"
          examples: [image/png]
        sizeBytes: { type: integer, format: int64, minimum: 1, maximum: 104857600, description: "the exact size of the file to PUT (at most 100 MiB)" }
    PrepareAvatarInput:
      type: object
      additionalProperties: false
      required: [contentType, sizeBytes]
      properties:
        contentType: { type: string, enum: [image/png, image/jpeg, image/gif, image/webp] }
        sizeBytes: { type: integer, format: int64, minimum: 1, maximum: 2097152, description: "the exact size of the file to PUT (at most 2 MiB)" }
    SetAvatarInput:
      type: object
      additionalProperties: false
      required: [uploadKey]
      properties:
        uploadKey: { type: string, description: "from the avatar prepare answer; `org/{org_id}/avatars/org/{uuid}` or `org/{org_id}/avatars/project/{project_id}/{uuid}`" }
    PreparedUpload:
      type: object
      required: [uploadKey, uploadUrl, method, headers, contentType, sizeBytes, expiresAt]
      properties:
        uploadKey:
          type: string
          description: "`org/{org_id}/{yyyy}/{attachment_id}/{filename}`; send it to createAttachment after the PUT"
        uploadUrl: { type: string, description: "presigned PUT to the object store; a credential until expiresAt. Never log it." }
        method: { type: string, enum: [PUT] }
        headers:
          type: object
          additionalProperties: { type: string }
          description: "send exactly these request headers with the PUT (Content-Type)"
        contentType: { type: string, description: "the normalized type that was signed" }
        sizeBytes: { type: integer, format: int64, description: "the body must be exactly this many bytes; the store refuses any other size" }
        expiresAt: { type: string, format: date-time, description: "15 minutes after prepare" }
    CreateAttachmentInput:
      type: object
      additionalProperties: false
      required: [kind]
      description: |
        `kind: file` takes `uploadKey` (required), `filename`, `title`,
        `subtitle`. `kind: link` takes `url` (required), `title`,
        `subtitle`. A field of the other kind is a 400.
      properties:
        kind: { type: string, enum: [file, link] }
        uploadKey: { type: string, description: "from attachments/prepare" }
        filename: { type: string, minLength: 1, maxLength: 255, description: "display name; default: the filename in uploadKey" }
        url: { type: string, maxLength: 2048, description: "absolute http(s) URL, no user info" }
        title: { type: string, maxLength: 255, description: "default: the filename (file) or the url (link)" }
        subtitle: { type: string, maxLength: 255 }

    Event:
      type: object
      required: [seq, type, entityType, entityId, actor, payload, createdAt]
      properties:
        seq: { type: integer, format: int64 }
        type:
          type: string
          enum: [issue.created, issue.updated, issue.deleted, comment.created, comment.updated, comment.deleted,
                 relation.created, relation.deleted, label.created, team.created, team.updated,
                 project.created, project.updated, project.deleted, team.deleted, cycle.deleted, milestone.created, milestone.updated, project_update.created, project.update_due,
                 project_status.created, project_status.updated, project_status.deleted, project_status.reordered,
                 document.created, document.updated, cycle.created, cycle.updated, cycle.completed,
                 attachment.created, product.created, product.updated, product.deleted, product.teams_changed,
                 project_label.created, project_label.updated, project_label.deleted,
                 org.updated, onboarding.step_changed, agent_guidance.updated, slack.updated, chat_service.updated, push.updated, git_identity.removed,
                 member.access_changed]
          description: "project_status.* have entityType project_status (a reorder has the first id of the new order as entityId and the full order in the payload). org.updated, onboarding.step_changed, agent_guidance.updated, git_identity.removed (LAUN-199; payload userId and integrationId, never the handle) slack.updated (LAUN-198; legacy, no route emits it since LAUN-204, old feed rows keep it), chat_service.updated (LAUN-204; payload action, serviceId, kind, enabled and the event kinds, never the name, host or webhook URL) and push.updated (LAUN-197; payload configured only, never the relay URL or secret) have entityType org and the org id as entityId. member.access_changed (LAUN-225, decisions-T20 #48) has entityType member and the member's user id as entityId; only org admins read it; its payload holds ids and counts only (userId, teamAccess, teamIds, addedTeamIds, lostTeamIds, unassigned). product.updated is also archive and restore; product.teams_changed is a later change of the team set (a create with teams emits product.created only). cycle.created and cycle.completed come from the cycle job and have no actor (a Mark complete has the actor and payload reason manual; cycle.deleted has the actor); project.update_due comes from the update reminder job (LAUN-196), has no actor and holds ids and the due time only; so does the issue.updated of a rollover (payload reason: rollover) and the issue.updated and attachment.created of a GitLab webhook (payload source: gitlab)"
        entityType: { type: string, enum: [issue, comment, relation, label, team, project, project_update, project_label, milestone, document, cycle, attachment, product, org, project_status, member] }
        entityId: { type: string, format: uuid }
        actor: { oneOf: [{ $ref: "#/components/schemas/UserRef" }, { type: "null" }] }
        payload:
          type: object
          description: "small; ids, identifier, and for issue.updated the changed field names (and fromStateId/toStateId). Refetch for full data."
        createdAt: { type: string, format: date-time }
    EventList:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Event" } }
        nextCursor:
          type: [string, "null"]
          description: "the last seq when the page is full; pass it back as `after`"

    ProjectState:
      type: string
      enum: [backlog, planned, started, paused, completed, canceled]
    ProjectStatusRef:
      type: object
      description: "A project's status (LAUN-195). `kind` equals the project's `state`."
      required: [id, kind, name, color]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ProjectState" }
        name: { type: string }
        color: { type: string, description: "#rrggbb" }
    ProjectStatus:
      type: object
      required: [id, kind, name, color, position, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ProjectState" }
        name: { type: string, minLength: 1, maxLength: 50 }
        color: { type: string, description: "#rrggbb" }
        position: { type: integer, description: "place in the org's order, from 0" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProjectStatusList:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ProjectStatus" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }
    CreateProjectStatusInput:
      type: object
      additionalProperties: false
      required: [kind, name, color]
      properties:
        kind: { $ref: "#/components/schemas/ProjectState" }
        name: { type: string, minLength: 1, maxLength: 50 }
        color: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
    UpdateProjectStatusInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        color: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
    ReorderProjectStatusesInput:
      type: object
      additionalProperties: false
      required: [ids]
      properties:
        ids: { type: array, items: { type: string, format: uuid } }
    Project:
      type: object
      required: [id, name, description, content, contentTruncated, state, status, lead, startDate, targetDate, teams, labels,
                 version, createdAt, updatedAt, startedAt, completedAt, canceledAt, archivedAt, updateSchedule, avatarUrl, emoji, issueCounts]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        content: { type: string, description: "markdown; cut to 400 characters in lists unless full=true" }
        contentTruncated: { type: boolean }
        state: { $ref: "#/components/schemas/ProjectState" }
        status: { $ref: "#/components/schemas/ProjectStatusRef" }
        lead: { oneOf: [{ $ref: "#/components/schemas/UserRef" }, { type: "null" }] }
        startDate: { type: [string, "null"], format: date }
        targetDate: { type: [string, "null"], format: date }
        teams: { type: array, items: { $ref: "#/components/schemas/TeamRef" }, description: "the project's teams the caller can see (decisions-T20 #37)" }
        labels: { type: array, items: { $ref: "#/components/schemas/ProjectLabelRef" }, description: "project labels on the project, by name (LAUN-194)" }
        version: { type: integer, description: "send back as `version` on PATCH for compare-and-swap" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        startedAt: { type: [string, "null"], format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        canceledAt: { type: [string, "null"], format: date-time }
        archivedAt: { type: [string, "null"], format: date-time }
        updateSchedule: { $ref: "#/components/schemas/ProjectUpdateSchedule" }
        avatarUrl: { type: [string, "null"], description: "the logo on the API (`GET .../projects/{project}/avatar?v=<version>`), or null (LAUN-22)" }
        emoji: { type: [string, "null"], description: "one emoji as the project icon, or null (LAUN-232). Show the logo first, then the emoji, then a letter tile" }
        issueCounts: { $ref: "#/components/schemas/ProjectIssueCounts" }
    ProjectUpdateSchedule:
      type: object
      description: "When the lead is reminded to post a project update (LAUN-196). Weekly: every `weekday` at `hour`; biweekly: every second week; monthly: the first `weekday` of the month. `hour` is in the org's time zone. With frequency none nothing is sent."
      required: [frequency, weekday, hour]
      properties:
        frequency: { type: string, enum: [none, weekly, biweekly, monthly] }
        weekday: { type: integer, minimum: 0, maximum: 6, description: "0 is Sunday" }
        hour: { type: integer, minimum: 0, maximum: 23 }
    UpdateProjectScheduleInput:
      type: object
      additionalProperties: false
      description: "absent fields keep their value; setting a schedule starts at the NEXT due time (no reminder for the past)"
      properties:
        frequency: { type: string, enum: [none, weekly, biweekly, monthly] }
        weekday: { type: integer, minimum: 0, maximum: 6 }
        hour: { type: integer, minimum: 0, maximum: 23 }
    ProjectIssueCounts:
      type: object
      description: "Live issue counts of a project (LAUN-170), by state type. Archived issues are not counted; sub-issues are. Only issues of teams the caller can see are counted (decisions-T20 #37). Progress is done / scope."
      required: [total, scope, done, started, canceled]
      properties:
        total: { type: integer, description: "every non-archived issue" }
        scope: { type: integer, description: "total minus canceled" }
        done: { type: integer, description: "issues in a completed state" }
        started: { type: integer, description: "issues in a started state" }
        canceled: { type: integer, description: "issues in a canceled state (out of scope)" }
    ProjectList:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Project" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }
    CreateProjectInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, maxLength: 200000 }
        content: { type: string, maxLength: 200000 }
        state: { type: string, description: "a project status name, or a kind (the first status of that kind); default planned. `statusId` wins." }
        statusId: { type: string, format: uuid, description: "a project status of this org (LAUN-195)" }
        lead: { type: string, description: "username or `me`; must be a member of the org" }
        startDate: { type: string, format: date }
        targetDate: { type: string, format: date, description: "not before startDate" }
        teams: { type: array, maxItems: 50, items: { type: string }, description: "team keys or ids of this org" }
        labelIds: { type: array, maxItems: 50, items: { type: string, format: uuid }, description: "project label ids of this org; an unknown or other-org id is 400 validation_failed" }
        emoji: { type: string, maxLength: 32, description: "one emoji as the icon (one emoji sequence, no control character); maxLength counts characters, the server limit is 32 BYTES of UTF-8; empty means none; anything else is 400 validation_failed (LAUN-232)" }
    UpdateProjectInput:
      type: object
      additionalProperties: false
      description: "absent = unchanged; null clears a nullable field"
      properties:
        version: { type: integer, description: "compare-and-swap: 409 version_conflict when stale" }
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: [string, "null"], maxLength: 200000 }
        content: { type: [string, "null"], maxLength: 200000 }
        state: { type: string, description: "a project status name, or a kind (the first status of that kind). `statusId` wins." }
        statusId: { type: string, format: uuid, description: "a project status of this org (LAUN-195)" }
        lead: { type: [string, "null"], description: "username or `me`; null clears" }
        startDate: { type: [string, "null"], format: date }
        targetDate: { type: [string, "null"], format: date }
        teams: { type: [array, "null"], items: { type: string }, description: "replaces the set" }
        updateSchedule: { $ref: "#/components/schemas/UpdateProjectScheduleInput" }
        labelIds: { type: [array, "null"], maxItems: 50, items: { type: string, format: uuid }, description: "replaces the set of project labels (LAUN-194); null or [] clears; an unknown or other-org id is 400. Emits project.updated with \"labels\" in changes" }
        emoji: { type: [string, "null"], maxLength: 32, description: "one emoji as the icon (one emoji sequence, no control character); maxLength counts characters, the server limit is 32 BYTES of UTF-8; empty or null clears; anything else is 400 validation_failed. Emits project.updated with \"emoji\" in changes (LAUN-232)" }

    ProjectLabelRef:
      type: object
      required: [id, name, color, parentId]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        parentId: { type: [string, "null"], format: uuid }
    ProjectLabel:
      type: object
      required: [id, name, color, parentId, projectCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        parentId: { type: [string, "null"], format: uuid, description: "the group the label is in; null for a top-level label or a group" }
        projectCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
    ProjectLabelInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, description: "unique ignoring case in the org (409 conflict)" }
        color: { type: string, pattern: "^#[0-9a-fA-F]{6}$", default: "#95a2b3" }
        parentId: { type: string, format: uuid, description: "a group of this org (400 if unknown, other-org, or itself in a group)" }
    UpdateProjectLabelInput:
      type: object
      additionalProperties: false
      description: "absent = unchanged; parentId null leaves the group"
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        color: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        parentId: { type: [string, "null"], format: uuid }
    ProjectLabelList:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ProjectLabel" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }
    ProjectUpdateHealth:
      type: string
      enum: [on_track, at_risk, off_track]
    ProjectUpdate:
      type: object
      required: [id, projectId, author, health, body, createdAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        author: { oneOf: [{ $ref: "#/components/schemas/UserRef" }, { type: "null" }] }
        health: { $ref: "#/components/schemas/ProjectUpdateHealth" }
        body: { type: string, maxLength: 50000 }
        createdAt: { type: string, format: date-time }
    ProjectUpdateList:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ProjectUpdate" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }
    CreateProjectUpdateInput:
      type: object
      additionalProperties: false
      required: [health]
      properties:
        health: { $ref: "#/components/schemas/ProjectUpdateHealth" }
        body: { type: string, maxLength: 50000, description: "text body, shown as plain text by the web app; agents may write markdown" }

    Milestone:
      type: object
      required: [id, projectId, name, description, targetDate, sortOrder, createdAt, updatedAt, archivedAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        targetDate: { type: [string, "null"], format: date }
        sortOrder: { type: number }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        archivedAt: { type: [string, "null"], format: date-time }
    MilestoneList:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Milestone" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }
    CreateMilestoneInput:
      type: object
      additionalProperties: false
      required: [projectId, name]
      properties:
        projectId: { type: string, format: uuid, description: "a project of this org" }
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, maxLength: 200000 }
        targetDate: { type: string, format: date }
        sortOrder: { type: number, default: 0 }
    UpdateMilestoneInput:
      type: object
      additionalProperties: false
      description: "absent = unchanged; null clears a nullable field"
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: [string, "null"], maxLength: 200000 }
        targetDate: { type: [string, "null"], format: date }
        sortOrder: { type: number }

    Cycle:
      type: object
      required: [id, team, number, name, description, startsAt, endsAt, completedAt, createdAt, updatedAt, archivedAt]
      properties:
        id: { type: string, format: uuid }
        team: { $ref: "#/components/schemas/TeamRef" }
        number: { type: integer, minimum: 1, description: "consecutive per team, with no gaps" }
        name: { type: [string, "null"] }
        description: { type: string }
        startsAt: { type: string, format: date-time, description: "a cadence boundary (weekday and time in the team zone)" }
        endsAt: { type: string, format: date-time, description: "the next cycle's startsAt" }
        completedAt: { type: [string, "null"], format: date-time, description: "set by the cycle job (to endsAt) once the cycle has ended, or by Mark complete (then endsAt is that time too)" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        archivedAt: { type: [string, "null"], format: date-time }
    CycleList:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Cycle" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }
    UpdateCycleInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: [string, "null"], minLength: 1, maxLength: 255 }
        description: { type: [string, "null"], maxLength: 200000 }
        startsAt: { type: string, description: "RFC 3339 time or YYYY-MM-DD team day; only before the cycle starts (decisions-T27 #4)" }
        endsAt: { type: string, description: "RFC 3339 time or YYYY-MM-DD team day; only for a cycle that has not ended" }
    CycleSnapshot:
      type: object
      description: |
        One day of a burn-up: the issues in the cycle (not archived) when the
        row was last written, counted by state type. scopeCount and
        scopePoints are every state type except canceled; points are the sum
        of estimates (none counts as 0).
      required: [cycleId, date, scopeCount, triageCount, backlogCount, unstartedCount, startedCount, completedCount,
                 canceledCount, scopePoints, startedPoints, completedPoints, updatedAt]
      properties:
        cycleId: { type: string, format: uuid }
        date: { type: string, format: date, description: "team-local date" }
        scopeCount: { type: integer }
        triageCount: { type: integer }
        backlogCount: { type: integer }
        unstartedCount: { type: integer }
        startedCount: { type: integer }
        completedCount: { type: integer }
        canceledCount: { type: integer }
        scopePoints: { type: integer, format: int64 }
        startedPoints: { type: integer, format: int64 }
        completedPoints: { type: integer, format: int64 }
        updatedAt: { type: string, format: date-time, description: "when the counts last changed (an unchanged refresh does not rewrite the row)" }
    CycleSnapshotList:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/CycleSnapshot" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }

    Document:
      type: object
      required: [id, title, content, contentTruncated, slug, projectId, creator, version, createdAt, updatedAt, archivedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        content: { type: string, description: "markdown; cut to 400 characters in lists unless full=true" }
        contentTruncated: { type: boolean }
        slug: { type: string, description: "stable: made once from the first title; GET accepts it in place of the id" }
        projectId: { type: [string, "null"], format: uuid }
        creator: { oneOf: [{ $ref: "#/components/schemas/UserRef" }, { type: "null" }] }
        version: { type: integer, description: "send back as `version` on PATCH for compare-and-swap" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        archivedAt: { type: [string, "null"], format: date-time }
    DocumentList:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Document" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }
    CreateDocumentInput:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 255 }
        content: { type: string, maxLength: 200000 }
        projectId: { type: string, format: uuid, description: "a project of this org" }
    UpdateDocumentInput:
      type: object
      additionalProperties: false
      description: "absent = unchanged; null clears a nullable field"
      properties:
        version: { type: integer, description: "compare-and-swap: 409 version_conflict when stale" }
        title: { type: string, minLength: 1, maxLength: 255 }
        content: { type: [string, "null"], maxLength: 200000 }
        projectId: { type: [string, "null"], format: uuid }

    Token:
      type: object
      required: [id, kind, name, prefix, scopes, user, createdAt, expiresAt, lastUsedAt, revokedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [pat, session, native] }
        name: { type: string }
        prefix: { type: string, description: "first 12 characters of the secret" }
        scopes: { type: array, items: { $ref: "#/components/schemas/Scope" } }
        user: { $ref: "#/components/schemas/UserRef" }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
        lastUsedAt: { type: [string, "null"], format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
    Session:
      type: object
      required: [id, kind, name, createdAt, lastUsedAt, expiresAt, current]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [session, native], description: "`session` is the web login, `native` an app login" }
        name: { type: string, description: "`web session` or `native session`" }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, "null"], format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
        current: { type: boolean, description: "this call used this session" }
    SessionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Session" } }
    RevokedSessions:
      type: object
      required: [revoked]
      properties:
        revoked: { type: integer, format: int64 }
    AgentInput:
      type: object
      additionalProperties: false
      required: [username, name]
      properties:
        username: { type: string, pattern: "^[a-z][a-z0-9_-]{0,38}$", description: "lower-cased and trimmed first; unique on the install" }
        name: { type: string, minLength: 1, maxLength: 200, description: "display name, trimmed" }
        teamAccess: { type: string, enum: [all, selected], description: "default all (decisions-T20 #31)" }
        teams: { type: array, maxItems: 50, items: { type: string }, description: "keys or ids of teams of this org; required and non-empty for selected, refused for all" }
    TokenInput:
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        scopes: { type: array, minItems: 1, items: { $ref: "#/components/schemas/Scope" } }
        user: { type: string, description: "the caller's username or an agent user's (403 for another human); default the caller. admin scope needs an org admin, and is refused (403) from a web session." }
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 3650
          description: "REQUIRED (1-365) for an agent user and for any request from a web session; optional (1-3650) for a human from a bearer token. Cut to a bearer caller token's own expiry."
    CreatedToken:
      type: object
      required: [token, secret]
      properties:
        token: { $ref: "#/components/schemas/Token" }
        secret: { type: string, description: "the only copy; store it now" }
    TokenList:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Token" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }

    GitIntegration:
      type: object
      description: A git host the org takes webhooks from. No secret or token is part of it.
      required: [id, provider, flavor, name, baseUrl, apiBaseUrl, mode, enabled, status, attentionCode, tokenSet, webhookSecretSet, secretPending, webhookUrl, repoCount, createdAt, updatedAt, lastDelivery]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string, enum: [gitlab, github, bitbucket] }
        flavor: { type: [string, "null"], enum: [cloud, self_hosted, null], description: "a label for the UI" }
        name: { type: string, description: "the host name when none was given" }
        baseUrl: { type: string, examples: ["https://gitlab.example.com"] }
        apiBaseUrl: { type: [string, "null"], description: "the admin's override of the derived API root" }
        mode: { type: string, enum: [token, webhook_only] }
        enabled: { type: boolean, description: "false: its secret is refused (401). Hooks stay on the host." }
        status: { type: string, enum: [ok, needs_attention, disabled] }
        attentionCode: { type: [string, "null"], enum: [secret_unreadable, token_rejected, attention_unreachable, hook_failed, null], description: "why status is needs_attention" }
        tokenSet: { type: boolean }
        webhookSecretSet: { type: boolean }
        secretPending: { type: boolean, description: "a rotation holds a pending secret; both secrets are accepted" }
        webhookUrl: { type: string, description: "the URL to paste into the host's webhook form; absolute on PUBLIC_BASE_URL when set, else a path. The secret goes in the host's secret field." }
        repoCount: { type: integer, description: "mapped repositories" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastDelivery: { oneOf: [{ $ref: "#/components/schemas/GitDeliverySummary" }, { type: "null" }], description: "the newest row of the deliveries ring tied to this integration (rows of no integration are not counted); null when there is none" }
    GitIntegrationCreated:
      type: object
      description: "The 201 of a create: a GitIntegration, plus `webhookSecret` (the only copy of a secret the server made, in webhook-only mode)."
      required: [id, provider, flavor, name, baseUrl, apiBaseUrl, mode, enabled, status, attentionCode, tokenSet, webhookSecretSet, secretPending, webhookUrl, repoCount, createdAt, updatedAt, lastDelivery]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string, enum: [gitlab, github, bitbucket] }
        flavor: { type: [string, "null"], enum: [cloud, self_hosted, null], description: "a label for the UI" }
        name: { type: string, description: "the host name when none was given" }
        baseUrl: { type: string, examples: ["https://gitlab.example.com"] }
        apiBaseUrl: { type: [string, "null"], description: "the admin's override of the derived API root" }
        mode: { type: string, enum: [token, webhook_only] }
        enabled: { type: boolean, description: "false: its secret is refused (401). Hooks stay on the host." }
        status: { type: string, enum: [ok, needs_attention, disabled] }
        attentionCode: { type: [string, "null"], enum: [secret_unreadable, token_rejected, attention_unreachable, hook_failed, null], description: "why status is needs_attention" }
        tokenSet: { type: boolean }
        webhookSecretSet: { type: boolean }
        secretPending: { type: boolean, description: "a rotation holds a pending secret; both secrets are accepted" }
        webhookUrl: { type: string, description: "the URL to paste into the host's webhook form; absolute on PUBLIC_BASE_URL when set, else a path. The secret goes in the host's secret field." }
        repoCount: { type: integer, description: "mapped repositories" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastDelivery: { oneOf: [{ $ref: "#/components/schemas/GitDeliverySummary" }, { type: "null" }], description: "the newest row of the deliveries ring tied to this integration (rows of no integration are not counted); null when there is none" }
        webhookSecret: { type: string, description: "shown once; store it now. Absent for a pasted secret and in token mode." }
    GitIntegrationCheck:
      type: object
      description: "A GitIntegration after a token check, plus `login`."
      required: [id, provider, flavor, name, baseUrl, apiBaseUrl, mode, enabled, status, attentionCode, tokenSet, webhookSecretSet, secretPending, webhookUrl, repoCount, createdAt, updatedAt, lastDelivery, login]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string, enum: [gitlab, github, bitbucket] }
        flavor: { type: [string, "null"], enum: [cloud, self_hosted, null], description: "a label for the UI" }
        name: { type: string, description: "the host name when none was given" }
        baseUrl: { type: string, examples: ["https://gitlab.example.com"] }
        apiBaseUrl: { type: [string, "null"], description: "the admin's override of the derived API root" }
        mode: { type: string, enum: [token, webhook_only] }
        enabled: { type: boolean, description: "false: its secret is refused (401). Hooks stay on the host." }
        status: { type: string, enum: [ok, needs_attention, disabled] }
        attentionCode: { type: [string, "null"], enum: [secret_unreadable, token_rejected, attention_unreachable, hook_failed, null], description: "why status is needs_attention" }
        tokenSet: { type: boolean }
        webhookSecretSet: { type: boolean }
        secretPending: { type: boolean, description: "a rotation holds a pending secret; both secrets are accepted" }
        webhookUrl: { type: string, description: "the URL to paste into the host's webhook form; absolute on PUBLIC_BASE_URL when set, else a path. The secret goes in the host's secret field." }
        repoCount: { type: integer, description: "mapped repositories" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastDelivery: { oneOf: [{ $ref: "#/components/schemas/GitDeliverySummary" }, { type: "null" }], description: "the newest row of the deliveries ring tied to this integration (rows of no integration are not counted); null when there is none" }
        login: { type: string, description: "the user the token belongs to; can be empty (Bitbucket)" }
    GitDeliverySummary:
      type: object
      description: The newest row of an integration's deliveries ring.
      required: [receivedAt, result, httpStatus, errorCode]
      properties:
        receivedAt: { type: string, format: date-time }
        result: { $ref: "#/components/schemas/GitDeliveryResult" }
        httpStatus: { type: integer }
        errorCode: { type: [string, "null"], description: "one of our own codes; never host text" }
    GitDeliveryResult:
      type: string
      enum: [processed, ignored, duplicate, unmapped, bad_signature, bad_request, error]
    GitDelivery:
      type: object
      description: One row of the deliveries ring. A summary only.
      required: [id, integrationId, provider, receivedAt, result, event, repoKey, httpStatus, errorCode]
      properties:
        id: { type: string, format: uuid }
        integrationId: { type: [string, "null"], format: uuid, description: "null: the request matched no integration" }
        provider: { type: string, enum: [gitlab, github, bitbucket] }
        receivedAt: { type: string, format: date-time }
        result: { $ref: "#/components/schemas/GitDeliveryResult" }
        event: { type: string, description: "the provider's event name; empty when the request was refused before it was read" }
        repoKey: { type: [string, "null"] }
        httpStatus: { type: integer }
        errorCode: { type: [string, "null"], description: "one of our own codes; never host text" }
    GitDeliveryList:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/GitDelivery" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }
    GitIntegrationList:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/GitIntegration" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }
    CreateGitIntegrationInput:
      type: object
      additionalProperties: false
      required: [provider, baseUrl]
      properties:
        provider: { type: string, enum: [gitlab, github, bitbucket] }
        baseUrl: { type: string, maxLength: 2048, description: "absolute https URL (see the route), no user info, query or fragment; stored lower-case with no default port and no trailing slash" }
        apiBaseUrl: { type: string, maxLength: 2048, description: "override of the derived API root; same checks as baseUrl" }
        name: { type: string, maxLength: 100 }
        mode: { type: string, enum: [token, webhook_only], default: webhook_only }
        token: { type: string, writeOnly: true, description: "token mode only. Write-only." }
        secret: { type: string, minLength: 32, maxLength: 256, pattern: "^[!-~]+$", writeOnly: true, description: "GitLab webhook-only only: a pasted secret. Write-only." }
        enabled: { type: boolean, default: true }
    UpdateGitIntegrationInput:
      type: object
      additionalProperties: false
      description: "absent = unchanged; baseUrl, mode, enabled and name cannot be null; token null keeps, \"\" clears; apiBaseUrl null or \"\" clears"
      properties:
        name: { type: string, maxLength: 100 }
        baseUrl: { type: string, maxLength: 2048 }
        apiBaseUrl: { type: [string, "null"], maxLength: 2048 }
        mode: { type: string, enum: [token, webhook_only] }
        token: { type: [string, "null"], writeOnly: true }
        enabled: { type: boolean }
    GitRepo:
      type: object
      required: [id, integrationId, repoKey, repoPath, team, hookState, hookError, createdAt]
      properties:
        id: { type: string, format: uuid, description: "the mapping id" }
        integrationId: { type: string, format: uuid }
        repoKey: { type: string, description: "the host's repository key as text (what its webhook sends): the numeric id, or for Bitbucket Cloud {workspace uuid}/{repository uuid} in lower case", examples: ["4821"] }
        repoPath: { type: string, examples: [example-org/example-app] }
        team:
          oneOf: [{ $ref: "#/components/schemas/TeamRef" }, { type: "null" }]
          description: "set: only this team's issues are linked from this repository; null: any team of the org"
        hookState: { type: string, enum: [none, active, failed], description: "none: webhook-only, the admin owns the hook. failed: the hook is not on the pending secret (rotation) or was dropped with it." }
        hookError: { type: [string, "null"], description: "our own short code (a provider_* code, not_updated or secret_discarded), never host text" }
        createdAt: { type: string, format: date-time }
    GitRepoList:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/GitRepo" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }
    CreateGitRepoInput:
      type: object
      additionalProperties: false
      properties:
        repoId: { type: string, maxLength: 200, description: "token mode: the id from available-repos" }
        repoKey: { type: string, pattern: "^([0-9]{1,18}|\\{[0-9a-fA-F-]{36}\\}/\\{[0-9a-fA-F-]{36}\\})$", description: "webhook-only: the host's numeric repository id; Bitbucket Cloud: {workspace uuid}/{repository uuid}" }
        repoPath: { type: string, minLength: 1, maxLength: 500, description: "webhook-only: for people; the webhook matches on repoKey" }
        teamId: { type: string, description: "team id or key; empty or absent: any team of the org" }
    UpdateGitRepoInput:
      type: object
      additionalProperties: false
      required: [teamId]
      properties:
        teamId: { type: [string, "null"], description: "team id or key; null clears the team" }
    GitRepoRemoved:
      type: object
      required: [hookRemoved]
      properties:
        hookRemoved: { type: boolean, description: "true: the host confirmed the hook is gone (a 404 counts). false: remove it by hand." }
    HookRefreshResult:
      type: object
      required: [hookState]
      properties:
        hookState: { type: string, enum: [none, active, failed] }
    BackfillResult:
      type: object
      required: [seen, linked, moved, truncated]
      properties:
        seen: { type: integer, minimum: 0, maximum: 200, description: "open changes read" }
        linked: { type: integer, minimum: 0, description: "issues that got a new link" }
        moved: { type: integer, minimum: 0, description: "issues moved forward" }
        truncated: { type: boolean, description: "more open changes were left, or time ran out" }
    AvailableRepo:
      type: object
      required: [repoId, repoKey, repoPath, url, mapped]
      properties:
        repoId: { type: string, description: "opaque; send it back as repoId" }
        repoKey: { type: string }
        repoPath: { type: string }
        url: { type: string }
        mapped: { type: boolean, description: "already mapped for this integration" }
    AvailableRepoPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/AvailableRepo" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }
    RotateGitSecretInput:
      type: object
      additionalProperties: false
      properties:
        secret: { type: string, minLength: 32, maxLength: 256, pattern: "^[!-~]+$", writeOnly: true, description: "GitLab webhook-only only: a pasted secret instead of a made one. Write-only." }
    CommitGitSecretInput:
      type: object
      additionalProperties: false
      properties:
        force: { type: boolean, default: false, description: "token mode: commit although some hooks are not on the pending secret" }
    GitRotateResult:
      type: object
      description: "A GitIntegration after rotate-secret, plus `webhookSecret` (webhook-only, shown once), `committed` and `failedRepos`."
      required: [id, provider, flavor, name, baseUrl, apiBaseUrl, mode, enabled, status, attentionCode, tokenSet, webhookSecretSet, secretPending, webhookUrl, repoCount, createdAt, updatedAt, lastDelivery, committed, failedRepos]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string, enum: [gitlab, github, bitbucket] }
        flavor: { type: [string, "null"], enum: [cloud, self_hosted, null], description: "a label for the UI" }
        name: { type: string, description: "the host name when none was given" }
        baseUrl: { type: string, examples: ["https://gitlab.example.com"] }
        apiBaseUrl: { type: [string, "null"], description: "the admin's override of the derived API root" }
        mode: { type: string, enum: [token, webhook_only] }
        enabled: { type: boolean, description: "false: its secret is refused (401). Hooks stay on the host." }
        status: { type: string, enum: [ok, needs_attention, disabled] }
        attentionCode: { type: [string, "null"], enum: [secret_unreadable, token_rejected, attention_unreachable, hook_failed, null], description: "why status is needs_attention" }
        tokenSet: { type: boolean }
        webhookSecretSet: { type: boolean }
        secretPending: { type: boolean, description: "a rotation holds a pending secret; both secrets are accepted" }
        webhookUrl: { type: string, description: "the URL to paste into the host's webhook form; absolute on PUBLIC_BASE_URL when set, else a path. The secret goes in the host's secret field." }
        repoCount: { type: integer, description: "mapped repositories" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastDelivery: { oneOf: [{ $ref: "#/components/schemas/GitDeliverySummary" }, { type: "null" }], description: "the newest row of the deliveries ring tied to this integration (rows of no integration are not counted); null when there is none" }
        webhookSecret: { type: string, description: "webhook-only: the pending secret, shown once; store it now. Never present in token mode." }
        committed: { type: boolean, description: "the swap is done (token mode, every hook updated)" }
        failedRepos: { type: array, items: { $ref: "#/components/schemas/GitRepo" }, description: "repos whose hook is not on the pending secret yet; empty when committed or webhook-only" }
    WebhookResult:
      type: object
      description: |
        The answer to a git host: a status and nothing else (decisions-T20 #65).
        It never names, lists or counts issues, and it does not depend on
        whether an issue matched: a hidden, a visible and a missing issue give
        the same body. What the event did is in the deliveries ring
        (`GET .../integrations/{integration}/deliveries`, org admins only).
      required: [status]
      properties:
        status:
          type: string
          enum: [processed, ignored, unmapped, duplicate]
          description: "processed: an event that asks for something (a link, a move, a refresh, a review, a check), whether or not an issue matched; also a check delivery sent again (its key is kept only when the check found a link); ignored: an event that asks for nothing (a ping, a fork, another action); unmapped: the repository is not in the map; duplicate: the delivery was seen before"

    # --- platform ---
    MailProvider:
      type: string
      enum: [env, none, postmark, smtp]
    SmtpSecurity:
      type: string
      enum: [starttls, tls, none]
      description: "starttls: plain connect then STARTTLS (required); tls: implicit TLS (port 465); none: no TLS"
    SignupMode:
      type: string
      enum: [invite, approval, closed]
      description: "invite (default): only an org invite adds a person; approval: invites, and public sign-up requests that an org admin approves; closed: neither (decisions-T12)"
    ActiveMail:
      type: object
      required: [transport, source]
      properties:
        transport: { type: string, enum: [postmark, smtp, dev-log, none] }
        source: { type: string, enum: [settings, environment] }
    PlatformSettings:
      type: object
      required: [mailProvider, postmarkFrom, postmarkMessageStream, postmarkTokenSet, smtpHost, smtpPort, smtpSecurity,
        smtpUsername, smtpPasswordSet, smtpFromAddress, smtpFromName, signupMode, signupModeChosen, activeMail, loginAvailable,
        encryptionKeySet, secretsUnreadable, updatedAt, updatedBy]
      properties:
        mailProvider: { $ref: "#/components/schemas/MailProvider" }
        postmarkFrom: { type: string, description: "the From of Postmark mail; empty: not set" }
        postmarkMessageStream: { type: string, description: "empty: outbound" }
        postmarkTokenSet: { type: boolean, description: "a Postmark server token is stored and this server can open it. The token itself is never returned." }
        smtpHost: { type: string }
        smtpPort: { type: integer, minimum: 0, maximum: 65535 }
        smtpSecurity: { $ref: "#/components/schemas/SmtpSecurity" }
        smtpUsername: { type: string, description: "empty: no SMTP AUTH" }
        smtpPasswordSet: { type: boolean, description: "an SMTP password is stored and this server can open it. The password itself is never returned." }
        smtpFromAddress: { type: string }
        smtpFromName: { type: string }
        signupMode: { $ref: "#/components/schemas/SignupMode" }
        signupModeChosen: { type: boolean, description: "a platform admin changed or confirmed the mode (LAUN-56); a save that leaves it alone does not set this" }
        activeMail: { $ref: "#/components/schemas/ActiveMail" }
        loginAvailable: { type: boolean, description: "login can issue codes on this server now (a transport AND AUTH_OTP_PEPPER); false: POST /auth/otp answers 503 login_unavailable" }
        encryptionKeySet: { type: boolean, description: "SETTINGS_ENCRYPTION_KEY is set, so this server can store a secret" }
        secretsUnreadable: { type: boolean, description: "stored secrets were sealed with another key (or none is set); mail falls back to the environment until they are entered again" }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: [string, "null"], format: uuid, description: "the user who saved last; null before the first save" }
    PlatformSettingsInput:
      type: object
      additionalProperties: false
      required: [mailProvider, postmarkFrom, postmarkMessageStream, smtpHost, smtpPort, smtpSecurity, smtpUsername,
        smtpFromAddress, smtpFromName, signupMode]
      properties:
        mailProvider: { $ref: "#/components/schemas/MailProvider" }
        postmarkFrom: { type: string, maxLength: 320, description: "an address or Name <address>; required for provider postmark" }
        postmarkMessageStream: { type: string, maxLength: 100, pattern: "^[A-Za-z0-9_-]*$", description: "empty: outbound" }
        postmarkToken:
          type: [string, "null"]
          maxLength: 512
          writeOnly: true
          description: "absent or null: keep the stored token; empty: clear it; a value: replace it"
        smtpHost: { type: string, maxLength: 253, description: "a host name or IP address, no scheme or port" }
        smtpPort: { type: integer, minimum: 0, maximum: 65535, description: "0 stores the default 587" }
        smtpSecurity: { $ref: "#/components/schemas/SmtpSecurity" }
        smtpUsername: { type: string, maxLength: 256, description: "empty: no SMTP AUTH" }
        smtpPassword:
          type: [string, "null"]
          maxLength: 512
          writeOnly: true
          description: "absent or null: keep the stored password; empty: clear it; a value: replace it. Needs smtpUsername."
        smtpFromAddress: { type: string, maxLength: 254, description: "a plain address; required for provider smtp" }
        smtpFromName: { type: string, maxLength: 100 }
        signupMode: { $ref: "#/components/schemas/SignupMode" }
        signupModeConfirmed:
          type: [boolean, "null"]
          description: "true records the mode as chosen even when it did not change (the org checklist step). Absent, null or false never clears the marker; a change of signupMode records it by itself."
    MailTestResult:
      type: object
      required: [ok, to, activeMail]
      properties:
        ok: { type: boolean, const: true }
        to: { type: string, description: "the caller's address the test email went to" }
        activeMail: { $ref: "#/components/schemas/ActiveMail" }
    # --- end platform ---

    # --- scheduled backups (LAUN-69) ---
    BackupRecipient:
      type: object
      required: [publicKey, fingerprint, shortFingerprint, state, addedAt, addedBy, effectiveAt, removeAt, removeBy]
      properties:
        publicKey: { type: string, description: "the age1... public key (not secret)" }
        fingerprint: { type: string, description: "the full sha256 (64 hex) of the age1... string; the key of the routes" }
        shortFingerprint: { type: string, description: "its first 12 characters" }
        state: { type: string, enum: [pending, active, removing] }
        addedAt: { type: string, format: date-time }
        addedBy: { type: [string, "null"], format: uuid }
        effectiveAt: { type: string, format: date-time, description: "from this time offsite encrypts to the key" }
        removeAt: { type: [string, "null"], format: date-time, description: "set when a removal is scheduled" }
        removeBy: { type: [string, "null"], format: uuid, description: "the admin who scheduled the removal" }
    BackupRecipientList:
      type: object
      required: [items, everHadRecipient, limit]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/BackupRecipient" } }
        everHadRecipient: { type: boolean, description: "the install had a recipient once; every later add is held 24 hours" }
        limit: { type: integer, description: "the most live recipients (5)" }
    AddBackupRecipientInput:
      type: object
      additionalProperties: false
      required: [publicKey]
      properties:
        publicKey: { type: string, maxLength: 200, description: "an age X25519 public key (age1...)" }
    BackupSettings:
      type: object
      required: [installId, signingPublic, notifyOnFailure, notifyOnSuccess, staleAlertHours, updatedAt, updatedBy]
      properties:
        installId: { type: string, description: "8 hex characters; names the remote files" }
        signingPublic: { type: string, description: "the public key that signs the manifests (base64 of 32 bytes); empty until offsite makes it" }
        notifyOnFailure: { type: boolean }
        notifyOnSuccess: { type: boolean }
        staleAlertHours: { type: integer, minimum: 0, maximum: 8760, description: "0 turns the stale alert off" }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: [string, "null"], format: uuid }
    BackupSettingsInput:
      type: object
      additionalProperties: false
      required: [notifyOnFailure, notifyOnSuccess, staleAlertHours]
      properties:
        notifyOnFailure: { type: boolean }
        notifyOnSuccess: { type: boolean }
        staleAlertHours: { type: integer, minimum: 0, maximum: 8760 }
    BackupRun:
      type: object
      required: [id, destinationId, destinationName, dumpId, trigger, status, attempt, willRetry, retryAt, queuedAt,
        startedAt, finishedAt, bytes, sha256, remoteName, steps, errorCode, errorText]
      properties:
        id: { type: string, format: uuid }
        destinationId: { type: [string, "null"], format: uuid, description: "null for an unsaved probe or test, and after the destination was deleted" }
        destinationName: { type: string, description: "kept after the destination is deleted; empty for an unsaved probe or test" }
        dumpId: { type: [string, "null"], format: uuid }
        trigger: { type: string, enum: [schedule, manual, catchup, retry, test, probe, verify, exchange] }
        status: { type: string, enum: [queued, waiting_dump, running, succeeded, failed, interrupted, canceled] }
        attempt: { type: integer }
        willRetry: { type: boolean }
        retryAt: { type: [string, "null"], format: date-time }
        queuedAt: { type: string, format: date-time }
        startedAt: { type: [string, "null"], format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
        bytes: { type: [integer, "null"], format: int64, description: "of the uploaded (encrypted) object" }
        sha256: { type: [string, "null"], description: "of the uploaded (encrypted) object" }
        remoteName: { type: [string, "null"] }
        steps:
          type: array
          description: "a probe run: the fingerprint and whether the chain verified; a test run: connect, auth, write, read, delete, each ok or a safe code"
          items: { type: object, additionalProperties: true }
        errorCode: { type: string, description: "a safe code (dns_failed, auth_failed, ...), or empty" }
        errorText: { type: string, description: "a fixed text; never the remote server's words" }
    BackupRunPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/BackupRun" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }
    BackupDestination:
      type: object
      required: [id, name, type, typeSupported, enabled, enabledSince, config, secretsSet, secretsUnreadable, schedule,
        atUtc, weekday, keepLast, verifyEveryDays, lastRun, createdAt, updatedAt, updatedBy]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 60 }
        type: { $ref: "#/components/schemas/BackupDestinationType" }
        typeSupported: { type: boolean, description: "this build has a driver for the type" }
        enabled: { type: boolean }
        enabledSince: { type: [string, "null"], format: date-time }
        config: { type: object, additionalProperties: true, description: "non-secret settings of the type; holds the TLS pin (`tlsPin`) or SSH host key (`hostKey`) once confirmed" }
        secretsSet: { type: array, items: { type: string }, description: "the names of the stored secrets; never their values" }
        secretsUnreadable: { type: boolean, description: "a secret is stored and this server cannot open it (another or no BACKUP_ENCRYPTION_KEY)" }
        schedule: { type: string, enum: [daily, weekly] }
        atUtc: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", description: "HH:MM UTC" }
        weekday: { type: [integer, "null"], minimum: 0, maximum: 6, description: "0 Sunday to 6 Saturday; set if and only if the schedule is weekly" }
        keepLast: { type: integer, minimum: 1, maximum: 365 }
        verifyEveryDays: { type: integer, minimum: 0, maximum: 90 }
        lastRun:
          oneOf:
            - { $ref: "#/components/schemas/BackupRun" }
            - { type: "null" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: [string, "null"], format: uuid }
    BackupDestinationType:
      type: string
      enum: [s3, webdav, sftp, dropbox]
    BackupDestinationList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/BackupDestination" } }
    CreateBackupDestinationInput:
      type: object
      additionalProperties: false
      required: [name, type, config]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        type: { $ref: "#/components/schemas/BackupDestinationType" }
        config: { type: object, additionalProperties: true, description: "validated by the type's driver" }
        secrets:
          type: object
          writeOnly: true
          additionalProperties: { type: string, maxLength: 16384 }
          description: "write-only; sealed under BACKUP_ENCRYPTION_KEY. Names per type: s3 accessKey, secretKey; webdav password; sftp password, privateKey; dropbox appKey, appSecret"
        schedule: { type: string, enum: [daily, weekly], default: daily }
        atUtc: { type: string, default: "04:15", pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        weekday: { type: [integer, "null"], minimum: 0, maximum: 6, description: "required for weekly, absent or null for daily" }
        keepLast: { type: integer, minimum: 1, maximum: 365, default: 14 }
        verifyEveryDays: { type: integer, minimum: 0, maximum: 90, default: 7 }
        confirmLowKeep: { type: boolean, description: "required when keepLast is 1" }
    UpdateBackupDestinationInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        config: { type: object, additionalProperties: true, description: "the whole config; a change while a stored secret is kept is 400" }
        secrets:
          type: object
          writeOnly: true
          additionalProperties: { type: [string, "null"], maxLength: 16384 }
          description: "per name: absent or null keeps the stored secret, empty clears it, a value replaces it. The Dropbox refreshToken can only be cleared."
        schedule: { type: string, enum: [daily, weekly] }
        atUtc: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        weekday: { type: [integer, "null"], minimum: 0, maximum: 6 }
        keepLast: { type: integer, minimum: 1, maximum: 365 }
        verifyEveryDays: { type: integer, minimum: 0, maximum: 90 }
        enabled: { type: boolean }
        confirmLowKeep: { type: boolean }
    BackupProbeInput:
      type: object
      additionalProperties: false
      required: [type, config]
      properties:
        type: { $ref: "#/components/schemas/BackupDestinationType" }
        config: { type: object, additionalProperties: true }
    BackupTestInput:
      type: object
      additionalProperties: false
      properties:
        confirmedFingerprint: { type: string, minLength: 8, maxLength: 128, description: "the fingerprint the probe showed; saved as the pin or host key when the destination has none" }
    BackupUnsavedTestInput:
      type: object
      additionalProperties: false
      required: [type, config]
      properties:
        type: { $ref: "#/components/schemas/BackupDestinationType" }
        config: { type: object, additionalProperties: true }
        secrets:
          type: object
          writeOnly: true
          additionalProperties: { type: string, maxLength: 16384 }
        useSavedSecretsFrom: { type: [string, "null"], format: uuid, description: "a stored destination whose secrets fill the names left out; its config must equal this one" }
        confirmedFingerprint: { type: string, minLength: 8, maxLength: 128 }
    BackupExchangeInput:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, maxLength: 2048, writeOnly: true, description: "the Dropbox authorization code (single use)" }
    BackupChange:
      type: object
      required: [id, at, actorId, actorUsername, kind, destinationId, destinationName, detail]
      properties:
        id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        actorId: { type: [string, "null"], format: uuid, description: "null for a deploy command" }
        actorUsername: { type: [string, "null"] }
        kind: { type: string, description: "destination_added, destination_deleted, destination_renamed, destination_config_changed, destination_secrets_changed, destination_schedule_changed, destination_retention_changed, destination_enabled, destination_disabled, destination_pin_set, destination_host_key_set, recipient_added, recipient_removal_scheduled, recipient_add_cancelled, recipient_removal_cancelled, recipient_removed_by_host, recipient_cancelled_by_host, notice_settings_changed, or a later kind" }
        destinationId: { type: [string, "null"], format: uuid }
        destinationName: { type: string }
        detail: { type: object, additionalProperties: true, description: "no secret" }
    BackupChangePage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/BackupChange" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }
    BackupDump:
      type: object
      required: [id, fileName, status, startedAt, finishedAt, bytes, migrationVersion, fileRemoved, errorText]
      properties:
        id: { type: string, format: uuid }
        fileName: { type: string }
        status: { type: string, enum: [running, ok, failed] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
        bytes: { type: [integer, "null"], format: int64 }
        migrationVersion: { type: [integer, "null"], format: int64 }
        fileRemoved: { type: boolean, description: "the local file was pruned" }
        errorText: { type: string }
    BackupStatus:
      type: object
      required: [encryptionKeySet, keyMismatch, signingPublic, signingKeyUnreadable, supportedTypes, recipients,
        activeRecipients, everHadRecipient, destinations, enabledDestinations, destinationsUnreadable, newestDump,
        noRecentDump, mailReady, staleAlertHours, staleDestinations, failedDestinations, filesStored, filesNotBackedUp, banners]
      properties:
        encryptionKeySet: { type: boolean, description: "BACKUP_ENCRYPTION_KEY is set on this server" }
        keyMismatch: { type: boolean, description: "the stored key check differs from this server's key" }
        signingPublic: { type: string }
        signingKeyUnreadable: { type: boolean, description: "a signing key is stored and this server cannot open it" }
        supportedTypes: { type: array, items: { $ref: "#/components/schemas/BackupDestinationType" }, description: "the types this build has a driver for" }
        recipients: { type: array, items: { $ref: "#/components/schemas/BackupRecipient" } }
        activeRecipients: { type: integer }
        everHadRecipient: { type: boolean }
        destinations: { type: integer }
        enabledDestinations: { type: integer }
        destinationsUnreadable: { type: integer, description: "destinations whose stored secrets this server cannot open" }
        newestDump:
          oneOf:
            - { $ref: "#/components/schemas/BackupDump" }
            - { type: "null" }
        noRecentDump: { type: boolean, description: "no ok dump finished in the last 36 hours" }
        mailReady: { type: boolean, description: "the platform mail transport can send; false means backup notices and stale alerts are not sent (LAUN-75)" }
        staleAlertHours: { type: integer, minimum: 0, maximum: 8760, description: "the stale-alert setting; 0 turns the stale rule, its banner and its mail off" }
        staleDestinations:
          type: array
          items: { $ref: "#/components/schemas/BackupStaleDestination" }
          description: "enabled destinations whose last success is older than max(staleAlertHours, 2 x the schedule interval)"
        failedDestinations:
          type: array
          items: { $ref: "#/components/schemas/BackupFailedDestination" }
          description: "enabled destinations whose newest backup run failed and will not be retried"
        filesStored: { type: boolean, description: "this server keeps attachments, so they need a backup (LAUN-80)" }
        filesNotBackedUp:
          type: array
          items: { $ref: "#/components/schemas/BackupFilesDestination" }
          description: "with filesStored: enabled destinations whose newest run with a good `files` step finished more than 48 hours ago, or that have none; the `files_not_backed_up` banner"
        banners:
          type: array
          items: { type: string, enum: [encryption_key_missing, key_mismatch, signing_key_missing, signing_key_unreadable, no_active_recipient, no_recent_dump, backup_stale, backup_run_failed, mail_off, files_not_backed_up] }
    BackupStaleDestination:
      type: object
      required: [id, name, lastSuccessAt, since, thresholdHours, lastAlertAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        lastSuccessAt: { type: [string, "null"], format: date-time, description: "the finish of its newest counted success (schedule, catchup, retry or manual run), or null" }
        since: { type: string, format: date-time, description: "where the stale clock counts from: the last success, but never before the destination was created or last enabled" }
        thresholdHours: { type: integer }
        lastAlertAt: { type: [string, "null"], format: date-time, description: "when the last stale mail was claimed" }
    BackupFilesDestination:
      type: object
      required: [id, name, lastBackupAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        lastBackupAt: { type: [string, "null"], format: date-time, description: "the finish of the newest run whose files step succeeded, or null" }
    BackupFailedDestination:
      type: object
      required: [id, name, runId, finishedAt, errorCode, errorText]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        runId: { type: string, format: uuid }
        finishedAt: { type: string, format: date-time }
        errorCode: { type: string }
        errorText: { type: string, description: "a fixed safe text" }
    # --- end scheduled backups (LAUN-69) ---

    # --- sign-up requests, invites and platform admins ---
    SignupCreateRequest:
      type: object
      additionalProperties: false
      required: [email, name, username]
      properties:
        email: { type: string, maxLength: 254, description: "trimmed and lower-cased" }
        name: { type: string, minLength: 1, maxLength: 200 }
        username: { type: string, pattern: "^[a-z][a-z0-9_-]{0,38}$", description: "lower-cased and trimmed first" }
        note: { type: string, maxLength: 1000, description: "optional, for the admins; no control characters but newline and tab" }
    SignupConfirmRequest:
      type: object
      additionalProperties: false
      required: [email, code]
      properties:
        email: { type: string, maxLength: 254 }
        code: { type: string, pattern: "^[0-9]{6}$" }
    SignupRequestStatus:
      type: string
      enum: [pending, approved, rejected, expired]
    SignupRequest:
      type: object
      required: [id, email, name, username, note, status, emailVerified, emailVerifiedAt, createdAt, expiresAt,
        decidedAt, decidedBy, userId, rejectReason, blocked]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        username: { type: string }
        note: { type: string }
        status: { $ref: "#/components/schemas/SignupRequestStatus" }
        emailVerified: { type: boolean, description: "the person entered the code mailed to the address" }
        emailVerifiedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: "a pending request expires then (30 days)" }
        decidedAt: { type: [string, "null"], format: date-time }
        decidedBy: { type: [string, "null"], format: uuid, description: "the admin who approved or rejected" }
        userId: { type: [string, "null"], format: uuid, description: "the user an approval made" }
        rejectReason: { type: string }
        blocked: { type: boolean, description: "the email cannot ask again in this org" }
      example:
        id: 0192f0a4-0000-7000-8000-000000000010
        email: ann@example.com
        name: Ann Example
        username: ann
        note: I work on the iOS app
        status: pending
        emailVerified: true
        emailVerifiedAt: "2026-10-25T10:01:00Z"
        createdAt: "2026-10-25T10:00:00Z"
        expiresAt: "2026-11-24T10:00:00Z"
        decidedAt: null
        decidedBy: null
        userId: null
        rejectReason: ""
        blocked: false
    SignupRequestList:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/SignupRequest" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }
    SignupRejectInput:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 1000 }
        block: { type: boolean, default: false }
    InviteRole:
      type: string
      enum: [member, admin]
    InviteInput:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, maxLength: 254 }
        role: { $ref: "#/components/schemas/InviteRole", description: "default member" }
        teamAccess: { type: string, enum: [all, selected], description: "what the accept gives; default all (decisions-T20 #26). An admin invite is always all (#30)." }
        teams: { type: array, maxItems: 50, items: { type: string }, description: "keys or ids of teams of this org; required and non-empty for selected, refused for all and for role admin" }
    SignupApproveInput:
      type: object
      additionalProperties: false
      description: "Optional body of the approval (decisions-T20 #29); none is all."
      properties:
        teamAccess: { type: string, enum: [all, selected], description: "default all" }
        teams: { type: array, maxItems: 50, items: { type: string }, description: "keys or ids of teams of this org; required and non-empty for selected, refused for all" }
    Invite:
      type: object
      required: [id, email, role, status, emailed, createdBy, createdAt, expiresAt, acceptedAt, acceptedBy, revokedAt, teamAccess, teams]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { $ref: "#/components/schemas/InviteRole" }
        status: { type: string, enum: [pending, accepted, revoked, expired] }
        emailed: { type: boolean, description: "the link went to the address by email (the admin never saw the token)" }
        createdBy: { type: [string, "null"], format: uuid }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        acceptedAt: { type: [string, "null"], format: date-time }
        acceptedBy: { type: [string, "null"], format: uuid }
        revokedAt: { type: [string, "null"], format: date-time }
        teamAccess: { type: string, enum: [all, selected], description: "what the accept gives (decisions-T20 #26)" }
        teams: { type: array, items: { type: string }, description: "the keys of the invite's teams that still exist, sorted; empty for all. A team deleted since the invite was made is not listed." }
    InviteList:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Invite" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }
    CreatedInvite:
      type: object
      required: [invite, emailed]
      description: |
        `emailed` true: the link went to the address only, and `secret` and
        `url` are ABSENT (an admin cannot accept for the person). `emailed`
        false (no working mail): `secret` and `url` are here once; give the
        link to the person.
      properties:
        invite: { $ref: "#/components/schemas/Invite" }
        secret: { type: string, description: "only when emailed is false: the invite token (43 characters); the only copy" }
        url: { type: string, description: "only when emailed is false: the invite link, `<PUBLIC_BASE_URL>/invite#<secret>`" }
        emailed: { type: boolean, description: "the link was queued to the address (mail works)" }
    InviteAcceptInput:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, description: "the fragment of the invite link" }
        name: { type: string, minLength: 1, maxLength: 200, description: "required when the email has no account yet" }
        username: { type: string, pattern: "^[a-z][a-z0-9_-]{0,38}$", description: "required when the email has no account yet" }
    InviteAcceptResponse:
      type: object
      required: [status, org]
      properties:
        status: { type: string, enum: [created, joined] }
        org: { $ref: "#/components/schemas/LoginOrg" }
        session: { $ref: "#/components/schemas/LoginResponse", description: "status created only: the login body" }
    PlatformAdmin:
      type: object
      required: [id, username, name, email, deactivated]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        name: { type: string }
        email: { type: [string, "null"] }
        deactivated: { type: boolean, description: "a deactivated user keeps the flag but does not count as the last platform admin" }
    PlatformAdminList:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PlatformAdmin" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }
    SignupPurgeResult:
      type: object
      required: [deleted]
      properties:
        deleted: { type: integer, description: "requests deleted" }
    AddPlatformAdminInput:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user: { type: string, maxLength: 254, description: "a username or an email" }
