  /api/v1/orgs/{org}/issues:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [issues]
      operationId: listIssues
      summary: List issues (keyset pages, newest first)
      description: |
        Filters combine with AND. Comma-separated lists are allowed for
        `state`, `stateType` and `label` (any of). An unknown query parameter
        is a 400, so a misspelled filter never silently matches everything.
        `description` is cut to 400 characters unless `full=true`
        (`descriptionTruncated` tells you).
      parameters:
        - { name: assignee, in: query, schema: { type: string }, description: "username, `me`, or `none`" }
        - { name: state, in: query, schema: { type: string }, description: "state names or ids, comma-separated" }
        - name: stateType
          in: query
          description: comma-separated
          schema: { type: string, examples: ["started", "backlog,unstarted"] }
        - { name: team, in: query, schema: { type: string }, description: "team key, id, or the Linear id of an imported team" }
        - { name: product, in: query, schema: { type: string }, description: "product slug or canonical id: the union of the issues of ALL its teams, archived teams included. An unknown or another org's product matches nothing; an archived one works. Combines with `team` as AND (LAUN-62)" }
        - { name: label, in: query, schema: { type: string }, description: "label names, comma-separated" }
        - { name: project, in: query, schema: { type: string }, description: "project id or name, or `none` for the issues in no project (a project named none: use its id)" }
        - { name: cycle, in: query, schema: { type: string }, description: "cycle number, `active`, a cycle id, or the Linear id of an imported cycle" }
        - { name: parent, in: query, schema: { type: string }, description: "parent identifier or id" }
        - { name: priority, in: query, schema: { type: integer, minimum: 0, maximum: 4 } }
        - { name: query, in: query, schema: { type: string }, description: "substring of title or description, or a ticket: `LAUN-113` (any case, `#` allowed) or a bare number `113` (that number in every team the other filters allow). Tickets named this way come first." }
        - { name: createdAt, in: query, schema: { type: string }, description: "lower bound: ISO-8601 duration (`-P1D`) or timestamp" }
        - { name: updatedAt, in: query, schema: { type: string }, description: "lower bound: ISO-8601 duration (`-P1D`) or timestamp" }
        - name: orderBy
          in: query
          description: |
            `manual` is the stored board order: ascending `sortOrder`, then id. Ranks are per column
            (team + state), so use it with one `team` and one `state` (a list over several columns
            interleaves them by rank). `updatedAt` and `createdAt` are newest first.
          schema: { type: string, enum: [updatedAt, createdAt, manual], default: updatedAt }
        - { name: sort, in: query, description: "`manual` is the same as `orderBy=manual`; no other value", schema: { type: string, enum: [manual] } }
        - { name: includeArchived, in: query, schema: { type: boolean, default: false } }
        - { name: full, in: query, schema: { type: boolean, default: false } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssueList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [issues]
      operationId: createIssue
      summary: Create an issue; the number is allocated in the same transaction
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateIssueInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/orgs/{org}/issues/{issue}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { $ref: "#/components/parameters/Issue" }
    get:
      tags: [issues]
      operationId: getIssue
      parameters:
        - name: include
          in: query
          description: comma-separated expansions (relations, attachments, stateHistory, comments, changeRequests)
          schema: { type: string, examples: ["relations,attachments,stateHistory,comments,changeRequests"] }
      responses:
        "200":
          description: Issue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [issues]
      operationId: updateIssue
      summary: Partial update; optional compare-and-swap on `version`
      description: |
        Absent fields are left alone; `null` clears a nullable field. With
        `version`, a stale value is `409 version_conflict`. A state change
        writes a history row and every change appends one `issue.updated`
        event, in the same transaction. A PATCH that changes nothing does
        not bump the version.

        **Placement** (manual order): at most one of `sortOrder`, `placeAfter`
        and `placeBefore` (two of them: `400 validation_failed`). With `state`
        it is ONE atomic update: the issue moves to the new column at that
        position. `placeAfter` / `placeBefore` name an issue (id or identifier)
        of the same team that is in the destination column; the server
        computes the rank, renumbers the column when the gap is too small, and
        returns the new `sortOrder`.

        - A neighbour that is unknown, of another org (not told apart from an
          unknown one) or no longer in the destination column is
          `409 stale_placement`: refetch the column (`sort=manual`) and retry.
          Nothing is changed, also not a `state` sent with it.
        - Malformed input (not an issue id, the issue itself, a neighbour of
          another team, two placement fields) is `400 validation_failed`.
        - A `state` change without a placement puts the issue on top of the
          new column.
        - When the placement renumbered the destination column, the response
          has `rebalanced: true` and the `issue.updated` event has
          `rebalanced: true` and `stateId`. The OTHER cards of that column got
          new `sortOrder` values without a new `version` or `updatedAt`, so
          refetch the column; polling by `updatedAt` never sees rank changes
          of other cards.
        - Concurrent drags: last write wins per card; neighbour placement
          keeps both valid.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateIssueInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [issues]
      operationId: deleteIssue
      summary: Delete an issue for good (admin scope)
      description: |
        LAUN-201, docs/internal/decisions-T32-delete-issues.md. A hard delete in
        one transaction. The issue's comments, attachments, relations, activity,
        label links, state changes, subscriptions, git links and notifications
        are removed. Child issues are kept and lose their parent. The attachment
        objects are removed after the commit, best effort. Emits `issue.deleted`
        (ids and the identifier only; no title or body). The number is not
        reused. A repeat is `404`; a token below admin scope is `403
        insufficient_scope`; an issue of another org is `404`.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Overloaded" }

  /api/v1/orgs/{org}/issues/{issue}/activity:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { $ref: "#/components/parameters/Issue" }
    get:
      tags: [issues]
      operationId: listIssueActivity
      summary: Recorded changes of an issue, oldest first
      description: |
        Field edits, label adds and removes and relation removals (LAUN-49,
        docs/internal/decisions-T15-activity.md). State changes, comments,
        attachments and relation adds have their own reads.
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: Activity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/orgs/{org}/issues/{issue}/comments:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { $ref: "#/components/parameters/Issue" }
    get:
      tags: [comments]
      operationId: listComments
      summary: Comments on an issue, oldest first
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommentList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [comments]
      operationId: createComment
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommentInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/orgs/{org}/comments/{comment}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: comment, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [comments]
      operationId: updateComment
      summary: Edit a comment (author only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 100000 }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [comments]
      operationId: deleteComment
      summary: Delete a comment and its replies
      description: |
        Deleting a comment also deletes every reply under it, at any depth.
        So the author (write scope) may delete it only if every reply in that
        whole subtree is also theirs; otherwise the answer is 403 `forbidden`
        and nothing is deleted. A moderator (org admin role AND an
        admin-scoped token) may delete any comment. One `comment.deleted`
        event is emitted per removed comment.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/orgs/{org}/avatar/prepare:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    post:
      tags: [orgs]
      operationId: prepareOrgAvatar
      summary: Start an avatar upload; returns a presigned PUT (15 minutes) (admin scope)
      description: |
        Step 1 of 3 (LAUN-22, decisions-T24). Checks the type (png, jpeg, gif, webp; SVG is
        refused) and the size (1 byte to 2 MiB). Nothing is stored. Step 2: `PUT` exactly
        `sizeBytes` bytes to `uploadUrl` with the `headers`. Step 3: `PUT /api/v1/orgs/{org}/avatar`
        with the `uploadKey`. Never idempotent (the answer holds a credential);
        `Cache-Control: no-store`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrepareAvatarInput" }
      responses:
        "200":
          description: Presigned upload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreparedUpload" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/AttachmentsUnavailable" }

  /api/v1/orgs/{org}/avatar:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [orgs]
      operationId: getOrgAvatar
      summary: The image itself, streamed by the app (any member; cookie or token)
      description: |
        Returns the stored bytes with the stored `Content-Type` (never sniffed),
        `X-Content-Type-Options: nosniff`, `Content-Security-Policy: default-src 'none'; sandbox`,
        `Content-Disposition: inline`, and an `ETag` (`"av<version>"`). `If-None-Match` gets
        `304`. When `v` equals the current version the answer is `Cache-Control: private,
        max-age=31536000, immutable`; otherwise `private, no-cache`. 404 when no avatar is set
        (or the org is in another org).
      parameters:
        - { name: v, in: query, schema: { type: integer }, description: "the version from `avatarUrl`; busts the cache" }
      responses:
        "200":
          description: The image
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "304": { description: Not modified }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/AttachmentsUnavailable" }
    put:
      tags: [orgs]
      operationId: setOrgAvatar
      summary: Confirm the upload and make it the avatar (admin scope)
      description: |
        Step 3. Checks the key (it must be this org's own prepared key), the object (type,
        size 2 MiB at most, magic bytes; a bad object is deleted and the answer is 400), then
        stores it and adds 1 to the avatar version. The replaced object is deleted after the
        commit. Emits `org.updated` (changes `["avatar"]`). Confirming the stored key again changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetAvatarInput" }
      responses:
        "200":
          description: The org after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Org" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { description: Body is not JSON }
        "503": { $ref: "#/components/responses/AttachmentsUnavailable" }
    delete:
      tags: [orgs]
      operationId: clearOrgAvatar
      summary: Remove the avatar (admin scope)
      description: Clearing when none is set changes nothing and emits no event. Otherwise the version goes up and the event is emitted.
      responses:
        "200":
          description: The org after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Org" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/orgs/{org}/attachments/prepare:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    post:
      tags: [attachments]
      operationId: prepareAttachmentUpload
      summary: Start a file upload; returns a presigned PUT (15 minutes)
      description: |
        Step 1 of 3. Checks the type against the allowlist (png, jpeg, gif,
        mp4, plain text, pdf) and the size against 100 MiB, and returns a
        presigned PUT. Nothing is stored yet.

        Step 2: `PUT` exactly `sizeBytes` bytes to `uploadUrl` with the
        `headers` given. The store refuses another size or type (403).

        Step 3: `POST /issues/{issue}/attachments` with `kind: file` and the
        `uploadKey`.

        Never idempotent: an Idempotency-Key header is refused with 400,
        because the response holds a presigned URL (a credential).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrepareUploadInput" }
      responses:
        "200":
          description: Presigned upload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreparedUpload" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/AttachmentsUnavailable" }

  /api/v1/orgs/{org}/issues/{issue}/attachments:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { $ref: "#/components/parameters/Issue" }
    get:
      tags: [attachments]
      operationId: listAttachments
      summary: Attachments on an issue, oldest first
      responses:
        "200":
          description: Attachments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttachmentList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [attachments]
      operationId: createAttachment
      summary: Attach a finished upload (kind file) or a link (kind link)
      description: |
        `kind: file`: the server HEADs the uploaded object and checks its
        type and size again. No object yet is `400 validation_failed`; an
        object of a wrong type or size is deleted and refused with 400. A key
        of another org is 400. The attachment id is the id inside
        `uploadKey`, so the same upload attaches once: a second attach of it
        to the SAME issue returns the existing attachment with `200` (no new
        row, no event; a client retry is safe), and to ANOTHER issue it is
        `409 conflict`.

        Emits `attachment.created` (on `201` only).
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAttachmentInput" }
      responses:
        "200":
          description: The upload was already attached to this issue; the existing attachment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/AttachmentsUnavailable" }

  /api/v1/orgs/{org}/attachments/{attachment}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: attachment, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [attachments]
      operationId: getAttachment
      summary: One attachment
      responses:
        "200":
          description: Attachment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/orgs/{org}/attachments/{attachment}/download:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: attachment, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [attachments]
      operationId: downloadAttachment
      summary: Redirect to the file (302 to a presigned GET, 5 minutes)
      description: |
        Works with a bearer token or the session cookie, so an `<img>` in
        the web app can use `downloadUrl` directly. The store serves the
        stored Content-Type; images, video and PDF are `inline`, plain text
        is `attachment`. The 302 is `Cache-Control: private, no-store` and
        `Referrer-Policy: no-referrer`. A link attachment has no file: 400.
      responses:
        "302":
          description: Redirect to the file
          headers:
            Location:
              description: presigned GET on the object store
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/AttachmentsUnavailable" }

  /api/v1/orgs/{org}/issues/{issue}/relations:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { $ref: "#/components/parameters/Issue" }
    get:
      tags: [relations]
      operationId: listRelations
      responses:
        "200":
          description: Relations grouped by direction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Relations" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [relations]
      operationId: createRelation
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RelationInput" }
      responses:
        "201":
          description: Created, as seen from the issue in the path
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Relation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/orgs/{org}/issues/{issue}/relations/{relation}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { $ref: "#/components/parameters/Issue" }
      - { name: relation, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [relations]
      operationId: deleteRelation
      summary: Delete a relation that touches the issue in the path
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/orgs/{org}/projects:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [projects]
      operationId: listProjects
      summary: List projects (keyset pages, most recently updated first)
      description: |
        Filters combine with AND. An unknown query parameter is a 400.
        `content` is cut to 400 characters unless `full=true`
        (`contentTruncated` tells you).
      parameters:
        - { name: state, in: query, schema: { type: string }, description: "comma-separated: kinds (all statuses of the kind), project status names or project status ids (LAUN-195)" }
        - { name: lead, in: query, schema: { type: string }, description: "username, `me`, or `none`" }
        - { name: team, in: query, schema: { type: string }, description: "team key, id, or the Linear id of an imported team" }
        - { name: label, in: query, schema: { type: string }, description: "a project label id or name; a group matches the labels in it too (LAUN-194)" }
        - { name: query, in: query, schema: { type: string }, description: "substring of the name" }
        - { name: includeArchived, in: query, schema: { type: boolean, default: false } }
        - { name: full, in: query, schema: { type: boolean, default: false } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [projects]
      operationId: createProject
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/orgs/{org}/project-statuses:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [projects]
      operationId: listProjectStatuses
      summary: The org's project statuses, by kind (backlog, planned, started, paused, completed, canceled), then in the org's order
      description: |
        LAUN-195, docs/internal/decisions-T29-project-statuses.md. Every status has one of the six fixed kinds
        (`backlog`, `planned`, `started`, `paused`, `completed`, `canceled`). Every org starts with one status per
        kind. Any scope may read.
      responses:
        "200":
          description: Statuses
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectStatusList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [projects]
      operationId: createProjectStatus
      summary: Add a status at the end of the order (admin scope)
      description: "Emits `project_status.created`. A name is unique in the org in any case (409 `conflict`), has no comma and is not the name of another kind."
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectStatusInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/orgs/{org}/project-statuses/order:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    put:
      tags: [projects]
      operationId: reorderProjectStatuses
      summary: Set the order of all statuses (admin scope)
      description: "`ids` lists every status of the org once, in the new order; anything else is a 400. Emits `project_status.reordered` when the order changed."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReorderProjectStatusesInput" }
      responses:
        "200":
          description: Statuses in the new order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectStatusList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/orgs/{org}/project-statuses/{status}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: status, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [projects]
      operationId: updateProjectStatus
      summary: Rename or recolour a status (admin scope; the kind never changes)
      description: "Emits `project_status.updated`. A change that alters nothing writes nothing."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProjectStatusInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [projects]
      operationId: deleteProjectStatus
      summary: Delete a status (admin scope)
      description: |
        `409 status_in_use` while any project (archived ones too) has the status: move them first.
        `409 status_last_of_kind` when it is the only status of its kind. Emits `project_status.deleted`.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Overloaded" }

  /api/v1/orgs/{org}/projects/{project}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: project, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [projects]
      operationId: getProject
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [projects]
      operationId: updateProject
      summary: Partial update; optional compare-and-swap on `version`
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProjectInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [projects]
      operationId: deleteProject
      summary: Delete a project (admin scope)
      description: |
        LAUN-191, docs/internal/decisions-T26-delete.md. The project's issues and
        documents are kept and lose the project (`projectId` becomes null). Its
        milestones and team links are removed (issues lose their milestone). The
        avatar object is removed after the commit. Emits `project.deleted`.
        A write that names the project and loses a race with this delete answers
        `400 validation_failed` (body) or `404` (path), never 500.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Overloaded" }

  /api/v1/orgs/{org}/projects/{project}/avatar/prepare:
    parameters: [{ $ref: "#/components/parameters/Org" }, { name: project, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [projects]
      operationId: prepareProjectAvatar
      summary: Start an avatar upload; returns a presigned PUT (15 minutes) (write scope)
      description: |
        Step 1 of 3 (LAUN-22, decisions-T24). Checks the type (png, jpeg, gif, webp; SVG is
        refused) and the size (1 byte to 2 MiB). Nothing is stored. Step 2: `PUT` exactly
        `sizeBytes` bytes to `uploadUrl` with the `headers`. Step 3: `PUT /api/v1/orgs/{org}/projects/{project}/avatar`
        with the `uploadKey`. Never idempotent (the answer holds a credential);
        `Cache-Control: no-store`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrepareAvatarInput" }
      responses:
        "200":
          description: Presigned upload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreparedUpload" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/AttachmentsUnavailable" }

  /api/v1/orgs/{org}/projects/{project}/avatar:
    parameters: [{ $ref: "#/components/parameters/Org" }, { name: project, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [projects]
      operationId: getProjectAvatar
      summary: The image itself, streamed by the app (any member; cookie or token)
      description: |
        Returns the stored bytes with the stored `Content-Type` (never sniffed),
        `X-Content-Type-Options: nosniff`, `Content-Security-Policy: default-src 'none'; sandbox`,
        `Content-Disposition: inline`, and an `ETag` (`"av<version>"`). `If-None-Match` gets
        `304`. When `v` equals the current version the answer is `Cache-Control: private,
        max-age=31536000, immutable`; otherwise `private, no-cache`. 404 when no avatar is set
        (or the project is in another org).
      parameters:
        - { name: v, in: query, schema: { type: integer }, description: "the version from `avatarUrl`; busts the cache" }
      responses:
        "200":
          description: The image
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "304": { description: Not modified }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/AttachmentsUnavailable" }
    put:
      tags: [projects]
      operationId: setProjectAvatar
      summary: Confirm the upload and make it the avatar (write scope)
      description: |
        Step 3. Checks the key (it must be this project's own prepared key), the object (type,
        size 2 MiB at most, magic bytes; a bad object is deleted and the answer is 400), then
        stores it and adds 1 to the avatar version. The replaced object is deleted after the
        commit. Emits `project.updated` (changes `["avatar"]`). Confirming the stored key again changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetAvatarInput" }
      responses:
        "200":
          description: The project after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { description: Body is not JSON }
        "503": { $ref: "#/components/responses/AttachmentsUnavailable" }
    delete:
      tags: [projects]
      operationId: clearProjectAvatar
      summary: Remove the avatar (write scope)
      description: Clearing when none is set changes nothing and emits no event. Otherwise the version goes up and the event is emitted.
      responses:
        "200":
          description: The project after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/orgs/{org}/projects/{project}/updates:
    parameters:
