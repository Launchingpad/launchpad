version: "2"
sql:
  - engine: "postgresql"
    # sqlc reads the golang-migrate files directly (it skips *.down.sql), so
    # the generated code can never lag a migration. db/schema.sql is the
    # generated, reviewable snapshot of the same schema (scripts/schema.sh).
    schema: "db/migrations/"
    queries: "db/queries/"
    gen:
      go:
        package: "dbq"
        out: "internal/dbq"
        sql_package: "pgx/v5"
        emit_json_tags: false
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
          - db_type: "date"
            go_type: "time.Time"
          - db_type: "date"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
          - db_type: "text"
            go_type: "string"
